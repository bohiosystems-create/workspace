# docker compose up -d   → app on https://$DOMAIN with automatic Let's Encrypt certificates.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - sitedata:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. siteagent.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]
volumes:
  sitedata:
  caddydata:
