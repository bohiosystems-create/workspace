<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Kinan Site Agent</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%2296%22%20fill%3D%22%231c1c1e%22%2F%3E%3Cpath%20d%3D%22M180%20116%20336%20256%20180%20396%22%20fill%3D%22none%22%20stroke%3D%22%23f26522%22%20stroke-width%3D%2264%22%2F%3E%3C%2Fsvg%3E%0A">
<style>/* Kinan visual language: charcoal chrome, Kinan orange as the single accent, Montserrat,
   white cards on light grey; a matching dark theme (follows the device, toggle in the header). */
:root{
  --font:"Montserrat","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --chrome:#1c1c1e; --chrome-ink:#ffffff; --chrome-soft:rgba(255,255,255,.12);
  --accent:#f26522; --accent-strong:#c84d14; --accent-ink:#ffffff; --accent-soft:#fdebe1; --accent-line:#f3b38f;
  --bg:#f2f2f1; --card:#ffffff; --card-2:#f7f7f5; --ink:#1d1d1f; --ink-2:#3a3a3d; --mute:#6a6a70; --line:#e0e0dd; --line-2:#cbcbc7;
  --scrim:rgba(12,12,14,.55); --shadow:rgba(0,0,0,.16);
  --red:#c62828; --red-soft:#fde7e7; --red-ink:#9b1c1c;
  --green:#2e7d32; --green-soft:#e5f3e8; --green-ink:#1e6b34;
  --amber:#a86400; --amber-soft:#fff3df; --amber-ink:#7d4606;
  --blue:#1f5fd1; --blue-soft:#e6eefc; --blue-ink:#1e4fb0;
  --violet:#6d3fc0; --violet-soft:#efe8fb; --neutral-soft:#ebebe8;
  --pin:#1c1c1e; --pin-ink:#ffffff; --pin-edge:#ffffff;
  /* site plan */
  --p-ground:#dadad6; --p-paper:#f6f5f2; --p-edge:#8d8b84; --p-road:#7a7a7e; --p-road-pub:#5d5d61; --p-cl:#f6f6f6;
  --p-ink:#1f1f22; --p-ink-2:#47474c; --p-halo:#ffffff; --p-stroke:#3b3b40;
  --p-res:#d2d8e1; --p-ret:#f2dccb; --p-hot:#e2d8ee; --p-ame:#d3e9d8; --p-villa:#eee3c6; --p-util:#e1e3e6; --p-civic:#cfe6db; --p-core:#9aa1ab;
  --p-tmp:#f2e5bf; --p-camp:#f1d7c2; --p-batch:#d8d6d2; --p-yard:#f6eed7; --p-waste:#dbeac6; --p-cabin:#fbf6ef;
  --p-tree:#a8d6b2; --p-garden:#cdeccf; --p-water:#9fd3f0;
  --tab:58px; --top:56px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#0d0d0e; --chrome-soft:rgba(255,255,255,.1);
  --accent:#ff7a3d; --accent-strong:#ff8a52; --accent-ink:#1b0d04; --accent-soft:#3a2317; --accent-line:#7a4126;
  --bg:#121213; --card:#1c1c1e; --card-2:#232326; --ink:#f1f1f2; --ink-2:#d2d2d6; --mute:#a2a2a9; --line:#2f2f33; --line-2:#3d3d42;
  --scrim:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.5);
  --red:#ff6b6b; --red-soft:#3b1e20; --red-ink:#ffb4b4; --green:#5cc46b; --green-soft:#1b3121; --green-ink:#a7e4b1;
  --amber:#ffb84d; --amber-soft:#3a2c14; --amber-ink:#ffd699; --blue:#7aa7ff; --blue-soft:#1c2741; --blue-ink:#b7cdff;
  --violet:#b69cff; --violet-soft:#2a2240; --neutral-soft:#2a2a2e;
  --pin:#f1f1f2; --pin-ink:#121213; --pin-edge:#121213;
  --p-ground:#131315; --p-paper:#1c1d20; --p-edge:#55555c; --p-road:#3a3b40; --p-road-pub:#2b2c30; --p-cl:#6b6b70;
  --p-ink:#ececf0; --p-ink-2:#b9b9c1; --p-halo:#131315; --p-stroke:#9a9aa3;
  --p-res:#2d3543; --p-ret:#46352a; --p-hot:#3a3349; --p-ame:#2b3f31; --p-villa:#433b27; --p-util:#33363b; --p-civic:#29403a; --p-core:#58606b;
  --p-tmp:#3f3824; --p-camp:#44322a; --p-batch:#38373a; --p-yard:#34301f; --p-waste:#2f3a24; --p-cabin:#2a2724;
  --p-tree:#2f5a3a; --p-garden:#22402a; --p-water:#1f4b63;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --chrome:#0d0d0e; --chrome-soft:rgba(255,255,255,.1);
  --accent:#ff7a3d; --accent-strong:#ff8a52; --accent-ink:#1b0d04; --accent-soft:#3a2317; --accent-line:#7a4126;
  --bg:#121213; --card:#1c1c1e; --card-2:#232326; --ink:#f1f1f2; --ink-2:#d2d2d6; --mute:#a2a2a9; --line:#2f2f33; --line-2:#3d3d42;
  --scrim:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.5);
  --red:#ff6b6b; --red-soft:#3b1e20; --red-ink:#ffb4b4; --green:#5cc46b; --green-soft:#1b3121; --green-ink:#a7e4b1;
  --amber:#ffb84d; --amber-soft:#3a2c14; --amber-ink:#ffd699; --blue:#7aa7ff; --blue-soft:#1c2741; --blue-ink:#b7cdff;
  --violet:#b69cff; --violet-soft:#2a2240; --neutral-soft:#2a2a2e;
  --pin:#f1f1f2; --pin-ink:#121213; --pin-edge:#121213;
  --p-ground:#131315; --p-paper:#1c1d20; --p-edge:#55555c; --p-road:#3a3b40; --p-road-pub:#2b2c30; --p-cl:#6b6b70;
  --p-ink:#ececf0; --p-ink-2:#b9b9c1; --p-halo:#131315; --p-stroke:#9a9aa3;
  --p-res:#2d3543; --p-ret:#46352a; --p-hot:#3a3349; --p-ame:#2b3f31; --p-villa:#433b27; --p-util:#33363b; --p-civic:#29403a; --p-core:#58606b;
  --p-tmp:#3f3824; --p-camp:#44322a; --p-batch:#38373a; --p-yard:#34301f; --p-waste:#2f3a24; --p-cabin:#2a2724;
  --p-tree:#2f5a3a; --p-garden:#22402a; --p-water:#1f4b63;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.boot{display:grid;place-items:center;align-content:center;gap:14px;height:100%;min-height:100dvh;background:var(--chrome);color:var(--chrome-ink);font-family:var(--font);letter-spacing:.18em;font-size:12px;text-transform:uppercase}
.boot svg{width:44px;height:44px}
.app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
.top{min-height:var(--top);flex:none;background:var(--chrome);color:var(--chrome-ink);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;padding-top:env(safe-area-inset-top)}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand .mark{width:26px;height:30px;flex:none}
.brand .logo-img{height:30px;width:auto}
.brand b{display:block;white-space:nowrap;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.brand em{display:block;font-style:normal;font-size:11px;opacity:.72;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand>div{min-width:0}
.hbtns{flex:none}
.top .who:last-child{display:block;max-width:26vw;overflow:hidden;text-overflow:ellipsis}
.who{background:var(--chrome-soft);border:0;color:var(--chrome-ink);border-radius:16px;padding:6px 11px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.who svg.i{width:16px;height:16px}
.who.icon{padding:6px 8px}
main{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;display:flex;flex-direction:column}
.pane.off{visibility:hidden;pointer-events:none}
.tabs{height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);flex:none;display:flex;background:var(--card);border-top:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);gap:3px}
.tabs button.on{color:var(--accent);box-shadow:inset 0 3px var(--accent)}

/* ---------- map ---------- */
.mapwrap{position:relative;flex:1;min-height:0;background:var(--p-ground)}
.viewport{position:absolute;inset:0;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
.plan{display:block}
.dropping .viewport,.marking{cursor:crosshair}
.ground{fill:var(--p-ground)}
.plot{fill:var(--p-paper);stroke:var(--p-edge);stroke-width:1.5}
.fence{fill:none;stroke:var(--p-ink-2);stroke-width:1;stroke-dasharray:6 4}
.zone{stroke-width:1;stroke-dasharray:10 5;cursor:pointer}
.zone.z1{fill:rgba(90,130,200,.06);stroke:#6b8fc9}.zone.z2{fill:rgba(70,160,100,.07);stroke:#4f9e6a}.zone.z3{fill:rgba(242,101,34,.06);stroke:#e07a45}
.road{fill:var(--p-road)}.public-road{fill:var(--p-road-pub)}.cl{stroke:var(--p-cl);stroke-width:1.2;stroke-dasharray:8 6;fill:none}
.bld{stroke:var(--p-stroke);stroke-width:2;cursor:pointer}
.bld.res{fill:var(--p-res)}.bld.ret{fill:var(--p-ret)}.bld.hot{fill:var(--p-hot)}.bld.ame{fill:var(--p-ame)}.bld.villa{fill:var(--p-villa);stroke-width:1.2}.bld.util{fill:var(--p-util);stroke-width:1.5}.bld.civic{fill:var(--p-civic);stroke-width:1.5}
.core{fill:var(--p-core);stroke:var(--p-stroke);stroke-width:1.5}.col{fill:var(--p-stroke)}.unit{fill:none;stroke:#c9773f;stroke-width:.8}
.basement{fill:rgba(60,150,210,.05);stroke:#3b8fc4;stroke-width:1.8;stroke-dasharray:12 6;cursor:pointer}
.ramp{fill:var(--p-water);stroke:#3b8fc4;cursor:pointer}
.pool{fill:var(--p-water);stroke:#3b8fc4;stroke-width:.6}
.tmp{stroke:var(--p-ink-2);stroke-width:1.2;cursor:pointer}.tmp.office{fill:var(--p-tmp)}.tmp.camp{fill:var(--p-camp)}.tmp.batch{fill:var(--p-batch)}.tmp.yard{fill:var(--p-yard);stroke-dasharray:5 3}.tmp.waste{fill:var(--p-waste)}
.cabin{fill:var(--p-cabin);stroke:#b0643a;stroke-width:.7}.bay{fill:var(--p-util);stroke:var(--p-edge);stroke-width:.4}.silo{fill:var(--p-core);stroke:var(--p-stroke)}
.wash{fill:var(--p-water);stroke:#3b78c4;cursor:pointer}
.crane-r{fill:rgba(242,101,34,.05);stroke:#f26522;stroke-width:1;stroke-dasharray:8 5}
.crane{fill:#f26522;stroke:var(--p-halo);stroke-width:1.5;cursor:pointer}.hoist{fill:#f59a63;stroke:#9a3d12;cursor:pointer}.pump{fill:#e8c64a;stroke:#7a5b10}
.gate{fill:#3f9a5a;stroke:var(--p-halo);stroke-width:1;cursor:pointer}.guard{fill:var(--p-util);stroke:var(--p-ink-2)}
.hse-pt{fill:#3f9a5a;stroke:var(--p-halo);stroke-width:1.5;cursor:pointer}
.tree{fill:var(--p-tree);stroke:#3f8a52;stroke-width:.5}.garden{fill:var(--p-garden);stroke:#5fae72}
.gridline{stroke:#d0543a;stroke-width:.6;stroke-dasharray:10 3 2 3;fill:none}
.u-water,.u-sewer,.u-storm,.u-power,.u-tel,.u-fire{fill:none;stroke-width:2;stroke-linejoin:round}
.u-water{stroke:#3b7fe0}.u-sewer{stroke:#a8642a;stroke-dasharray:8 3}.u-storm{stroke:#1aa093}.u-power{stroke:#e04545;stroke-width:2.5}.u-tel{stroke:#8f62e0;stroke-dasharray:3 3}.u-fire{stroke:#e63e6d;stroke-dasharray:10 4}
.mh{fill:var(--p-paper);stroke-width:1.5}.mh.w{stroke:#3b7fe0}.mh.s{stroke:#a8642a}.mh.st{stroke:#1aa093}.mh.p{stroke:#e04545}.mh.t{stroke:#8f62e0}
.sel{stroke:var(--accent)!important;stroke-width:4!important;filter:drop-shadow(0 0 6px rgba(242,101,34,.75))}
text{paint-order:stroke;stroke:var(--p-halo);stroke-linejoin:round;pointer-events:none;font-family:var(--font)}
.lbl-big{font-weight:700;fill:var(--p-ink);letter-spacing:.08em}.lbl-zone{fill:var(--p-ink-2);font-weight:700;text-anchor:start;letter-spacing:.12em}.lbl-b{font-weight:700;fill:var(--p-ink);letter-spacing:.04em}.lbl-s{fill:var(--p-ink-2)}.lbl-road{fill:#ffffff;stroke:#3a3a3e;font-weight:600}.lbl-c{fill:#d9531b;font-weight:700}.lbl-gate{fill:#ffffff;stroke:none;font-weight:700}.lbl-h{fill:#ffffff;stroke:none;font-weight:700}.lbl-grid{fill:#d0543a}
.lbl-u.w{fill:#3b7fe0}.lbl-u.s{fill:#a8642a}.lbl-u.st{fill:#1aa093}.lbl-u.p{fill:#e04545}.lbl-u.t{fill:#8f62e0}
.pinbody{fill:var(--pin);stroke:var(--pin-edge);stroke-width:2}.pinbody.warn{fill:var(--accent)}
.pintxt{fill:var(--pin-ink);stroke:none;font-size:13px;font-weight:700}
.pinbody.warn+.pintxt{fill:#ffffff}
.pinflag{fill:var(--red);stroke:var(--pin-edge);stroke-width:2}.pinflagtxt{fill:#ffffff;stroke:none;font-size:11px;font-weight:700}
.pin{cursor:pointer}.pin *{pointer-events:all}
.droppoint{fill:rgba(242,101,34,.3);stroke:var(--accent);stroke-width:2}.dropcross{stroke:var(--accent);stroke-width:2}
.gps{fill:#2f6fe0;stroke:#ffffff;stroke-width:3}.gpsacc{fill:rgba(47,111,224,.15);stroke:rgba(47,111,224,.4)}
.mapctl{position:absolute;right:10px;top:70px;display:flex;flex-direction:column;gap:8px;z-index:5}
.stage .mapctl{top:12px}
.mapctl button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:21px;box-shadow:0 2px 6px var(--shadow)}
.mapctl button.on{background:var(--accent-strong);color:var(--accent-ink);border-color:var(--accent-strong)}.mapctl .dim{opacity:.45}
.layers{position:absolute;right:66px;top:70px;background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;box-shadow:0 4px 16px var(--shadow);display:flex;flex-direction:column;gap:9px;z-index:6}
.layers label{display:flex;gap:8px;align-items:center;font-size:14px}.layers input{width:18px;height:18px;accent-color:var(--accent)}
.scaletxt{position:absolute;left:10px;top:64px;background:var(--card);color:var(--ink);opacity:.92;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:600;display:flex;gap:8px;align-items:center;z-index:4;font-variant-numeric:tabular-nums}
.scaletxt i{display:block;height:5px;border:1.5px solid var(--ink);border-top:0}
.banner{position:absolute;left:50%;transform:translateX(-50%);top:70px;background:var(--accent-strong);color:var(--accent-ink);font-weight:600;padding:8px 14px;border-radius:20px;font-size:13px;z-index:7;box-shadow:0 2px 8px var(--shadow);white-space:nowrap}
.stage .banner{top:12px}
.mapsearch{position:absolute;z-index:8;left:10px;right:66px;top:10px}
.mapsearch input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);padding:0 14px;background:var(--card);box-shadow:0 2px 6px var(--shadow)}
.mapsearch ul{list-style:none;margin:4px 0 0;padding:4px;background:var(--card);border-radius:12px;box-shadow:0 6px 18px var(--shadow)}
.mapsearch li button{width:100%;text-align:left;border:0;background:none;padding:11px 10px;display:flex;justify-content:space-between;border-radius:8px}
.mapsearch li button:active,.mapsearch li button:hover{background:var(--accent-soft)}.mapsearch em{font-size:11px;color:var(--mute);font-style:normal;text-transform:uppercase;letter-spacing:.06em}
.fab{white-space:nowrap;position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:6;height:50px;padding:0 20px;border-radius:26px;border:0;background:var(--accent-strong);color:var(--accent-ink);font-weight:600;box-shadow:0 4px 14px var(--shadow);display:flex;align-items:center;gap:8px}
.fab.cancel{background:var(--card);color:var(--ink);border:1px solid var(--line)}

/* ---------- sheets ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:58%;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px var(--shadow);z-index:9;overflow:auto;padding:0 14px 16px;overscroll-behavior:contain}
.sheet.full{max-height:calc(100% - 8px)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 4px;position:sticky;top:0}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin:4px 0 8px}
.sheet h2{margin:0;font-size:18px;font-weight:600;text-wrap:balance}.sub{font-size:12px;color:var(--mute)}
.crumb{border:0;background:none;color:var(--blue);padding:0;font-size:12px}
.x{border:0;background:var(--neutral-soft);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:17px;flex:none}
.actions{display:flex;gap:8px;margin-bottom:6px}
.primary{flex:1;height:48px;border:0;border-radius:12px;background:var(--accent-strong);color:var(--accent-ink);font-weight:600;font-size:15px;letter-spacing:.02em}
.primary:disabled{opacity:.5}
.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.hot{background:var(--chrome);color:var(--chrome-ink);border-color:var(--chrome)}.chip i{font-style:normal;opacity:.75;margin-left:4px}
.chips select{border:1px solid var(--line);border-radius:16px;padding:6px 8px;background:var(--card);font-size:14px}
.doclist,.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.doclist button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card-2);color:var(--ink);border-radius:12px;padding:10px}
.doclist .ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--accent-soft);color:var(--accent)}.doclist .ico svg.i{width:19px;height:19px}.meta{flex:1;min-width:0}.meta b{display:block;font-size:14px;font-weight:600;line-height:1.3}.meta em{font-style:normal;font-size:12px;color:var(--mute)}
.badge{background:var(--red);color:#ffffff;border-radius:11px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700}
.empty{color:var(--mute);font-size:13px;padding:6px 0;list-style:none}
.notes li{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:9px;background:var(--card)}
.notes li.closed{opacity:.55}.notes li.hi{border-color:var(--accent);background:var(--accent-soft)}
.notes .t{flex:1;font-size:14px}.notes .t em{display:block;font-style:normal;font-size:11px;color:var(--mute);margin-top:2px}.notes .t a{color:var(--blue);text-decoration:underline}
.k{font-size:10px;font-weight:800;text-transform:uppercase;border-radius:6px;padding:3px 6px;background:var(--neutral-soft);color:var(--ink-2);flex:none;margin-top:2px;letter-spacing:.06em}
.k.issue{background:var(--red-soft);color:var(--red-ink)}.k.instruction{background:var(--blue-soft);color:var(--blue-ink)}
.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:5px 10px;font-size:12px;flex:none}.mini.on{background:var(--chrome);color:var(--chrome-ink);border-color:var(--chrome)}
.addnote{margin-top:12px;position:sticky;bottom:-16px;background:var(--card);padding:8px 0 4px}
.kinds{display:flex;gap:6px;margin-bottom:6px}.kinds button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:4px 10px;font-size:12px;text-transform:capitalize}.kinds button.on{background:var(--chrome);color:var(--chrome-ink);border-color:var(--chrome)}
.row{display:flex;gap:6px}.row input{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card)}
.row button{height:46px;padding:0 16px;border:0;border-radius:12px;background:var(--accent-strong);color:var(--accent-ink);font-weight:600}.row button:disabled{opacity:.45}
.row .mic{width:46px;padding:0;background:var(--card);color:var(--ink);display:grid;place-items:center;border:1px solid var(--line);font-size:20px}.mic.live{background:var(--red)!important;color:#ffffff;animation:pulse 1s infinite}.mic.big{width:52px;height:52px;border-radius:50%}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(214,40,40,.2)}}

/* ---------- modal / upload ---------- */
.modal{position:absolute;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end}
.modal-card{background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;width:100%;max-height:92%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.modal-card label{display:flex;flex-direction:column;font-size:12px;font-weight:700;color:var(--mute);gap:4px}
.modal-card input,.modal-card select,.modal-card textarea{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--card);font-weight:400;color:var(--ink)}
.modal-card textarea{height:auto;padding:8px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{height:64px;border:2px dashed var(--accent-line);background:var(--accent-soft);color:var(--ink);border-radius:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.placechip{background:var(--accent-soft);border-radius:10px;padding:8px 10px;font-size:13px}.filechip{background:var(--green-soft);color:var(--green-ink);border-radius:10px;padding:8px 10px;font-size:13px;word-break:break-all}
.err{color:var(--red);font-size:13px;padding:4px 0}

/* ---------- viewer ---------- */
.viewer{position:absolute;inset:0;z-index:20;background:var(--chrome);display:flex;flex-direction:column}
.viewer header{flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--chrome);color:var(--chrome-ink)}
.viewer header .x{background:var(--chrome-soft);color:var(--chrome-ink);font-size:22px}
.ttl{flex:1;min-width:0}.ttl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl em{font-style:normal;font-size:11px;opacity:.75;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer .mini{background:var(--chrome-soft);color:var(--chrome-ink);border:0}
.stage{flex:1;position:relative;min-height:0;background:var(--p-ground)}
.pdf{width:100%;height:100%;border:0;background:#ffffff}
.txt{margin:0;padding:14px;height:100%;overflow:auto;background:var(--card);color:var(--ink);white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace}
.mk path{fill:#1c1c1e;stroke:#ffffff;stroke-width:2}.mk.issue path{fill:#c62828}.mk.instruction path{fill:#f26522}.mk.done{opacity:.4}.mk.hi path{stroke:#f26522;stroke-width:4}
.mk text{fill:#ffffff;stroke:none;font-size:13px;font-weight:800}.mk *{pointer-events:all}
.dock{flex:none;background:var(--card);color:var(--ink);max-height:52%;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.dockhead{display:flex;justify-content:space-between;gap:8px;border:0;background:var(--card-2);padding:10px 14px;font-size:12px;font-weight:700;color:var(--mute);text-align:left}
.dock .notes{padding:8px 12px;overflow:auto;flex:1;min-height:0;max-height:180px}
.composer{padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 12px;font-size:13px;font-weight:600}.seg button.on{background:var(--chrome);color:var(--chrome-ink);border-color:var(--chrome)}.seg button.sub{font-weight:400;text-transform:capitalize}
.seg.top{padding:10px 12px 0}.seg.top button{flex:1;padding:9px}
.pendingpin{font-size:12px;background:var(--accent-soft);border-radius:8px;padding:5px 8px}.pendingpin button{border:0;background:none;color:var(--blue);text-decoration:underline}


/* ---------- docs tab ---------- */
.docs{height:100%;overflow:auto;padding-bottom:16px;display:flex;flex-direction:column;gap:8px}
.docs .search{margin:0 12px;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card)}
.docs .chips{padding:0 12px}.docs .doclist,.docs .notes{padding:0 12px}
.toast{position:absolute;left:12px;right:12px;top:60px;background:var(--red);color:#ffffff;border-radius:10px;padding:10px;z-index:50;font-size:13px}

.modal-card input,.modal-card select,.modal-card textarea{min-width:0;width:100%}
.modal-card .primary,.modal-card .pickrow,.modal-card .two,.modal-card .placechip,.modal-card .filechip{flex:none}
.two>label{min-width:0}
.hbtns{display:flex;gap:6px}
/* project tab */
.proj{height:100%;display:flex;flex-direction:column}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 6px;flex:none;scrollbar-width:none}
.ptabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink)}
.ptabs button.on{background:var(--chrome);color:var(--chrome-ink);border-color:var(--chrome)}
.projbody{flex:1;overflow:auto;padding:4px 12px 20px;display:flex;flex-direction:column;gap:8px}
.projbody>*{flex:none}
.projbody .search{height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card);width:100%}
.projbody .chips{padding:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;min-width:0}
.kpis b{font-size:19px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}.kpis b.bad{color:var(--red)}.kpis em{font-style:normal;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rows li{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.rows .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.rows .t b{font-size:14px;font-weight:600;line-height:1.3}
.rows .t em{font-style:normal;font-size:12px;color:var(--mute)}.rows .t em.note{color:var(--ink-2)}
.rows .loc{color:var(--blue);text-decoration:underline}
.bar{display:block;height:4px;background:var(--neutral-soft);border-radius:2px;margin-top:3px}.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.slip{font-size:11px;font-weight:800;border-radius:8px;padding:3px 7px;flex:none;white-space:nowrap}.slip.late{background:var(--red-soft);color:var(--red-ink)}.slip.early,.slip.ok{background:var(--green-soft);color:var(--green-ink)}
.st{font-size:11px;font-weight:700;border-radius:8px;padding:3px 7px;background:var(--neutral-soft);color:var(--ink-2);flex:none;white-space:nowrap}
.st.delayed,.st.rejected,.st.actionrequired,.st.underreview{background:var(--red-soft);color:var(--red-ink)}.st.received,.st.delivered,.st.closed,.st.compliant,.st.ifc,.st.as-built{background:var(--green-soft);color:var(--green-ink)}
.st.intransit,.st.partiallydelivered,.st.inprogress,.st.ifa{background:var(--amber-soft);color:var(--amber-ink)}
.mini.ask{border-color:var(--accent-line);background:var(--accent-soft)}.mini.call{text-decoration:none;color:var(--ink)}
.srcline,.dd{font-size:12px;color:var(--mute)}.dd{text-transform:none;font-weight:500;letter-spacing:0;margin-left:6px}
.disclaimer{font-size:12px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:10px;padding:8px 10px}
.empty.pad{padding:20px}
.tmpwarn{flex:none;background:var(--amber-soft);color:var(--amber-ink);font-size:12px;padding:6px 12px;border-bottom:1px solid var(--line)}
.whoedit input{height:30px;width:150px;border-radius:16px;border:0;padding:0 11px;font-size:13px;background:var(--card);color:var(--ink)}
.fab svg.i{width:19px;height:19px}
.big svg.i{color:var(--accent)}
.mini svg.i{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
.mic svg.i{width:21px;height:21px}
</style></head>

Key dates: NTP 01-Mar-2025; Tower B topping out Nov-2026; Tower A topping out (baseline Apr-2027, forecast May-2027); permanent power 28-Oct-2026; villas D1\u2013D4 handover Oct-2026; retail shell & core Jul/Aug-2027; Civil Defense final inspection Apr-2028 (baseline); practical completion 30-Jun-2028 (baseline), forecast 31-Jul-2028.

Reporting: monthly progress report by 5th working day; schedule updated weekly (data date Thursday).`,["execution plan","scope","key dates","governance","milestones"],"Project Director",400),ut("Structural Design Basis Report KH-STR-DBR-001","Specification","STR","D","site","Codes, loads, materials and structural systems for all buildings.",`Codes: SBC 301 (loads), SBC 303 (foundations), SBC 304 (concrete); wind tunnel study for towers.
Superimposed loads: residential 2.0 kPa live + 1.5 kPa SDL; corridors/lobbies 4.8 kPa; retail 4.8 kPa; plant rooms 7.5 kPa; roof 1.0 kPa + plant. Car park 2.5 kPa.
Towers: RC core + perimeter columns; 250 mm PT flat slabs (f'c 50 MPa); columns 900\xD7900 C60/75 to L20, 800\xD7800 C50 above; transfer slab at L3 (1.8 m thick); core walls 300\u2013600 mm slip-formed. Outrigger at L21 (refuge floor) in Tower A.
Hotel C: RC frame, 225 mm PT slabs, transfer at L2 over ballroom (2.2 m deep beams).
Foundations: Tower A piled raft 3.2 m on 186 \xD81200 bored piles (L=28 m); Tower B 3.0 m raft on 164 piles. Groundwater -4.5 m below NGL; basement designed for uplift.
Durability: sulfate exposure below ground \u2014 GGBS 30\u201350%, max w/c 0.40; cover 50 mm to earth faces, 40 mm soffits, 30 mm top of slab.
Deflection limits: span/250 total, span/500 after partitions; fa\xE7ade interface differential movement \xB115 mm.`,["design basis","loads","slab","columns","foundations","piles","transfer","structure"],"Structural EOR",300),ut("MEP Design Basis Report KH-MEP-DBR-001","Specification","MEP","C","site","Design conditions, cooling, power, water and drainage strategy.",`Outdoor design: 46 \xB0C DB / 20 \xB0C WB summer (Riyadh), 4 \xB0C winter. Indoor: 23 \xB1 1.5 \xB0C, 50% RH max.
Cooling: central chilled-water plant at podium roof \u2014 4 \xD7 1,250 TR water-cooled chillers (N+1), primary-variable flow, 6/13 \xB0C. Towers: FCUs per apartment; AHUs for lobbies with energy recovery.
Power: 33/11 kV substation, 2 \xD7 2.5 MVA at site level plus building transformers; standby generators 3 \xD7 2 MVA for life safety & essential loads; ATS for fire pumps.
Water: potable tank 2 days storage; tower pressure zones with PRV stations every ~12 floors; hot water by heat-pump.
Drainage: separate soil & waste; storm to attenuation then \xD8900 RCP outfall; STP (MBR 1,200 m\xB3/day) \u2014 treated effluent for irrigation & cooling make-up.
BMS: BACnet/IP across all buildings; smart metering per apartment.`,["MEP","cooling","chillers","power","water","design conditions","BMS"],"MEP Consultant",300),ut("Fire & Life Safety Strategy KH-FLS-RPT-001","Specification","FIRE","E","site","Fire strategy: compartments, egress, refuge floors, smoke control, firefighting.",`Codes: SBC 801 / SBC 201 / Civil Defense requirements. All buildings fully sprinklered (light hazard residential, ordinary hazard retail/car park).
Towers: 2 pressurised stairs; refuge floors at Tower A L21 & L35, Tower B L20; 2 h fire-rated cores & shafts; firefighting lift per tower with lobby; wet risers.
Podium: atrium smoke exhaust (mechanical, 8 air changes equivalent), smoke curtains at atrium edges; travel distance limits per occupancy.
Hotel: sleeping risk \u2014 voice alarm, 1 h corridor walls, self-closing doors FD30 to rooms.
Fire-stopping: all service penetrations through compartment walls/floors sealed with tested systems \u2014 inspection & tagging before ceilings close.
Fire department access: 6 m fire lanes around towers, hydrants max 90 m spacing, fire command centre at Tower A ground.
Construction phase: temporary wet riser within 2 floors of working deck; extinguishers each level.`,["fire","refuge","smoke control","sprinklers","compartmentation","egress","firestopping"],"Fire Consultant",200),ut("Fa\xE7ade Performance Specification KH-FAC-SPC-001","Specification","FAC","C","site","Unitised curtain wall performance, tolerances, testing.",`System: unitised curtain wall, 1.5 m module, floor-to-floor 3.6 m, double-glazed low-E IGU (SHGC \u2264 0.25, U \u2264 1.8 W/m\xB2K) per energy compliance.
Wind load per wind tunnel (cladding pressures up to \xB13.4 kPa at corners). Water tightness 600 Pa static; air permeability 1.5 m\xB3/h\xB7m\xB2 at 600 Pa.
Tolerances: embed/cast-in channels \xB15 mm in-plane (drawing A-520) \u2014 see RFI-0157 for \xB110 mm query; bracket adjustment \xB125 mm.
Performance mock-up (PMU) testing passed 2026-03. Site water test on 2% of installed joints (hose test).
Installation: from floor using monorail/spider crane; panels stored vertical on A-frames in Laydown 2.`,["facade","curtain wall","tolerance","embeds","glazing","testing"],"Fa\xE7ade Consultant",260),ut("Vertical Transportation Report KH-VT-RPT-001","Specification","MEP","B","tower-a","Lift numbers, speeds, handling capacity.",`Tower A: 6 passenger lifts 2.5 m/s (1,350 kg), 1 firefighting lift 2.5 m/s, 1 service lift. Tower B: 5 passenger + 1 firefighting + 1 service. Hotel C: 4 guest, 2 service. Podium: 12 escalators, 4 shuttle lifts.
Handling capacity \u2265 12% in 5 min; average interval \u2264 40 s. Machine-room-less traction, destination dispatch in towers.
Installation: rails from L20 upward from Jan-2027 (Tower A), firefighting lift commissioning before Civil Defense inspection.`,["lifts","elevators","escalators","vertical transportation"],"Lift Consultant",240),ut("Geotechnical Investigation Report KH-GEO-RPT-001","Specification","CIV","1","basement","Ground conditions, groundwater, pile capacities.",`Stratigraphy: 0\u20133 m silty sand fill; 3\u20139 m medium dense sand; 9\u201320 m weathered limestone; >20 m limestone (UCS 8\u201325 MPa). Groundwater -4.5 m below NGL (seasonal +0.5 m).
Sulfate & chloride: moderate \u2014 sulfate-resisting measures required. Pile design: \xD81200 bored piles, working load 9,500 kN, socket \u2265 8 m in limestone. Load tests: 2 preliminary static (2.5\xD7 WL) passed; dynamic tests on 5% of working piles.`,["geotechnical","soil","groundwater","piles","foundations"],"Geotechnical Engineer",600),ut("HSE Plan KH-HSE-PLN-001","HSE","HSE","4","site","Project HSE management system \u2014 rules, permits, training, emergency.",`Policy: zero harm. Organisation: HSE Manager, 22 HSE officers (1 per 100 workers), first aiders 1:50.
Permit-to-work types: Hot Work, Work at Height (edge protection removal), Confined Space, Excavation, Electrical LOTO, HV, Critical Lift, Night Works.
