<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Kinan Site Agent</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%232e2e2f%22%2F%3E%3Cg%20transform%3D%22translate(19.7%2013)%20translate(-935.84%20-30.03)%22%3E%3Cpath%20fill%3D%22%23f15a22%22%20d%3D%22M935.84%2030.03%20L945.50%2043.65%20L945.51%2043.65%20L949.35%2049.06%20L945.51%2054.48%20L945.50%2054.48%20L935.86%2068.08%20L946.99%2068.08%20L954.92%2056.91%20L956.64%2054.48%20L956.65%2054.48%20L960.49%2049.06%20L956.65%2043.65%20L956.64%2043.65%20L954.92%2041.22%20L946.98%2030.03%20L935.84%2030.03%20Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E%0A">
<style>/* Kinan design language (shared with the marketing assistant): charcoal header band with the white logo and the
   orange chevron, white panels on a soft faceted page texture, orange uppercase headings with the chevron notch,
   taupe caps labels over big charcoal numbers, orange primary actions, charcoal secondary, square geometry.
   Montserrat stands in for Kinan's Greta Arabic. A matching dark theme follows the device (toggle in the header). */
:root{
  --font:"Montserrat","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --chrome:#2e2e2f; --chrome-ink:#ffffff; --chrome-soft:rgba(255,255,255,.14); --chrome-line:rgba(255,255,255,.32);
  --accent:#f15a22; --accent-strong:#d94a16; --accent-ink:#ffffff; --accent-soft:#fde3d8; --accent-line:#f5b89a;
  --bg:#f4f4f4; --veil:rgba(244,244,244,.74); --card:#ffffff; --card-2:#f7f6f3; --ink:#2e2e2f; --ink-2:#4a4a4c; --mute:#6f6f6f; --taupe:#51473d;
  --line:#e3e2df; --line-2:#cfceca; --hair:rgba(46,46,47,.14);
  --scrim:rgba(46,46,47,.55); --shadow:rgba(46,46,47,.16);
  --red:#d03b3b; --red-soft:#fbe6e6; --red-ink:#9f2727;
  --green:#1f8a4c; --green-soft:#e4f3ea; --green-ink:#176a3a;
  --amber:#b56f00; --amber-soft:#fff3df; --amber-ink:#7d4a06;
  --blue:#1f5fd1; --blue-soft:#e6eefc; --blue-ink:#1e4fb0;
  --violet:#6d3fc0; --violet-soft:#efe8fb; --neutral-soft:#ecebe8;
  --pin:#2e2e2f; --pin-ink:#ffffff; --pin-edge:#ffffff;
  /* site plan */
  --p-ground:#dcdbd7; --p-paper:#f6f5f2; --p-edge:#8d8b84; --p-road:#8a8a8e; --p-road-pub:#636367; --p-cl:#f6f6f6;
  --p-ink:#2e2e2f; --p-ink-2:#55555a; --p-halo:#ffffff; --p-stroke:#3b3b40;
  --p-res:#c9d3e2; --p-ret:#f0d6bf; --p-hot:#dccfea; --p-ame:#cfe6d4; --p-villa:#eadfbf; --p-util:#d9dce0; --p-civic:#cde5d6; --p-core:#8f98a4;
  --p-tmp:#efe0b5; --p-camp:#edd2bb; --p-batch:#cfcdc8; --p-yard:#f1e9cf; --p-waste:#dde9c8; --p-cabin:#f7efe2;
  --p-tree:#a8d6b2; --p-garden:#cdeccf; --p-water:#9fd3f0;
  --tab:58px; --top:58px; --r:2px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#1b1b1c; --chrome-soft:rgba(255,255,255,.12); --chrome-line:rgba(255,255,255,.3);
  --accent:#ff6a33; --accent-strong:#ff7a45; --accent-ink:#1b0d04; --accent-soft:#3d2217; --accent-line:#7a4126;
  --bg:#161617; --veil:rgba(22,22,23,.9); --card:#232325; --card-2:#2a2a2d; --ink:#f1efec; --ink-2:#d3d1cc; --mute:#a7a39d; --taupe:#b8ab98;
  --line:#333336; --line-2:#44444a; --hair:rgba(241,239,236,.16);
  --scrim:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.5);
  --red:#ff6b6b; --red-soft:#3b1e20; --red-ink:#ffb4b4; --green:#5cc46b; --green-soft:#1b3121; --green-ink:#a7e4b1;
  --amber:#ffb84d; --amber-soft:#3a2c14; --amber-ink:#ffd699; --blue:#7aa7ff; --blue-soft:#1c2741; --blue-ink:#b7cdff;
  --violet:#b69cff; --violet-soft:#2a2240; --neutral-soft:#2e2e31;
  --pin:#f1efec; --pin-ink:#161617; --pin-edge:#161617;
  --p-ground:#121214; --p-paper:#1e1f22; --p-edge:#55555c; --p-road:#3c3d42; --p-road-pub:#2a2b2f; --p-cl:#6b6b70;
  --p-ink:#ececf0; --p-ink-2:#b9b9c1; --p-halo:#141416; --p-stroke:#9a9aa3;
  --p-res:#2d3543; --p-ret:#46352a; --p-hot:#3a3349; --p-ame:#2b3f31; --p-villa:#433b27; --p-util:#33363b; --p-civic:#29403a; --p-core:#58606b;
  --p-tmp:#3f3824; --p-camp:#44322a; --p-batch:#38373a; --p-yard:#34301f; --p-waste:#2f3a24; --p-cabin:#2a2724;
  --p-tree:#2f5a3a; --p-garden:#22402a; --p-water:#1f4b63;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --chrome:#1b1b1c; --chrome-soft:rgba(255,255,255,.12); --chrome-line:rgba(255,255,255,.3);
  --accent:#ff6a33; --accent-strong:#ff7a45; --accent-ink:#1b0d04; --accent-soft:#3d2217; --accent-line:#7a4126;
  --bg:#161617; --veil:rgba(22,22,23,.9); --card:#232325; --card-2:#2a2a2d; --ink:#f1efec; --ink-2:#d3d1cc; --mute:#a7a39d; --taupe:#b8ab98;
  --line:#333336; --line-2:#44444a; --hair:rgba(241,239,236,.16);
  --scrim:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.5);
  --red:#ff6b6b; --red-soft:#3b1e20; --red-ink:#ffb4b4; --green:#5cc46b; --green-soft:#1b3121; --green-ink:#a7e4b1;
  --amber:#ffb84d; --amber-soft:#3a2c14; --amber-ink:#ffd699; --blue:#7aa7ff; --blue-soft:#1c2741; --blue-ink:#b7cdff;
  --violet:#b69cff; --violet-soft:#2a2240; --neutral-soft:#2e2e31;
  --pin:#f1efec; --pin-ink:#161617; --pin-edge:#161617;
  --p-ground:#121214; --p-paper:#1e1f22; --p-edge:#55555c; --p-road:#3c3d42; --p-road-pub:#2a2b2f; --p-cl:#6b6b70;
  --p-ink:#ececf0; --p-ink-2:#b9b9c1; --p-halo:#141416; --p-stroke:#9a9aa3;
  --p-res:#2d3543; --p-ret:#46352a; --p-hot:#3a3349; --p-ame:#2b3f31; --p-villa:#433b27; --p-util:#33363b; --p-civic:#29403a; --p-core:#58606b;
  --p-tmp:#3f3824; --p-camp:#44322a; --p-batch:#38373a; --p-yard:#34301f; --p-waste:#2f3a24; --p-cabin:#2a2724;
  --p-tree:#2f5a3a; --p-garden:#22402a; --p-water:#1f4b63;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.caps{font-size:10px;font-weight:700;letter-spacing:.28em;text-transform:uppercase}

/* ---------- boot ---------- */
.boot{display:grid;place-items:center;align-content:center;gap:18px;height:100%;min-height:100dvh;background:#2e2e2f;color:#ffffff;font-family:var(--font);letter-spacing:.3em;font-size:11px;text-transform:uppercase;text-align:center}
.boot .logo{height:46px;width:auto}
.boot .mark{width:22px;height:34px}
.boot .tag{opacity:.6;letter-spacing:.4em;font-size:9px}

/* ---------- shell ---------- */
.app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;position:relative;overflow:hidden;background-color:var(--bg);background-image:linear-gradient(var(--veil),var(--veil)),var(--texture,none);background-size:cover;background-position:center}
.top{min-height:var(--top);flex:none;background:var(--chrome);color:var(--chrome-ink);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;padding-top:env(safe-area-inset-top);box-shadow:0 2px 18px rgba(46,46,47,.18);z-index:3}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand .logo{height:30px;width:auto;flex:none}
.brand .logo-img{height:30px;width:auto}
.brand b{display:block;white-space:nowrap;font-size:9.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;opacity:.92}
.brand em{display:block;font-style:normal;font-size:10.5px;opacity:.66;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand>div{min-width:0;border-left:1px solid var(--chrome-line);padding-left:12px}
.hbtns{flex:none;display:flex;gap:6px;align-items:center}
.top .chev{display:inline-flex;margin-left:2px}.top .chev .mark{width:15px;height:23px}
.top .who:last-of-type{display:block;max-width:33vw;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.who{background:transparent;border:1px solid var(--chrome-line);color:var(--chrome-ink);border-radius:var(--r);padding:6px 10px;font-size:11px;font-weight:600;letter-spacing:.06em;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:border-color .2s,background .2s}
.who:hover{border-color:var(--accent);background:rgba(241,90,34,.15)}
.who svg.i{width:16px;height:16px}
.who.icon{padding:6px 7px}
.whoedit input{height:30px;width:150px;border-radius:var(--r);border:1px solid var(--chrome-line);padding:0 11px;font-size:13px;background:var(--chrome);color:var(--chrome-ink)}
main{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;display:flex;flex-direction:column}
.pane.off{visibility:hidden;pointer-events:none}
.tabs{height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:3}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);gap:4px;transition:color .2s}
.tabs button.on{color:var(--accent);box-shadow:inset 0 3px var(--accent)}
.tmpwarn{flex:none;background:var(--amber-soft);color:var(--amber-ink);font-size:12px;padding:6px 12px;border-bottom:1px solid var(--line)}
.toast{position:absolute;left:12px;right:12px;top:66px;background:var(--red);color:#ffffff;border-radius:var(--r);padding:10px;z-index:50;font-size:13px}

/* ---------- map (2D sheet) ---------- */
.mapwrap{position:relative;flex:1;min-height:0;background:var(--p-ground)}
.viewport{position:absolute;inset:0;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
.plan{display:block}
.dropping .viewport,.marking{cursor:crosshair}
.ground{fill:var(--p-ground)}
.plot{fill:var(--p-paper);stroke:var(--p-edge);stroke-width:1.5}
.fence{fill:none;stroke:var(--p-ink-2);stroke-width:1;stroke-dasharray:6 4}
.zone{stroke-width:1;stroke-dasharray:10 5;cursor:pointer}
.zone.z1{fill:rgba(90,130,200,.06);stroke:#6b8fc9}.zone.z2{fill:rgba(70,160,100,.07);stroke:#4f9e6a}.zone.z3{fill:rgba(241,90,34,.06);stroke:#e07a45}
.road{fill:var(--p-road)}.public-road{fill:var(--p-road-pub)}.cl{stroke:var(--p-cl);stroke-width:1.2;stroke-dasharray:8 6;fill:none}
.bld{stroke:var(--p-stroke);stroke-width:2;cursor:pointer}
.bld.res{fill:var(--p-res)}.bld.ret{fill:var(--p-ret)}.bld.hot{fill:var(--p-hot)}.bld.ame{fill:var(--p-ame)}.bld.villa{fill:var(--p-villa);stroke-width:1.2}.bld.util{fill:var(--p-util);stroke-width:1.5}.bld.civic{fill:var(--p-civic);stroke-width:1.5}
.core{fill:var(--p-core);stroke:var(--p-stroke);stroke-width:1.5}.col{fill:var(--p-stroke)}.unit{fill:none;stroke:#c9773f;stroke-width:.8}
.basement{fill:rgba(60,150,210,.05);stroke:#3b8fc4;stroke-width:1.8;stroke-dasharray:12 6;cursor:pointer}
.ramp{fill:var(--p-water);stroke:#3b8fc4;cursor:pointer}
.pool{fill:var(--p-water);stroke:#3b8fc4;stroke-width:.6}
.tmp{stroke:var(--p-ink-2);stroke-width:1.2;cursor:pointer}.tmp.office{fill:var(--p-tmp)}.tmp.camp{fill:var(--p-camp)}.tmp.batch{fill:var(--p-batch)}.tmp.yard{fill:var(--p-yard);stroke-dasharray:5 3}.tmp.waste{fill:var(--p-waste)}
.cabin{fill:var(--p-cabin);stroke:#b0643a;stroke-width:.7}.bay{fill:var(--p-util);stroke:var(--p-edge);stroke-width:.4}.silo{fill:var(--p-core);stroke:var(--p-stroke)}
.wash{fill:var(--p-water);stroke:#3b78c4;cursor:pointer}
.crane-r{fill:rgba(241,90,34,.05);stroke:#f15a22;stroke-width:1;stroke-dasharray:8 5}
.crane{fill:#f15a22;stroke:var(--p-halo);stroke-width:1.5;cursor:pointer}.hoist{fill:#f59a63;stroke:#9a3d12;cursor:pointer}.pump{fill:#e8c64a;stroke:#7a5b10}
.gate{fill:#3f9a5a;stroke:var(--p-halo);stroke-width:1;cursor:pointer}.guard{fill:var(--p-util);stroke:var(--p-ink-2)}
.hse-pt{fill:#3f9a5a;stroke:var(--p-halo);stroke-width:1.5;cursor:pointer}
.tree{fill:var(--p-tree);stroke:#3f8a52;stroke-width:.5}.garden{fill:var(--p-garden);stroke:#5fae72}
.gridline{stroke:#d0543a;stroke-width:.6;stroke-dasharray:10 3 2 3;fill:none}
.u-water,.u-sewer,.u-storm,.u-power,.u-tel,.u-fire{fill:none;stroke-width:2;stroke-linejoin:round}
.u-water{stroke:#3b7fe0}.u-sewer{stroke:#a8642a;stroke-dasharray:8 3}.u-storm{stroke:#1aa093}.u-power{stroke:#e04545;stroke-width:2.5}.u-tel{stroke:#8f62e0;stroke-dasharray:3 3}.u-fire{stroke:#e63e6d;stroke-dasharray:10 4}
.mh{fill:var(--p-paper);stroke-width:1.5}.mh.w{stroke:#3b7fe0}.mh.s{stroke:#a8642a}.mh.st{stroke:#1aa093}.mh.p{stroke:#e04545}.mh.t{stroke:#8f62e0}
.sel{stroke:var(--accent)!important;stroke-width:4!important;filter:drop-shadow(0 0 6px rgba(241,90,34,.75))}
text{paint-order:stroke;stroke:var(--p-halo);stroke-linejoin:round;pointer-events:none;font-family:var(--font)}
.lbl-big{font-weight:700;fill:var(--p-ink);letter-spacing:.08em}.lbl-zone{fill:var(--p-ink-2);font-weight:700;text-anchor:start;letter-spacing:.12em}.lbl-b{font-weight:700;fill:var(--p-ink);letter-spacing:.04em}.lbl-s{fill:var(--p-ink-2)}.lbl-road{fill:#ffffff;stroke:#3a3a3e;font-weight:600}.lbl-c{fill:#d9531b;font-weight:700}.lbl-gate{fill:#ffffff;stroke:none;font-weight:700}.lbl-h{fill:#ffffff;stroke:none;font-weight:700}.lbl-grid{fill:#d0543a}
.lbl-u.w{fill:#3b7fe0}.lbl-u.s{fill:#a8642a}.lbl-u.st{fill:#1aa093}.lbl-u.p{fill:#e04545}.lbl-u.t{fill:#8f62e0}
.pinbody{fill:var(--pin);stroke:var(--pin-edge);stroke-width:2}.pinbody.warn{fill:var(--accent)}
.pintxt{fill:var(--pin-ink);stroke:none;font-size:13px;font-weight:700}
.pinbody.warn+.pintxt{fill:#ffffff}
.pinflag{fill:var(--red);stroke:var(--pin-edge);stroke-width:2}.pinflagtxt{fill:#ffffff;stroke:none;font-size:11px;font-weight:700}
.pin{cursor:pointer}.pin *{pointer-events:all}
.droppoint{fill:rgba(241,90,34,.3);stroke:var(--accent);stroke-width:2}.dropcross{stroke:var(--accent);stroke-width:2}
.gps{fill:#2f6fe0;stroke:#ffffff;stroke-width:3}.gpsacc{fill:rgba(47,111,224,.15);stroke:rgba(47,111,224,.4)}
.mapctl{position:absolute;right:10px;top:70px;display:flex;flex-direction:column;gap:6px;z-index:5}
.stage .mapctl{top:12px}
.mapctl button{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;box-shadow:0 2px 6px var(--shadow);transition:background .2s,color .2s}
.mapctl button.txt{font-size:11px;font-weight:700;letter-spacing:.12em}
.mapctl button.on{background:var(--accent);color:#ffffff;border-color:var(--accent)}.mapctl .dim{opacity:.45}
.layers{position:absolute;right:62px;top:70px;background:var(--card);color:var(--ink);border-radius:var(--r);border-top:2px solid var(--accent);padding:10px 12px;box-shadow:0 4px 16px var(--shadow);display:flex;flex-direction:column;gap:9px;z-index:6}
.layers label{display:flex;gap:8px;align-items:center;font-size:14px}.layers input{width:18px;height:18px;accent-color:var(--accent)}
.scaletxt{position:absolute;left:10px;top:64px;background:var(--card);color:var(--ink);opacity:.92;border-radius:var(--r);padding:3px 8px;font-size:11px;font-weight:600;display:flex;gap:8px;align-items:center;z-index:4;font-variant-numeric:tabular-nums}
.scaletxt i{display:block;height:5px;border:1.5px solid var(--ink);border-top:0}
.banner{position:absolute;left:50%;transform:translateX(-50%);top:70px;background:var(--accent);color:#ffffff;font-weight:700;padding:8px 14px;border-radius:var(--r);font-size:11px;letter-spacing:.12em;text-transform:uppercase;z-index:7;box-shadow:0 2px 8px var(--shadow);white-space:nowrap}
.stage .banner{top:12px}
.mapsearch{position:absolute;z-index:8;left:10px;right:62px;top:10px}
.mapsearch input{width:100%;height:44px;border-radius:var(--r);border:1px solid var(--line);padding:0 14px;background:var(--card);box-shadow:0 2px 6px var(--shadow)}
.mapsearch ul{list-style:none;margin:4px 0 0;padding:4px;background:var(--card);border-radius:var(--r);border-top:2px solid var(--accent);box-shadow:0 6px 18px var(--shadow)}
.mapsearch li button{width:100%;text-align:left;border:0;background:none;padding:11px 10px;display:flex;justify-content:space-between;border-radius:var(--r)}
.mapsearch li button:active,.mapsearch li button:hover{background:var(--accent-soft)}.mapsearch em{font-size:10px;color:var(--taupe);font-style:normal;text-transform:uppercase;letter-spacing:.16em;font-weight:700}
.fab{white-space:nowrap;position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:6;height:48px;padding:0 22px;border-radius:var(--r);border:0;background:var(--accent);color:#ffffff;font-weight:700;font-size:11px;letter-spacing:.2em;text-transform:uppercase;box-shadow:0 10px 30px rgba(241,90,34,.35);display:flex;align-items:center;gap:10px;transition:transform .2s,box-shadow .2s}
.fab:active{transform:translateX(-50%) translateY(1px)}
.fab.cancel{background:var(--card);color:var(--ink);border:1px solid var(--ink);box-shadow:0 4px 14px var(--shadow)}
.fab svg.i{width:18px;height:18px}
/* 3D model */
.plan.iso{background:transparent}
.blk,.crane3{cursor:pointer}.blk *,.crane3 *{pointer-events:all}
.sel3d{filter:drop-shadow(0 0 8px rgba(241,90,34,.8))}
.pinsel .pinbody{stroke:var(--accent);stroke-width:3}

/* ---------- sheets ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:58%;background:var(--card);border-radius:4px 4px 0 0;border-top:3px solid var(--accent);box-shadow:0 -10px 40px var(--shadow);z-index:9;overflow:auto;padding:0 14px 16px;overscroll-behavior:contain}
.sheet.full{max-height:calc(100% - 8px)}
.grab{width:44px;height:4px;border-radius:2px;background:var(--line-2);margin:8px auto 4px;position:sticky;top:0}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin:4px 0 8px}
.sheet h2{margin:0;font-size:18px;font-weight:600;text-wrap:balance;letter-spacing:.01em}.sub{font-size:12px;color:var(--mute)}
.crumb{border:0;background:none;color:var(--accent-strong);padding:0;font-size:12px;font-weight:600}
.x{border:1px solid var(--line);background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:var(--r);font-size:17px;flex:none}

.lbl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:16px 0 8px}

.chips select{border:1px solid var(--line-2);border-radius:var(--r);padding:6px 8px;background:var(--card);font-size:14px}
.doclist,.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

.badge{background:var(--red);color:#ffffff;border-radius:var(--r);min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700}
.empty{color:var(--mute);font-size:13px;padding:6px 0;list-style:none}

.k{font-size:9px;font-weight:700;text-transform:uppercase;border-radius:var(--r);padding:3px 6px;border:1px solid var(--line-2);color:var(--taupe);flex:none;margin-top:2px;letter-spacing:.16em}
.k.issue{border-color:var(--red);color:var(--red)}.k.instruction{border-color:var(--blue);color:var(--blue)}
.mini{border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:var(--r);padding:5px 10px;font-size:12px;font-weight:600;flex:none}.mini.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.mini svg.i{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
.addnote{margin-top:12px;position:sticky;bottom:-16px;background:var(--card);padding:8px 0 4px}
.kinds{display:flex;gap:6px;margin-bottom:6px}.kinds button{border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:var(--r);padding:4px 10px;font-size:12px;text-transform:capitalize;font-weight:600}.kinds button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.row{display:flex;gap:6px}.row input{flex:1;min-width:0;height:46px;border:1px solid var(--line-2);border-radius:var(--r);padding:0 12px;background:var(--card)}
.row button{height:46px;padding:0 16px;border:0;border-radius:var(--r);background:var(--accent);color:#ffffff;font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.row button:disabled{opacity:.45}
.row .mic{width:46px;padding:0;background:var(--card);color:var(--ink);display:grid;place-items:center;border:1px solid var(--line-2);font-size:20px}.mic.live{background:var(--red)!important;color:#ffffff;animation:pulse 1s infinite}.mic.big{width:52px;height:52px;border-radius:50%}
.mic svg.i{width:21px;height:21px}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(208,59,59,.2)}}

/* ---------- modal / upload ---------- */
.modal{position:absolute;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end}
.modal-card{background:var(--card);color:var(--ink);border-radius:4px 4px 0 0;border-top:3px solid var(--accent);width:100%;max-height:92%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}

.pickrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{height:64px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:var(--r);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.big svg.i{color:var(--accent-strong)}
.placechip{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:var(--r);padding:8px 10px;font-size:13px}.filechip{background:var(--green-soft);color:var(--green-ink);border-radius:var(--r);padding:8px 10px;font-size:13px;word-break:break-all}

.mk text{fill:#ffffff;stroke:none;font-size:13px;font-weight:800}.mk *{pointer-events:all}
.dock{flex:none;background:var(--card);color:var(--ink);max-height:52%;display:flex;flex-direction:column;border-top:3px solid var(--accent)}
.dockhead{display:flex;justify-content:space-between;gap:8px;border:0;background:var(--card-2);padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--taupe);text-align:left}
.dock .notes{padding:8px 12px;overflow:auto;flex:1;min-height:0;max-height:180px}
.composer{padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:var(--r);padding:5px 12px;font-size:12px;font-weight:600;text-transform:capitalize}.seg button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.seg.top{padding:10px 12px 0}.seg.top button{flex:1;padding:9px}
.pendingpin{font-size:12px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:var(--r);padding:5px 8px}.pendingpin button{border:0;background:none;color:var(--accent-strong);text-decoration:underline}

/* ---------- docs tab ---------- */

.projbody{flex:1;overflow:auto;padding:10px 12px 24px;display:flex;flex-direction:column;gap:10px}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.kpis b,.kpi b{font-size:24px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.01em}.kpis b.bad,.kpi b.bad{color:var(--red)}
.kpis em,.kpi em{font-style:normal;font-size:9px;color:var(--taupe);text-transform:uppercase;letter-spacing:.2em;font-weight:700;order:-1}
.kpi span{font-size:10.5px;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-top:2px solid var(--accent);padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px}
.panel>header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.panel p{margin:2px 0 0;font-size:11.5px;color:var(--mute)}
.panel .side{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;justify-items:center}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rows li{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px}
.rows .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.rows .t b{font-size:14px;font-weight:600;line-height:1.3}
.rows .t em{font-style:normal;font-size:12px;color:var(--mute)}.rows .t em.note{color:var(--ink-2)}
.rows .loc{color:var(--accent-strong);text-decoration:underline}
.bar{display:block;height:4px;background:var(--neutral-soft);margin-top:3px}.bar i{display:block;height:100%;background:var(--accent)}
.slip{font-size:10px;font-weight:800;letter-spacing:.06em;border-radius:var(--r);padding:3px 7px;flex:none;white-space:nowrap;border:1px solid}.slip.late{border-color:var(--red);color:var(--red)}.slip.early,.slip.ok{border-color:var(--green);color:var(--green)}
.st{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:var(--r);padding:3px 7px;border:1px solid var(--line-2);color:var(--ink-2);flex:none;white-space:nowrap}
.st.delayed,.st.rejected,.st.actionrequired,.st.underreview{border-color:var(--red);color:var(--red)}.st.received,.st.delivered,.st.closed,.st.compliant,.st.ifc,.st.as-built{border-color:var(--green);color:var(--green)}
.st.intransit,.st.partiallydelivered,.st.inprogress,.st.ifa{border-color:var(--amber);color:var(--amber)}
.mini.ask{border-color:var(--accent);color:var(--accent-strong)}.mini.call{text-decoration:none;color:var(--ink)}
.srcline,.dd{font-size:12px;color:var(--mute)}.dd{text-transform:none;font-weight:500;letter-spacing:0;margin-left:6px}
.disclaimer{font-size:12px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:var(--r);padding:8px 10px}
.empty.pad{padding:20px}

/* ---------- chart kit ---------- */
.kc{position:relative}.kc svg{display:block;width:100%;height:auto;overflow:visible}
.kc-floor{fill:var(--card-2)}

.kc-chip{display:inline-block;white-space:nowrap;border:1px solid;border-radius:var(--r);font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:2px 8px;background:var(--card)}
.ring{display:block}.ring-t{fill:none;stroke:var(--neutral-soft);stroke-width:9}.ring-f{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:butt;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.ring-tick{stroke:var(--ink);stroke-width:2.5}.ring-v{fill:var(--ink);stroke:none;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}.ring-l{fill:var(--taupe);stroke:none;font-size:7.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.ring-p{fill:var(--mute);stroke:none;font-size:8px}
.gauge{display:flex;flex-direction:column;align-items:center;gap:3px}.gauge svg{display:block;overflow:visible}.gauge-v{fill:var(--ink);stroke:none;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}.gauge-l{font-size:8.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe)}
.donut{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.donut svg{flex:none;overflow:visible}.donut-c{fill:var(--ink);stroke:none;font-size:15px;font-weight:600}.donut-s{fill:var(--mute);stroke:none;font-size:8px;letter-spacing:.1em;text-transform:uppercase}
.donut-l{list-style:none;margin:0;padding:0;flex:1;min-width:120px;display:flex;flex-direction:column;gap:5px;font-size:12px}
.donut-l li{display:flex;align-items:center;gap:8px}.donut-l i{width:10px;height:10px;flex:none;border-radius:1px}.donut-l span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.donut-l b{font-variant-numeric:tabular-nums}
.tl{display:block;width:100%;height:auto;overflow:visible}.tl text{stroke:none}
.kc svg text,.ring text,.gauge text,.donut text{stroke:none;pointer-events:none}

/* ---------- motion ---------- */
@media (prefers-reduced-motion:no-preference){

  .kpis>*:nth-child(2){animation-delay:.05s}.kpis>*:nth-child(3){animation-delay:.1s}.kpis>*:nth-child(4){animation-delay:.15s}

  .rows li:nth-child(2),.doclist button:nth-child(2){animation-delay:.04s}.rows li:nth-child(3),.doclist button:nth-child(3){animation-delay:.08s}.rows li:nth-child(4),.doclist button:nth-child(4){animation-delay:.12s}.rows li:nth-child(5),.doclist button:nth-child(5){animation-delay:.16s}.rows li:nth-child(6){animation-delay:.2s}.rows li:nth-child(7){animation-delay:.24s}.rows li:nth-child(8){animation-delay:.28s}
  .sheet{animation:kSheet .4s cubic-bezier(.2,.8,.2,1) both}.modal-card{animation:kSheet .35s cubic-bezier(.2,.8,.2,1) both}.modal{animation:kFade .25s ease both}
  .viewer{animation:kFade .25s ease both}.layers,.mapsearch ul{animation:kPop .22s cubic-bezier(.2,.8,.2,1) both}
  .top .chev{animation:kNudge 3s ease-in-out 1.2s infinite}.boot .mark{animation:kNudge 1.4s ease-in-out infinite}
  .fab{animation:kPop .45s cubic-bezier(.34,1.56,.64,1) .2s both}
  .pindrop{transform-box:fill-box;transform-origin:50% 100%;animation:pinDrop .7s cubic-bezier(.34,1.56,.64,1) both}
  .rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise3d .9s cubic-bezier(.2,.8,.2,1) both}
  .ghost,.lbl3{animation:kFade .6s ease .6s both}
  .live{animation:livePulse 1.6s ease-in-out infinite}
  .kc-gy{transform-box:fill-box;transform-origin:50% 100%;animation:kcGrowY 1s cubic-bezier(.34,1.3,.64,1) both}
  .kc-fade{animation:kcFade .6s ease both}
  .kc-pop{transform-box:fill-box;transform-origin:center;animation:kcPop .5s cubic-bezier(.34,1.56,.64,1) both}
  .kc-draw{stroke-dasharray:1;animation:kcDraw 1.6s cubic-bezier(.4,0,.2,1) both}
  .tabs button.on svg.i{animation:kPop .35s cubic-bezier(.34,1.56,.64,1) both}
}
@keyframes kUp{from{opacity:0;transform:translateY(10px)}}
@keyframes kSheet{from{opacity:0;transform:translateY(26px)}}

@keyframes kPop{from{opacity:0;transform:scale(.86)}}

Towers: RC core + perimeter columns; 250 mm PT flat slabs (f'c 50 MPa); columns 900\xD7900 C60/75 to L20, 800\xD7800 C50 above; transfer slab at L3 (1.8 m thick); core walls 300\u2013600 mm slip-formed. Outrigger at L21 (refuge floor) in Tower A.

Cooling: central chilled-water plant at podium roof \u2014 4 \xD7 1,250 TR water-cooled chillers (N+1), primary-variable flow, 6/13 \xB0C. Towers: FCUs per apartment; AHUs for lobbies with energy recovery.
Power: 33/11 kV substation, 2 \xD7 2.5 MVA at site level plus building transformers; standby generators 3 \xD7 2 MVA for life safety & essential loads; ATS for fire pumps.
Water: potable tank 2 days storage; tower pressure zones with PRV stations every ~12 floors; hot water by heat-pump.
Drainage: separate soil & waste; storm to attenuation then \xD8900 RCP outfall; STP (MBR 1,200 m\xB3/day) \u2014 treated effluent for irrigation & cooling make-up.
BMS: BACnet/IP across all buildings; smart metering per apartment.`,["MEP","cooling","chillers","power","water","design conditions","BMS"],"MEP Consultant",300),Tt("Fire & Life Safety Strategy KH-FLS-RPT-001","Specification","FIRE","E","site","Fire strategy: compartments, egress, refuge floors, smoke control, firefighting.",`Codes: SBC 801 / SBC 201 / Civil Defense requirements. All buildings fully sprinklered (light hazard residential, ordinary hazard retail/car park).

Podium: atrium smoke exhaust (mechanical, 8 air changes equivalent), smoke curtains at atrium edges; travel distance limits per occupancy.
Hotel: sleeping risk \u2014 voice alarm, 1 h corridor walls, self-closing doors FD30 to rooms.
Fire-stopping: all service penetrations through compartment walls/floors sealed with tested systems \u2014 inspection & tagging before ceilings close.
Fire department access: 6 m fire lanes around towers, hydrants max 90 m spacing, fire command centre at Tower A ground.

Performance mock-up (PMU) testing passed 2026-03. Site water test on 2% of installed joints (hose test).

Monitoring: daily inspections, weekly HSE inspection report, monthly HSE committee, KPIs (TRIR, LTIFR, near-miss reporting rate).
Incident reporting: all incidents/near misses reported within 1 h to HSE officer; investigation within 48 h.`,["HSE plan","permits","rules","safety","heat stress","PPE"],"HSE Manager",200),Tt("Emergency Response Plan KH-HSE-ERP-002","HSE","HSE","2","site","Evacuation, muster, medical emergency, fire, tower rescue.",`Alarm: site siren (continuous = evacuate). Muster points: M1 south near Gate 1, M2 east. Headcount by area supervisors using biometric attendance list.

own 50 mm.",tags:["floor plan","apartments","core"],ago:14,pin:[385,235]}),Qe({title:"Slab Framing & PT Layout \u2014 Tower A L12",category:"Drawing",discipline:"STR",revision:"D",locationId:"tower-a-l12",drawing:"structural",summary:"250 mm PT slab, 900\xD7900 columns, C60/75 core walls.",text:"Slab thickness 250 mm post-tensioned, f'c 50 MPa. Columns 900\xD7900 mm C60/75 up to L20, then 800\xD7800 C50. Core walls 300 mm slip-formed. Cover 40 mm soffit, 30 mm top. PT stressing at 7 days once cylinder strength \u226525 MPa. Tendon layout banded in E-W direction, distributed N-S. Revision D adds extra trimmer bars at lift pit opening.",tags:["slab","post-tensioned","PT","thickness","columns","rebar"],ago:9,pin:[405,250]}),Qe({title:"MEP Coordination Plan \u2014 Tower A L12",category:"Drawing",discipline:"MEP",revision:"B",locationId:"tower-a-l12",drawing:"mep",summary:"Coordinated services: CHW, fire main, power tray, drainage.",text:"Chilled water CHWS/R \xD8150 runs corridor ceiling at +3.05 m. Fire wet riser \xD8100 in riser room. Power tray 300\xD750 at +2.85 m. Clash noted at grid C/3: CHW pipe vs PT beam \u2014 sleeve through beam approved by structural, see RFI-0142. Drainage \xD8110 falls 1:80 to shaft.",tags:["clash","chilled water","fire","services","coordination"],ago:6}),Qe({title:"Typical Floor Plan \u2014 Tower B L20",category:"Drawing",discipline:"ARC",revision:"B",locationId:"tower-b-l20",drawing:"floorplan",summary:"Tower B typical floor, 6 apartments.",text:"Tower B Level 20. 6 apartments, larger 3BR layouts. Two lifts serving each lobby. Refuge area at L20 (mid-height refuge floor).",tags:["floor plan","refuge"],ago:20}),Qe({title:"Building Section 1-1 \u2014 Tower A",category:"Drawing",discipline:"ARC",revision:"C",locationId:"tower-a",drawing:"section",summary:"Typical section, floor-to-floor heights.",text:"Section through core. Typical f-f 3.60 m. Ground lobby 6.0 m double-height. Transfer slab at L3. Roof plant room +155.4 m.",tags:["section","height","levels"],ago:25}),Qe({title:"Site Logistics Plan \u2014 Rev F",category:"Drawing",discipline:"CIV",revision:"F",locationId:"site",drawing:"logistics",summary:"Traffic routes, laydown, crane radii.",text:"One-way perimeter ring road anti-clockwise. Gate 2 for trucks only (no pedestrians). TC1/TC2 radii overlap over podium \u2014 tower crane interference zone protocol applies. Laydown 1 formwork, Laydown 3 precast. Muster points M1/M2.",tags:["logistics","traffic","crane","laydown"],ago:4}),Qe({title:"Concrete Specification \u2014 Section 03 30 00",category:"Specification",discipline:"STR",revision:"A",locationId:"site",summary:"Structural concrete grades, slump, curing, testing frequency.",text:"Grades: C60/75 core & columns to L20, C50 slabs, C40 podium slab, C35 blinding. Max w/c 0.40. Slump at pour 180\xB130 mm (SCC for cores 650\xB150 mm flow). Cement CEM I + 30% GGBS. Curing: 7 days wet curing minimum, curing compound on vertical elements. Test cubes: 1 set (6 cubes) per 50 m\xB3 or per pour, whichever is more frequent; 3 at 7 d, 3 at 28 d. Max concrete temperature at placing 32\xB0C \u2014 summer pours night only between 22:00 and 06:00.",tags:["concrete","grade","slump","curing","cube","temperature"],ago:120}),Qe({title:"Waterproofing Specification \u2014 Basement",category:"Specification",discipline:"ARC",revision:"B",locationId:"basement",summary:"Crystalline admixture + HDPE membrane system for raft and walls.",text:"Raft: crystalline admixture 1% by cement weight plus 2 mm HDPE pre-applied membrane under blinding. Walls: post-applied 4 mm torch-on membrane + 50 mm protection board. Water stops: PVC 250 mm at all construction joints, hydrophilic strips at pipe penetrations. Flood test 72 hours on B1 podium transfer slab before screed. Ground water table at -4.5 m from natural ground level.",tags:["waterproofing","membrane","raft","flood test","water"],ago:90}),Qe({title:"RFI-0142 \u2014 CHW pipe vs PT beam at C/3 (L12)",category:"RFI",discipline:"MEP",locationId:"tower-a-l12",revision:"1",summary:"MEP requests beam sleeve at grid C/3. Structural response: approved with trimmer bars.",text:"Raised by MEP subcontractor 02-Sep. Query: CHW \xD8150 pipe clashes with PT beam B12 at C/3, L12 (typical for L8\u2013L18). Response (Structural EOR, 09-Sep): 200 mm sleeve permitted in web at mid-span only, min 450 mm clear from support; add 2T16 trimmer bars each side; PT tendons to be deviated \u2014 do not cut tendons. Status: CLOSED for L12; L13+ to follow same detail. Cost impact: nil. Time impact: nil.",tags:["RFI","clash","beam","sleeve","PT"],by:"MEP Coordinator",ago:21}),Qe({title:"RFI-0157 \u2014 Fa\xE7ade bracket embed position, Tower B",category:"RFI",discipline:"ARC",locationId:"tower-b",revision:"0",summary:"Fa\xE7ade contractor queries cast-in channel tolerance. Awaiting response.",text:"Fa\xE7ade contractor requests confirmation of cast-in channel tolerance \xB110 mm vs. \xB15 mm shown on drawing A-520. Channels already cast on L2\u2013L9 at \xB110 mm. Status: OPEN \u2014 awaiting architect response, due 05-Oct. If \xB15 mm is enforced, 38 channels on L2\u2013L9 require remedial drill-and-anchor.",tags:["RFI","facade","embed","tolerance","open"],by:"Fa\xE7ade Coordinator",ago:6}),Qe({title:"ITR \u2014 Rebar & Formwork Inspection, Tower A L12 Slab",category:"Inspection",discipline:"QA",locationId:"tower-a-l12",revision:"1",summary:"Pre-pour inspection passed with 3 minor comments closed on site.",text:"Inspection 28-Sep-2026, Tower A L12 slab. Inspected by QA/QC & Consultant. Rebar: spacing OK, cover blocks 40 mm verified, lap lengths 50d. Comments: (1) 3 \xD7 chairs missing near edge C/6 \u2014 corrected; (2) PT anchors need additional spiral at D/2 \u2014 corrected; (3) sleeve at C/3 not yet boxed \u2014 corrected. Formwork: levels \xB15 mm, propping to drawing. Outcome: APPROVED TO POUR 29-Sep. Concrete C50, 312 m\xB3, pump TC1 area.",tags:["inspection","pre-pour","rebar","formwork","approved"],by:"QA/QC Engineer",ago:2}),Qe({title:"ITR \u2014 Post-tension Stressing Record, Tower A L11",category:"Inspection",discipline:"QA",locationId:"tower-a-l11",revision:"1",summary:"Stressing completed, elongations within \xB17%.",text:"Stressing 25-Sep L11. Strength at stressing 31 MPa (\u226525). 96 tendons, average elongation +3.1%, max +5.8%, all within \xB17%. Grouting scheduled 27-Sep. Notes: two tendons at grid D/5 showed 6.4% \u2014 accepted by PT specialist.",tags:["post-tension","stressing","elongation"],by:"PT Specialist",ago:5}),Qe({title:"Concrete Cube Results \u2014 Raft Tower B (28-day)",category:"Inspection",discipline:"QA",locationId:"tower-b-b3",revision:"1",summary:"All 28-day cubes exceed C50 target.",text:"Raft pour Tower B, 62 cube sets. 28-day mean 67.4 MPa, min 61.0 MPa vs. characteristic 50 MPa. All pass. Lab: Kinan Materials Testing Lab.",tags:["cubes","concrete","raft","strength"],by:"Materials Engineer",ago:40}),Qe({title:"Method Statement \u2014 Tower Crane TC1/TC2 Interference Zone",category:"Method Statement",discipline:"HSE",locationId:"tc1",revision:"2",summary:"Protocol for overlapping crane slew envelopes above the podium.",text:"TC1 and TC2 jibs overlap over the podium. TC2 jib lower by 6 m; slew limiters programmed. No simultaneous lifts inside overlap zone; radio call & confirmation required. Max wind for lifting 38 km/h (hold), 50 km/h stop. Banksman required at all times. Lifts >80% SWL need lift plan approved by Lifting Supervisor.",tags:["crane","lifting","wind","interference","slew"],by:"HSE Manager",ago:30}),Qe({title:"Method Statement \u2014 Night Concrete Pours (Summer)",category:"Method Statement",discipline:"STR",locationId:"batching",revision:"1",summary:"Hot-weather concreting controls.",text:"Pours 22:00\u201306:00 when ambient >35\xB0C. Chilled mixing water + ice; aggregate shaded & sprayed. Max placing temperature 32\xB0C, tested each truck. Fog misting after finishing; curing compound within 30 min. Night lighting 150 lux mi
