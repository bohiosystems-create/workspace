<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kinan Site Agent</title>
<style>
/*CSS*/
.app{max-width:none}
.modal,.viewer{position:fixed}
.keybox{font-size:12px;color:var(--mute)}
.hidden{display:none!important}
.mapsearch ul:empty{display:none}
.seg.kinds{gap:6px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="logo">▟</span><div><b id="pname"></b><em id="psub"></em></div></div>
    <div style="display:flex;gap:6px"><button class="who" id="btnSettings">⚙ AI</button><button class="who" id="btnWho"></button></div>
  </header>
  <main>
    <section class="pane" id="pane-map">
      <div class="mapsearch"><input id="msearch" type="search" placeholder="Find a place: Tower A, TC1, Gate 2, batching…" autocomplete="off"><ul id="mresults"></ul></div>
      <div class="mapwrap" id="mapwrap">
        <div class="viewport" id="mapvp"><svg id="mapsvg" class="plan"></svg></div>
        <div class="banner hidden" id="dropbanner">Tap the exact spot on the plan to attach a document</div>
        <div class="mapctl">
          <button id="zin" aria-label="Zoom in">＋</button><button id="zout" aria-label="Zoom out">－</button>
          <button id="zfit" aria-label="Fit site">⤢</button><button id="zgps" class="dim" aria-label="My location">◎</button>
          <button id="zlayers" aria-label="Layers">▤</button>
        </div>
        <div class="layers hidden" id="layerbox"></div>
        <div class="scaletxt"><i id="scalebar" style="width:80px"></i><span id="scalelbl"></span></div>
      </div>
      <button class="fab" id="fab">📌 Pin a document to the plan</button>
      <button class="fab cancel hidden" id="fabcancel">Cancel</button>
      <div class="sheet hidden" id="sheet"></div>
    </section>
    <section class="pane off" id="pane-agent">
      <div class="chat">
        <div class="chat-h"><span class="dot" id="agentdot"></span><span class="nm" id="agentname"></span><span class="here" id="here"></span><span class="sp"></span>
          <button class="mini" id="btnTalk">🔊 Voice off</button><button class="mini" id="btnClear">Clear</button></div>
        <div class="msgs" id="msgs"></div>
        <div class="composer chatbar"><div class="err hidden" id="chaterr"></div>
          <div class="row"><button class="mic big hidden" id="chatmic" aria-label="Talk">🎙</button><input id="chatin" placeholder="Ask or say “note: …”"><button id="chatsend">Send</button></div></div>
      </div>
    </section>
    <section class="pane off" id="pane-docs"><div class="docs" id="docs"></div></section>
  </main>
  <nav class="tabs">
    <button data-tab="map" class="on"><span>🗺</span>Site map</button>
    <button data-tab="agent"><span>💬</span>Agent</button>
    <button data-tab="docs"><span>📁</span>Documents</button>
  </nav>
  <div class="viewer hidden" id="viewer"></div>
  <div class="modal hidden" id="modal"></div>
</div>

<script id="seed" type="application/json">/*DATA*/</script>
<script>
"use strict";
const SEED = JSON.parse(document.getElementById("seed").textContent);
const PLAN = SEED.plan, GEO = SEED.geo;
const CATEGORIES = ["Drawing","Specification","RFI","Inspection","Method Statement","Permit","HSE","Submittal","Minutes","Snag List","Variation","Photo","Other"];
const ICON = {Drawing:"📐",Specification:"📘",RFI:"❓",Inspection:"✅","Method Statement":"🛠",Permit:"🪪",HSE:"🦺",Submittal:"📦",Minutes:"🗒","Snag List":"🔧",Variation:"💰",Photo:"📷",Other:"📄"};
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = (p) => p + "_" + Math.random().toString(16).slice(2, 12);
const fmtDate = (iso) => new Date(iso).toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
const SVGNS = "http://www.w3.org/2000/svg";

/* ================================ state + persistence (IndexedDB) ================================ */
let S = null; // {project, locations, docs, notes, author, chat}
const files = new Map(); // docId -> Blob (uploaded)
const idb = {
  db: null,
  open() { return new Promise((res) => { try { const r = indexedDB.open("kinan-site-agent", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => res(); } catch { res(); } }); },
  get(k) { return new Promise((res) => { if (!this.db) return res(undefined); const q = this.db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); },
  set(k, v) { return new Promise((res) => { if (!this.db) return res(); const t = this.db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); }); },
  keys() { return new Promise((res) => { if (!this.db) return res([]); const q = this.db.transaction("kv").objectStore("kv").getAllKeys(); q.onsuccess = () => res(q.result); q.onerror = () => res([]); }); },
};
let saveT = 0;
function save() { clearTimeout(saveT); saveT = setTimeout(() => idb.set("state", JSON.parse(JSON.stringify(S))), 150); }
const setting = (k, d = "") => { try { return localStorage.getItem("kinan." + k) ?? d; } catch { return d; } };
const setSetting = (k, v) => { try { localStorage.setItem("kinan." + k, v); } catch {} };

/* ================================ model helpers ================================ */
const locById = (id) => S.locations.find((l) => l.id === id);
const locPath = (id) => { const o = []; let c = locById(id); while (c) { o.unshift(c.name); c = c.parentId ? locById(c.parentId) : null; } return o.join(" › "); };
const rootOf = (id) => { let c = locById(id); while (c && c.parentId) { const p = locById(c.parentId); if (!p) break; c = p; } return c; };
function descendants(id) { const s = new Set([id]); let g = true; while (g) { g = false; for (const l of S.locations) if (l.parentId && s.has(l.parentId) && !s.has(l.id)) { s.add(l.id); g = true; } } return s; }
const short = (n) => n.split(" — ").pop();
const norm = (x) => x.toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();

function resolveLocation(q) {
  const s = String(q || "").trim().toLowerCase(); if (!s) return null;
  const all = S.locations, byId = all.find((l) => l.id.toLowerCase() === s); if (byId) return byId;
  const nq = norm(s);
  let m = nq.match(/^(.*?)\s*(?:level|lvl|floor|l)\s*(\d{1,2})$/);
  if (m) { const p = resolveLocation(m[1]); if (p) { const h = all.find((l) => l.id === p.id + "-l" + m[2]); if (h) return h; } }
  m = nq.match(/^(.*?)\s*(?:basement|b)\s*([123])$/);
  if (m) { const p = resolveLocation(m[1]); if (p) { const h = all.find((l) => l.id === p.id + "-b" + m[2]); if (h) return h; } }
  const ex = all.find((l) => norm(l.name) === nq || (l.aliases || []).some((a) => norm(a) === nq)); if (ex) return ex;
  const toks = nq.split(" ").filter((t) => t && !["the", "at", "in", "on", "of"].includes(t));
  if (toks.length) { const h = all.filter((l) => l.type !== "level").filter((l) => [l.name, ...(l.aliases || [])].some((n) => { const w = norm(n).split(" "); return toks.every((t) => w.includes(t)); })).sort((a, b) => a.name.length - b.name.length)[0]; if (h) return h; }
  return all.filter((l) => norm(l.name).includes(nq) || (l.aliases || []).some((a) => norm(a).includes(nq)) || nq.includes(norm(l.name)))
    .sort((a, b) => (a.type === "level") - (b.type === "level") || a.name.length - b.name.length)[0] || null;
}
function searchDocs(o) {
  const ids = o.locationId ? descendants(o.locationId) : null;
  const terms = (o.query || "").toLowerCase().split(/\s+/).filter((t) => t.length > 1);
  return S.docs.filter((d) => (!ids || ids.has(d.locationId)) && (!o.category || d.category.toLowerCase() === o.category.toLowerCase()) && (!o.discipline || (d.discipline || "").toLowerCase() === o.discipline.toLowerCase()))
    .map((d) => {
      const hay = `${d.title} ${d.category} ${d.discipline || ""} ${d.tags.join(" ")} ${d.summary} ${d.text} ${locPath(d.locationId)}`.toLowerCase();
      const th = `${d.title} ${d.tags.join(" ")}`.toLowerCase();
      return { d, score: terms.length ? terms.reduce((a, t) => a + (hay.includes(t) ? 1 : 0) + (th.includes(t) ? 2 : 0), 0) : 1 };
    }).filter((x) => !terms.length || x.score > 0)
    .sort((a, b) => b.score - a.score || b.d.uploadedAt.localeCompare(a.d.uploadedAt)).slice(0, o.limit || 12).map((x) => x.d);
}
function locationAt(x, y) {
  let best = null;
  for (const s of SEED.shapes) { if (s.t !== "rect" || !s.loc) continue; if (x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) { const a = s.w * s.h; if (!best || a < best.a) best = { id: s.loc, a }; } }
  return best ? best.id : "site";
}
function gpsToPlan(lat, lon) {
  const e = (lon - GEO.originLon) * 111320 * Math.cos(GEO.originLat * Math.PI / 180), so = (GEO.originLat - lat) * 111320;
  return { x: e / PLAN.metresPerUnit, y: so / PLAN.metresPerUnit };
}
function addNote(n) { const note = { id: uid("n"), createdAt: new Date().toISOString(), status: "open", kind: "note", author: S.author, via: "manual", ...n }; S.notes.unshift(note); save(); refreshAll(); return note; }
function toggleNote(id) { const n = S.notes.find((x) => x.id === id); if (n) { n.status = n.status === "open" ? "closed" : "open"; save(); refreshAll(); } }

/* ================================ pan / zoom engine ================================ */
function PanZoom(el, cw, ch, { onView, onTap, maxZoom = 14 }) {
  const P = { k: 1, x: 0, y: 0, fitK: 1, w: 0, h: 0, onTap, onView };
  const ptrs = new Map(); let moved = 0, t0 = 0, multi = false, pinchD = 0, anim = 0, fitted = false;
  const clamp = (v) => {
    const k = Math.min(Math.max(v.k, P.fitK * 0.85), P.fitK * maxZoom), pad = 80;
    const x = cw * k <= P.w ? (P.w - cw * k) / 2 : Math.min(pad, Math.max(P.w - cw * k - pad, v.x));
    const y = ch * k <= P.h ? (P.h - ch * k) / 2 : Math.min(pad, Math.max(P.h - ch * k - pad, v.y));
    return { k, x, y };
  };
  const set = (v) => { Object.assign(P, v); P.onView && P.onView(P); };
  P.size = (nw, nh) => { cw = nw; ch = nh; fitted = false; measure(); };
  P.fit = () => { if (!P.w) return; const k = Math.min(P.w / cw, P.h / ch); P.fitK = k; set({ k, x: (P.w - cw * k) / 2, y: (P.h - ch * k) / 2 }); };
  P.zoomAt = (sx, sy, f) => { const k = Math.min(Math.max(P.k * f, P.fitK * 0.85), P.fitK * maxZoom), r = k / P.k; set(clamp({ k, x: sx - (sx - P.x) * r, y: sy - (sy - P.y) * r })); };
  P.zoomBy = (f) => P.zoomAt(P.w / 2, P.h / 2, f);
  P.flyTo = (px, py, zf, yFrac = 0.5) => {
    cancelAnimationFrame(anim); const f = { k: P.k, x: P.x, y: P.y }, k = Math.min(P.fitK * zf, P.fitK * maxZoom), to = clamp({ k, x: P.w / 2 - px * k, y: P.h * yFrac - py * k }), a = performance.now();
    const step = (t) => { const p = Math.min(1, (t - a) / 380), e = 1 - Math.pow(1 - p, 3); set({ k: f.k + (to.k - f.k) * e, x: f.x + (to.x - f.x) * e, y: f.y + (to.y - f.y) * e }); if (p < 1) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step);
  };
  P.zoomFactor = () => (P.fitK ? P.k / P.fitK : 1);
  function measure() { P.w = el.clientWidth; P.h = el.clientHeight; if (P.w && P.h && !fitted) { P.fit(); fitted = true; } else if (P.w) P.onView && P.onView(P); }
  new ResizeObserver(measure).observe(el); measure();
  const rect = () => el.getBoundingClientRect();
  el.addEventListener("pointerdown", (e) => { cancelAnimationFrame(anim); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 1) { moved = 0; t0 = performance.now(); multi = false; } else { multi = true; const [a, b] = [...ptrs.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); } });
  el.addEventListener("pointermove", (e) => {
    const p = ptrs.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) { moved += Math.abs(dx) + Math.abs(dy); if (moved > 8) set(clamp({ k: P.k, x: P.x + dx, y: P.y + dy })); }
    else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y); if (pinchD > 0) { const r = rect(); P.zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / pinchD); } pinchD = d; moved = 99; }
  });
  el.addEventListener("pointerup", (e) => {
    const single = ptrs.size === 1; ptrs.delete(e.pointerId); if (ptrs.size === 1) pinchD = 0;
    if (single && !multi && moved <= 8 && performance.now() - t0 < 700) { const r = rect(); P.onTap && P.onTap({ cx: (e.clientX - r.left - P.x) / P.k, cy: (e.clientY - r.top - P.y) / P.k, target: e.target }); }
  });
  const cancel = (e) => ptrs.delete(e.pointerId);
  el.addEventListener("pointercancel", cancel); el.addEventListener("pointerleave", cancel);
  el.addEventListener("wheel", (e) => { e.preventDefault(); const r = rect(); P.zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018))); }, { passive: false });
  el.addEventListener("dblclick", (e) => { const r = rect(); P.zoomAt(e.clientX - r.left, e.clientY - r.top, 2); });
  return P;
}
const mk = (tag, attrs = {}, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const PIN_PATH = "M0,0 C-4,-8 -13,-13 -13,-22 A13,13 0 1 1 13,-22 C13,-13 4,-8 0,0Z";

/* ================================ SITE MAP ================================ */
const M = { pz: null, layers: {}, sel: null, dropMode: false, gps: null, dropPt: null, labels: [], pinEls: [] };
const LAYER_ORDER = ["base", "landscape", "grid", "utilities", "roads", "buildings", "temp", "cranes", "hse"];
function buildMap() {
  const svg = $("#mapsvg"); svg.innerHTML = "";
  const root = mk("g", {}, svg); M.root = root;
  mk("rect", { x: -2000, y: -2000, width: PLAN.w + 4000, height: PLAN.h + 4000, class: "ground" }, root);
  SEED.layers.forEach((l) => (M.layers[l.id] = l.on)); M.layers.base = true;
  M.layerG = {};
  for (const ly of LAYER_ORDER) M.layerG[ly] = mk("g", { "data-layer": ly }, root);
  for (const s of SEED.shapes) {
    const g = M.layerG[s.layer]; let e;
    if (s.t === "text") { e = mk("text", { x: s.x, y: s.y, class: s.cls, "text-anchor": "middle" }, g); e.textContent = s.text; M.labels.push({ e, s }); continue; }
    if (s.t === "rect") e = mk("rect", { x: s.x, y: s.y, width: s.w, height: s.h }, g);
    else if (s.t === "poly") e = mk("polygon", { points: s.pts.map((p) => p.join(",")).join(" ") }, g);
    else if (s.t === "line") e = mk("polyline", { points: s.pts.map((p) => p.join(",")).join(" "), fill: "none" }, g);
    else e = mk("circle", { cx: s.cx, cy: s.cy, r: s.r }, g);
    e.setAttribute("class", s.cls); if (s.loc) e.setAttribute("data-loc", s.loc);
  }
  M.pinG = mk("g", {}, root); M.dropG = mk("g", {}, root); M.gpsG = mk("g", {}, root);
  M.pz = PanZoom($("#mapvp"), PLAN.w, PLAN.h, { onView: mapView, onTap: mapTap });
  applyLayers();
  $("#layerbox").innerHTML = SEED.layers.map((l) => `<label><input type="checkbox" data-layer="${l.id}" ${M.layers[l.id] ? "checked" : ""}> ${l.label}</label>`).join("");
  $("#layerbox").onchange = (e) => { M.layers[e.target.dataset.layer] = e.target.checked; applyLayers(); };
}
function applyLayers() { for (const ly in M.layerG) M.layerG[ly].style.display = M.layers[ly] ? "" : "none"; }
function mapView(v) {
  const svg = $("#mapsvg"); svg.setAttribute("width", v.w); svg.setAttribute("height", v.h);
  M.root.setAttribute("transform", `translate(${v.x} ${v.y}) scale(${v.k})`);
  const z = v.zoomFactor();
  for (const { e, s } of M.labels) {
    const d = s.detail || 1, on = !((d === 2 && z < 1.5) || (d === 3 && z < 2.8));
    e.style.display = on ? "" : "none"; if (!on) continue;
    e.style.fontSize = Math.min(Math.max((s.size || 10) * (d === 1 ? 0.9 : 1.15), 8), 15) / v.k + "px"; e.style.strokeWidth = 3 / v.k + "px";
  }
  for (const p of M.pinEls) p.el.setAttribute("transform", `translate(${p.x} ${p.y}) scale(${0.72 / v.k})`);
  for (const el of M.dropG.children) el.setAttribute("transform", `translate(${el.dataset.x} ${el.dataset.y}) scale(${1 / v.k})`);
  if (M.gps) { M.gpsG.firstChild && M.gpsG.firstChild.setAttribute("r", Math.max(M.gps.acc, 6)); const d = M.gpsG.lastChild; d && d.setAttribute("transform", `translate(${M.gps.x} ${M.gps.y}) scale(${1 / v.k})`); }
  const m = 80 / v.k * PLAN.metresPerUnit, steps = [1, 2, 5, 10, 20, 50, 100, 200, 500];
  $("#scalelbl").textContent = "≈ " + steps.reduce((a, b) => (Math.abs(b - m) < Math.abs(a - m) ? b : a)) + " m";
  highlight();
}
function highlight() { $("#mapsvg").querySelectorAll(".sel").forEach((e) => e.classList.remove("sel")); const r = M.sel ? rootOf(M.sel) : null; if (r) $("#mapsvg").querySelectorAll(`[data-loc="${r.id}"]`).forEach((e) => e.classList.add("sel")); }
function drawPins() {
  M.pinG.innerHTML = ""; M.pinEls = [];
  const by = new Map();
  const anchor = (locId, pin) => { if (pin) return { x: pin.x, y: pin.y, loc: locId }; const l = locById(locId), a = l && l.type === "level" ? rootOf(locId) : l; return a && a.x !== undefined ? { x: a.x, y: a.y, loc: a.id } : null; };
  const slot = (a) => { const k = Math.round(a.x) + "," + Math.round(a.y); if (!by.has(k)) by.set(k, { ...a, docs: 0, issues: 0 }); return by.get(k); };
  for (const d of S.docs) { const a = anchor(d.locationId, d.pin); if (a) slot(a).docs++; }
  for (const n of S.notes) { if (n.status !== "open" || n.kind === "note") continue; const d = n.docId && S.docs.find((x) => x.id === n.docId), a = anchor(n.locationId || (d && d.locationId) || "", d && d.pin); if (a) slot(a).issues++; }
  for (const p of by.values()) {
    const g = mk("g", { class: "pin", "data-pin": p.loc }, M.pinG);
    mk("path", { d: PIN_PATH, class: p.issues ? "pinbody warn" : "pinbody", "data-pin": p.loc }, g);
    const t = mk("text", { y: -18, "text-anchor": "middle", class: "pintxt", "data-pin": p.loc }, g); t.textContent = p.docs || "!";
    if (p.issues) { const f = mk("g", { "data-pin": p.loc }, g); mk("circle", { cx: 12, cy: -34, r: 8, class: "pinflag" }, f); const ft = mk("text", { x: 12, y: -31, "text-anchor": "middle", class: "pinflagtxt" }, f); ft.textContent = p.issues; }
    M.pinEls.push({ el: g, x: p.x, y: p.y });
  }
  if (M.pz) mapView(M.pz);
}
function mapTap(t) {
  if (M.dropMode) { setDropMode(false); M.dropPt = { x: t.cx, y: t.cy }; drawDrop(M.dropPt); openUpload(locationAt(t.cx, t.cy), M.dropPt); return; }
  const hit = (t.target.closest("[data-pin]") || {}).getAttribute?.("data-pin") || (t.target.closest("[data-loc]") || {}).getAttribute?.("data-loc");
  if (hit) selectLoc(hit, false);
}
function drawDrop(p) { M.dropG.innerHTML = ""; if (!p) return; const g = mk("g", { "data-x": p.x, "data-y": p.y }, M.dropG); mk("circle", { r: 10, class: "droppoint" }, g); mk("path", { d: "M-16,0H16M0,-16V16", class: "dropcross" }, g); mapView(M.pz); }
function setDropMode(on) { M.dropMode = on; $("#mapwrap").classList.toggle("dropping", on); $("#dropbanner").classList.toggle("hidden", !on); $("#fab").classList.toggle("hidden", on || !!M.sel); $("#fabcancel").classList.toggle("hidden", !on); if (!on) { M.dropG.innerHTML = ""; } }
function focusLocation(id) { const l = locById(id); const a = l && l.type === "level" ? rootOf(id) : l; if (a && a.x !== undefined) M.pz.flyTo(a.x, a.y, a.type === "building" || a.type === "zone" ? 3.2 : 5.5, M.sel ? 0.27 : 0.5); }
function selectLoc(id, fly = true) { M.sel = id; showTab("map"); $("#msearch").value = ""; $("#mresults").innerHTML = ""; $("#fab").classList.add("hidden"); renderSheet(); highlight(); if (fly) requestAnimationFrame(() => focusLocation(id)); else requestAnimationFrame(() => focusLocation(id)); }
function closeSheet() { M.sel = null; $("#sheet").classList.add("hidden"); $("#fab").classList.toggle("hidden", M.dropMode); highlight(); }

/* GPS */
function startGps() {
  const push = (x, y, acc) => {
    const inside = x > -80 && y > -80 && x < PLAN.w + 80 && y < PLAN.h + 80;
    M.gpsG.innerHTML = ""; if (!inside) { M.gps = null; M.here = null; $("#zgps").classList.add("dim"); $("#here").textContent = ""; return; }

const b64 = (blob) => new Promise((res) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.readAsDataURL(blob); });
async function runTool(name, i, ctx) {
  const J = (o) => JSON.stringify(o, null, 1);
  try {
    switch (name) {
      case "search_documents": { let lid; if (i.location) { const l = resolveLocation(i.location); if (!l) return J({ error: `No place matches "${i.location}".` }); lid = l.id; } const f = searchDocs({ query: i.query, category: i.category, locationId: lid, discipline: i.discipline }); return J({ count: f.length, documents: f.map(docBrief) }); }
      case "get_document": { const d = S.docs.find((x) => x.id === i.id); if (!d) return J({ error: "Document not found" }); const meta = { ...docBrief(d), tags: d.tags, uploadedBy: d.uploadedBy, text: d.text || "(no extracted text — see attached file if any)", notes: S.notes.filter((n) => n.docId === d.id).map(noteBrief) };
        const f = files.get(d.id); if (f && f.size < 4.5 * 1048576 && (f.type === "application/pdf" || /^image\/(jpeg|png|gif|webp)$/.test(f.type))) return [{ type: "text", text: J(meta) }, { type: f.type === "application/pdf" ? "document" : "image", source: { type: "base64", media_type: f.type, data: await b64(f) } }]; return J(meta); }
      case "list_locations": { const q = String(i.query || "").toLowerCase(); const h = S.locations.filter((l) => l.type !== "level" || q).filter((l) => !q || `${l.name} ${(l.aliases || []).join(" ")} ${l.id}`.toLowerCase().includes(q)).slice(0, 40).map((l) => ({ id: l.id, name: l.name, type: l.type, path: locPath(l.id) })); return J({ count: h.length, locations: h }); }
      case "get_location_overview": { const l = resolveLocation(i.location); if (!l) return J({ error: `No place matches "${i.location}".` }); const ids = descendants(l.id), docs = S.docs.filter((d) => ids.has(d.locationId)), notes = S.notes.filter((n) => (n.locationId && ids.has(n.locationId)) || docs.some((d) => d.id === n.docId)); return J({ location: { id: l.id, name: l.name, path: locPath(l.id) }, documents: docs.map(docBrief), openNotes: notes.filter((n) => n.status === "open").map(noteBrief), closedNotes: notes.filter((n) => n.status === "closed").length }); }
      case "add_note": { const text = String(i.text || "").trim(); if (!text) return J({ error: "Note text is empty" }); let locationId; if (i.location) { const l = resolveLocation(i.location); if (!l) return J({ error: `No place matches "${i.location}".` }); locationId = l.id; } const docId = i.document_id || undefined; if (docId && !S.docs.find((d) => d.id === docId)) return J({ error: "Document not found" });
        if (!docId && !locationId) { locationId = ctx.focus.locationId; if (!locationId) return J({ error: "Specify a document or place — nothing is in focus." }); } const n = addNote({ text, docId, locationId, kind: i.kind || "note", via: "agent" }); return J({ saved: true, note: noteBrief(n) }); }
      case "list_notes": { let ids = null; if (i.location) { const l = resolveLocation(i.location); if (!l) return J({ error: `No place matches "${i.location}".` }); ids = descendants(l.id); } const n = S.notes.filter((x) => (!i.document_id || x.docId === i.document_id) && (!i.status || x.status === i.status) && (!ids || (x.locationId && ids.has(x.locationId)) || (x.docId && ids.has((S.docs.find((d) => d.id === x.docId) || {}).locationId)))).slice(0, 40); return J({ count: n.length, notes: n.map(noteBrief) }); }
      case "resolve_note": { const n = S.notes.find((x) => x.id === i.id); if (!n) return J({ error: "Note not found" }); n.status = i.status || "closed"; save(); refreshAll(); return J({ updated: noteBrief(n) }); }
      case "show_on_map": { const l = resolveLocation(i.location); if (!l) return J({ error: `No place matches "${i.location}".` }); ctx.actions.push({ type: "focus_location", locationId: l.id }); return J({ shown: l.name, path: locPath(l.id) }); }
      case "open_document": { const d = S.docs.find((x) => x.id === i.id); if (!d) return J({ error: "Document not found" }); ctx.actions.push({ type: "open_doc", docId: d.id }); return J({ opened: d.title }); }
    }
    return J({ error: "Unknown tool " + name });
  } catch (e) { return J({ error: String(e.message || e) }); }
}
const apiKey = () => setting("key"), model = () => setting("model", "claude-sonnet-5-5");
function agentCtx() { return { author: S.author, actions: [], focus: { docId: V.id || undefined, locationId: M.sel || M.here || undefined } }; }
function systemPrompt(ctx) {
  const fd = ctx.focus.docId && S.docs.find((d) => d.id === ctx.focus.docId);
  return `You are the Site Agent for ${S.project.name} (${S.project.client}), speaking with the Development Manager while they walk the construction site on their phone.

Style: the reader is standing in the sun, reading a small screen, often hands-busy. Lead with the answer in one or two short sentences, then only the details that matter (numbers, revision, status, who/when). No preamble, no markdown tables, at most a short bullet list. Always name the document (title + revision) you relied on.

Rules:
- Use tools — never guess project facts. If search finds nothing, say so plainly and suggest what might exist.
- If documents disagree (different revisions, open RFIs against a drawing), call it out.
- When asked to leave a note, call add_note straight away, then confirm in one line what was saved and where. Clean up dictation but do not add facts. "this"/"here" = current focus below.
- When asked to show a drawing or place, call open_document / show_on_map and say what you opened.
- Flag anything safety-related (open permits, HSE findings, edge protection) prominently.
- You cannot approve, reject, or instruct subcontractors; you record notes and instructions for the team.

Current context:
- Date: ${new Date().toISOString().slice(0, 10)}
- Manager's GPS place: ${M.here ? locPath(M.here) : "unknown"}
- Viewing document: ${fd ? `${fd.title} (id ${fd.id}, rev ${fd.revision || "-"})` : "none"}
- Selected place: ${ctx.focus.locationId ? locPath(ctx.focus.locationId) : "none"}`;
}
async function claudeAgent(history, ctx) {
  const msgs = history.slice(-20).map((m) => ({ role: m.role, content: m.content }));
  for (let turn = 0; turn < 10; turn++) {
    const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "content-type": "application/json", "x-api-key": apiKey(), "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }, body: JSON.stringify({ model: model(), max_tokens: 1500, system: systemPrompt(ctx), tools: TOOL_DEFS, messages: msgs }) });
    const j = await r.json(); if (!r.ok) throw new Error((j.error && j.error.message) || "API error " + r.status);
    if (j.stop_reason !== "tool_use") return { reply: (j.content.filter((b) => b.type === "text").map((b) => b.text).join("\n").trim()) || "Done.", actions: ctx.actions, mode: "claude" };
    msgs.push({ role: "assistant", content: j.content }); const results = [];
    for (const b of j.content) if (b.type === "tool_use") results.push({ type: "tool_result", tool_use_id: b.id, content: await runTool(b.name, b.input || {}, ctx) });
    msgs.push({ role: "user", content: results });
  }
  return { reply: "That took too many steps — try a narrower question.", actions: ctx.actions, mode: "claude" };
}
async function describeUpload(file, mime) {
  if (!apiKey() || file.size > 4.5 * 1048576) return null; const pdf = mime === "application/pdf", img = /^image\/(jpeg|png|gif|webp)$/.test(mime); if (!pdf && !img) return null;
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "content-type": "application/json", "x-api-key": apiKey(), "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: model(), max_tokens: 2500, messages: [{ role: "user", content: [{ type: pdf ? "document" : "image", source: { type: "base64", media_type: mime, data: await b64(file) } }, { type: "text", text: `You index construction project documents. File name: "${file.name}". Return ONLY JSON: {"title": string, "category": one of ${JSON.stringify(CATEGORIES)}, "discipline": "ARC"|"STR"|"MEP"|"CIV"|"HSE"|"QA"|null, "revision": string|null, "summary": "<=200 chars", "text": "faithful transcription of key content: titles/sheet numbers, revisions, notes, dimensions, levels, grid refs, specs, status, dates. Max ~3500 chars. For a site photo describe what is visible and any defects or safety issues."}` }] }] }) });
    const j = await r.json(); const raw = j.content.filter((b) => b.type === "text").map((b) => b.text).join(""); const o = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
    return { title: o.title || undefined, category: CATEGORIES.includes(o.category) ? o.category : undefined, discipline: o.discipline || undefined, revision: o.revision || undefined, summary: String(o.summary || "").slice(0, 300), text: String(o.text || "").slice(0, 6000) };
  } catch { return null; }
}
async function offlineAgent(history, ctx) {
  const q = history[history.length - 1].content.trim(), lq = q.toLowerCase(); const done = (reply) => ({ reply, actions: ctx.actions, mode: "offline" });
  const T = async (n, i) => JSON.parse(await runTool(n, i, ctx));
  const nm = q.match(/^(?:add |leave |make |log )?(?:a )?(note|issue|instruction)\b(?: (?:on|to|for|at) ([^:,-]+?))?\s*[:,-]\s*(.+)$/i);
  if (nm) { const tg = (nm[2] || "").trim(), inp = { text: nm[3], kind: nm[1].toLowerCase() }; if (/^(this|here|this drawing|this document)$/i.test(tg) || !tg) { if (ctx.focus.docId) inp.document_id = ctx.focus.docId; } else inp.location = tg; const r = await T("add_note", inp); return done(r.saved ? `Saved ${r.note.kind}: “${r.note.text}”` : "Couldn't save: " + r.error); }
  const wantsDoc = /\b(drawings?|documents?|docs?|rfis?|specs?|specifications?|inspections?|permits?|minutes|submittals?|snags?|variations?|plans?|sections?)\b/.test(lq);
  if (/^(show|where is|where's|locate|take me to|go to)\b/.test(lq) && !wantsDoc) { const p = q.replace(/^(show( me)?|where is|where's|locate|take me to|go to)\s+(the\s+)?/i, ""), l = resolveLocation(p); if (l) { ctx.actions.push({ type: "focus_location", locationId: l.id }); return done(`Showing ${locPath(l.id)} on the map.`); } }
  if (/\b(open issues|open notes|issues|outstanding)\b/.test(lq)) { const pl = (q.match(/\b(?:at|on|for|in)\s+(.+?)\??$/i) || [])[1], r = await T("list_notes", { status: "open", location: pl }); if (!r.error) return done(r.count ? `${r.count} open:\n` + r.notes.map((n) => `• [${n.kind}] ${n.text}`).join("\n") : "Nothing open there."); }
  const ov = lq.match(/^(?:what(?:'s| is) (?:at|in|on|here at)|overview of|status (?:of|at)|what do i need to know about)\s+(.+?)\??$/);
  if (ov) { const r = await T("get_location_overview", { location: ov[1] }); if (!r.error) return done(`${r.location.path}: ${r.documents.length} documents, ${r.openNotes.length} open notes.\n` + r.documents.slice(0, 6).map((d) => `• ${d.title}`).join("\n")); }
  const cat = /\brfis?\b/.test(lq) ? "RFI" : /\bdrawings?\b/.test(lq) ? "Drawing" : /\binspections?\b/.test(lq) ? "Inspection" : undefined;
  const pl = (q.match(/\b(?:at|on|in|for)\s+((?:tower|hotel|podium|villa|gate|tc|laydown|batching|rebar|substation|stp|basement|club)[\w \-]*?)\??$/i) || [])[1], loc = pl ? resolveLocation(pl) : null;
  const query = q.replace(/\b(show|open|find|me|the|latest|all|any|documents?|drawings?|rfis?|inspections?|for|at|on|in|of|what|is|are|about)\b/gi, " ").trim();
  let f = searchDocs({ query: loc ? "" : query, category: cat, locationId: loc && loc.id }); if (!f.length && query) f = searchDocs({ query });
  if (!f.length) return done("I couldn't find a matching document. Try a place (“Tower A level 12”) or keywords (“slab thickness”).");
  const top = f[0]; if (/^(show|open|pull up|display)\b/.test(lq) || f.length === 1) ctx.actions.push({ type: "open_doc", docId: top.id });
  return done(`${f.length} match${f.length > 1 ? "es" : ""} — top: ${top.title}${top.revision ? ` (rev ${top.revision})` : ""}.\n${top.summary}\n` + f.slice(1, 5).map((d) => `• ${d.title}`).join("\n") + "\n\n(Offline assistant — tap ⚙ AI and add an Anthropic API key for full answers.)");
}

let busy = false, talk = false;
async function sendChat(text) {
  const t = text.trim(); if (!t || busy) return null;
  S.chat.push({ role: "user", content: t }); busy = true; renderChat(); const ctx = agentCtx(); let out;
  try { out = apiKey() ? await claudeAgent(S.chat.map(({ role, content }) => ({ role, content })), ctx) : await offlineAgent(S.chat, ctx); }
  catch (e) { out = { reply: "Agent error: " + (e.message || e), actions: [], mode: "claude" }; }
  S.chat.push({ role: "assistant", content: out.reply, actions: out.actions }); S.chat = S.chat.slice(-40); busy = false; save(); renderChat(); refreshAll();
  if (talk) speak(out.reply); return out;
}
function runAction(a) { if (a.type === "open_doc") openViewer(a.docId); else { closeViewer(); selectLoc(a.locationId); } }
const SUGGEST = ["What's the slab thickness and PT detail on Tower A level 12?", "Show me the latest drawings for Tower A level 12", "Any open RFIs or issues at Tower B?", "What's the status of the podium atrium?", "Leave a note on Laydown 2: pipe stacks re-stacked, verify tomorrow", "Which permits are active today?"];
function renderChat() {
  $("#agentdot").className = "dot " + (apiKey() ? "claude" : "offline"); $("#agentname").textContent = apiKey() ? "Site Agent" : "Site Agent · offline";
  const box = $("#msgs");
  box.innerHTML = (S.chat.length ? "" : `<div class="welcome"><h3>Ask anything about the project</h3><p>I can pull up drawings, specs, RFIs and inspections, answer from them, and leave notes on the right document or place. Tap 🎙 to talk.</p><div class="sugg">${SUGGEST.map((s) => `<button data-sugg="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`) +
    S.chat.map((m) => `<div class="msg ${m.role}"><div class="bubble">${esc(m.content)}</div>${(m.actions || []).length ? `<div class="acts">${m.actions.map((a) => `<button data-act='${esc(JSON.stringify(a))}'>${a.type === "open_doc" ? "📐 Open " + esc((S.docs.find((d) => d.id === a.docId) || {}).title || "document") : "🗺 Show on map"}</button>`).join("")}</div>` : ""}</div>`).join("") +
    (busy ? `<div class="msg assistant"><div class="bubble typing"><i></i><i></i><i></i></div></div>` : "");
  box.scrollTop = box.scrollHeight;
  $("#btnClear").classList.toggle("hidden", !S.chat.length);
}

/* voice */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null;
function dictate(cb, btn) {
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = setting("lang", "en-US"); rec.interimResults = true; rec.continuous = false; btn && btn.classList.add("live");
  rec.onresult = (e) => { let t = "", f = false; for (let i = 0; i < e.results.length; i++) { t += e.results[i][0].transcript; f = e.results[i].isFinal; } cb(t, f); };
  rec.onerror = (e) => { const el = $("#chaterr"); el.classList.remove("hidden"); el.textContent = e.error === "not-allowed" ? "Microphone blocked — allow it in browser settings." : e.error; };
  rec.onend = () => { rec = null; btn && btn.classList.remove("live"); };
  try { rec.start(); } catch { rec = null; }
}
function speak(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t.replace(/[•*_`#]/g, "")); u.lang = setting("lang", "en-US"); speechSynthesis.speak(u); } catch {} }

/* ================================ settings ================================ */
function openSettings() {
  const m = $("#modal"); m.classList.remove("hidden");
  m.innerHTML = `<div class="modal-card"><div class="sheet-h"><b>AI settings</b><button class="x" id="sx">✕</button></div>
  <p class="keybox">Paste an Anthropic API key to turn on the full Claude agent (reads PDFs &amp; photos, answers from all documents). The key is stored only in this browser and sent only to api.anthropic.com. Without it, the built-in offline assistant is used.</p>
  <label>Anthropic API key<input id="skey" type="password" placeholder="sk-ant-…" value="${esc(apiKey())}" autocomplete="off"></label>
  <label>Model<input id="smodel" value="${esc(model())}"></label>
  <label>Voice language<select id="slang"><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option><option value="ar-SA">العربية (السعودية)</option></select></label>
  <button class="primary" id="ssave">Save</button><button class="mini" id="sreset" style="align-self:flex-start">Reset all data to demo</button></div>`;
  $("#slang").value = setting("lang", "en-US");
  const close = () => { m.classList.add("hidden"); m.innerHTML = ""; };
  $("#sx").onclick = close;
  $("#ssave").onclick = () => { setSetting("key", $("#skey").value.trim()); setSetting("model", $("#smodel").value.trim() || "claude-sonnet-5-5"); setSetting("lang", $("#slang").value); close(); renderChat(); };
  $("#sreset").onclick = async () => { if (!confirm("Delete all uploads and notes and restore the demo data?")) return; for (const k of await idb.keys()) await idb.set(k, undefined); location.reload(); };
}

/* ================================ wiring ================================ */
function showTab(t) { for (const n of ["map", "agent", "docs"]) $("#pane-" + n).classList.toggle("off", n !== t); document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t)); if (t !== "map") setDropMode(false); }
function refreshAll() { drawPins(); if (M.sel) renderSheet(); renderDocs(); if (V.id) { drawMarks(); renderDock(); } $("#btnWho").textContent = S.author + " ✎"; }

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-opendoc],[data-togglenote],[data-sel],[data-kind],[data-mode],[data-vkind],[data-hi],[data-dview],[data-dcat],[data-sugg],[data-act]"); if (!t) return;
  const d = t.dataset;
  if (d.opendoc) openViewer(d.opendoc);
  else if (d.togglenote) toggleNote(d.togglenote);
  else if (d.sel) { closeViewer(); selectLoc(d.sel); }
  else if (d.kind) { sheetKind = d.kind; renderSheet(); }
  else if (d.mode) { V.mode = d.mode; renderDock(); }
  else if (d.vkind) { V.kind = d.vkind; renderDock(); }
  else if (d.hi) { V.hi = d.hi; drawMarks(); renderDock(); }
  else if (d.dview) { D.view = d.dview; renderDocs(); }
  else if (d.dcat !== undefined) { D.cat = d.dcat; renderDocs(); }
  else if (d.sugg) sendChat(d.sugg);
  else if (d.act) runAction(JSON.parse(d.act));
});
document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => showTab(b.dataset.tab)));
$("#fab").onclick = () => setDropMode(true); $("#fabcancel").onclick = () => setDropMode(false);
$("#zin").onclick = () => M.pz.zoomBy(1.6); $("#zout").onclick = () => M.pz.zoomBy(1 / 1.6); $("#zfit").onclick = () => M.pz.fit();
$("#zgps").onclick = () => M.gps && M.pz.flyTo(M.gps.x, M.gps.y, 4.5); $("#zlayers").onclick = () => { $("#layerbox").classList.toggle("hidden"); $("#zlayers").classList.toggle("on"); };
$("#msearch").oninput = (e) => { const q = e.target.value.trim().toLowerCase(); const r = q.length < 2 ? [] : S.locations.filter((l) => l.type !== "level" && `${l.name} ${(l.aliases || []).join(" ")}`.toLowerCase().includes(q)).slice(0, 7); $("#mresults").innerHTML = r.map((l) => `<li><button data-sel="${l.id}">${esc(l.name)}<em>${l.type}</em></button></li>`).join(""); };
$("#btnWho").onclick = () => { const n = prompt("Your name (shown on notes you leave)", S.author); if (n && n.trim()) { S.author = n.trim(); save(); refreshAll(); } };
$("#btnSettings").onclick = openSettings;
$("#btnTalk").onclick = () => { talk = !talk; $("#btnTalk").textContent = talk ? "🔊 Voice on" : "🔊 Voice off"; $("#btnTalk").classList.toggle("on", talk); if (!talk) try { speechSynthesis.cancel(); } catch {} };
$("#btnClear").onclick = () => { S.chat = []; save(); renderChat(); };
const sendIn = () => { const v = $("#chatin").value; $("#chatin").value = ""; sendChat(v); };
$("#chatsend").onclick = sendIn; $("#chatin").onkeydown = (e) => e.key === "Enter" && sendIn();
if (SR) { $("#chatmic").classList.remove("hidden"); $("#chatmic").onclick = () => dictate((t, f) => { $("#chatin").value = t; if (f) sendIn(); }, $("#chatmic")); }

(async function init() {
  await idb.open();
  const st = await idb.get("state");
  S = st || { project: SEED.db.project, locations: SEED.db.locations, docs: SEED.db.docs, notes: SEED.db.notes, author: "Dev Manager", chat: [] };
  if (!S.chat) S.chat = [];
  for (const d of S.docs) if (!d.generated && !SEED.drawings[d.id]) { const f = await idb.get("file:" + d.id); if (f) files.set(d.id, f); }
  $("#pname").textContent = S.project.name; $("#psub").textContent = `${S.project.client} · ${S.project.code}`;
  buildMap(); drawPins(); renderDocs(); renderChat(); startGps(); refreshAll();
  window.__kinan = { S, M, selectLoc, openViewer, sendChat };
})();
