<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bohio · WhatsApp Project Updates</title>
<style>
:root{--green:#075e54;--bright:#25d366;--chat:#efeae2;--ink:#17212b;--muted:#667781;--line:#d8dedb;--white:#fff;--sent:#d9fdd3;--alert:#c83a53}*{box-sizing:border-box}body{margin:0;background:#e7ece9;color:var(--ink);font:14px Arial,sans-serif}.demo-note{padding:10px 18px;background:#102a3a;color:#d9e8ee;text-align:center;font-size:12px}.app{width:min(760px,100%);min-height:calc(100vh - 36px);margin:auto;background:var(--chat);box-shadow:0 0 30px #17212b22}.head{display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--green);color:#fff}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#dce9e3;color:var(--green);font-weight:700;letter-spacing:.08em}.head-copy{flex:1}.head-copy b,.head-copy span{display:block}.head-copy span{margin-top:3px;color:#d4e8e3;font-size:11px}.head select{max-width:230px;padding:8px;border:0;border-radius:4px;background:#fff;color:var(--ink)}.flow{display:flex;gap:8px;padding:9px 14px;background:#fff;border-bottom:1px solid var(--line);overflow:auto}.flow button{white-space:nowrap;padding:7px 10px;border:1px solid #b7c7c0;border-radius:18px;background:#fff;color:var(--green);cursor:pointer;font-size:11px}.messages{height:calc(100vh - 300px);min-height:360px;overflow:auto;padding:22px 18px;background-color:var(--chat);background-image:radial-gradient(#b8aaa319 .8px,transparent .8px);background-size:15px 15px}.message{position:relative;width:fit-content;max-width:78%;margin:0 0 10px;padding:9px 11px 18px;border-radius:7px;background:#fff;line-height:1.45;box-shadow:0 1px 1px #17212b18}.message.me{margin-left:auto;background:var(--sent)}.message.agent{border-left:3px solid var(--green)}.message .media{display:flex;align-items:center;gap:7px;margin-bottom:6px;font-weight:600}.message .time{position:absolute;right:8px;bottom:4px;color:var(--muted);font-size:9px}.sync{display:block;margin-top:7px;color:var(--green);font-size:11px;font-weight:600}.held{color:#a16413}.handoff{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:#e7f6ed;border-top:1px solid #b7dac7;color:var(--green);font-size:11px}.handoff[hidden]{display:none}.handoff a{padding:7px 10px;border-radius:4px;background:var(--green);color:#fff;text-decoration:none;font-weight:600}.composer{padding:10px;background:#f0f2f5}.attachment{display:none}.attachment-preview{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;padding:8px 10px;background:#fff;border-radius:5px;color:var(--muted);font-size:11px}.attachment-preview[hidden]{display:none}.compose-row{display:flex;align-items:flex-end;gap:8px}.icon-button{width:42px;height:42px;flex:none;border:0;border-radius:50%;background:#fff;color:var(--green);font-size:20px;cursor:pointer}.icon-button.mic.recording{background:var(--alert);color:#fff;animation:pulse 1s infinite}.compose-row textarea{flex:1;min-height:42px;max-height:110px;resize:vertical;border:0;border-radius:20px;padding:12px 15px;font:14px Arial,sans-serif;outline:none}.send{background:var(--green);color:#fff}.status{min-height:18px;padding:6px 14px 0;color:var(--muted);font-size:10px}.status strong{color:var(--green)}@keyframes pulse{50%{transform:scale(.92)}}@media (max-width:600px){.head{align-items:flex-start;flex-wrap:wrap}.head select{width:100%;max-width:none}.messages{height:calc(100vh - 350px)}}
</style>
<style>.message{white-space:pre-wrap}</style>
</head>
<body>
<div class="demo-note">DEMO WHATSAPP CHANNEL · Planner and project manager updates from a normal WhatsApp chat</div>
<main class="app">
  <header class="head"><div class="avatar">B</div><div class="head-copy"><b>Bohio Project Updates</b><span>Planner / Project Manager · AI schedule bridge connected</span></div><select id="sender" aria-label="Affected contractor" title="Affected contractor"></select></header>
  <div class="flow"><button data-demo="schedule">Full schedule</button><button data-demo="checklist">Site checklist</button><button data-demo="progress">Completed deliverable</button><button data-demo="photo">Photo evidence</button><button data-demo="voice">Voice evidence</button><button data-demo="date">Propose finish date</button></div>
  <section class="messages" id="messages" aria-live="polite"></section>
  <div class="handoff" id="handoff" hidden><span id="handoffText">Bohio progress timeline updated</span><a href="index.html?v=whatsapp-live-timeline#orchestration">View updated timeline ↗</a></div>
  <footer class="composer">
    <div class="attachment-preview" id="attachmentPreview" hidden><span id="attachmentName"></span><button type="button" id="removeAttachment">Remove</button></div>
    <div class="compose-row">
      <label class="icon-button" title="Attach site photo" aria-label="Attach site photo">＋<input class="attachment" id="photo" type="file" accept="image/*" capture="environment"></label>
      <textarea id="message" placeholder="Type a project update…" aria-label="Project update"></textarea>
      <button class="icon-button mic" id="mic" type="button" title="Record voice note" aria-label="Record voice note">●</button>
      <button class="icon-button send" id="send" type="button" aria-label="Send update">➤</button>
    </div>
    <div class="status" id="status">Messages, photos and voice notes are analysed automatically.</div>
  </footer>
</main>
<script>
const OWNER_KEY='bohio_contractor_platform_v1',EVENT_KEY='bohio_whatsapp_updates_v1',CHAT_KEY='bohio_whatsapp_demo_chat_v1';
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fallbackContractors=[['voltaic','Voltaic Power Systems'],['meridian','Meridian Roads'],['delta','Delta Civil'],['aqua','AquaFlow Infrastructure'],['verdant','Verdant Landscapes'],['robopave','RoboPave Autonomous Fleet'],['gridbot','Gridline Robotics'],['terra','Terra Survey Drones']];
const owner=()=>{try{return JSON.parse(localStorage.getItem(OWNER_KEY)||'null');}catch{return null;}};
const read=(key,fallback=[])=>{try{const value=JSON.parse(localStorage.getItem(key)||'null');return Array.isArray(value)?value:fallback;}catch{return fallback;}};
const write=(key,value)=>localStorage.setItem(key,JSON.stringify(value));
const sender=document.getElementById('sender'),messages=document.getElementById('messages'),input=document.getElementById('message'),photo=document.getElementById('photo'),status=document.getElementById('status');
const contractors=()=>owner()?.contractors?.map(c=>[c.id,c.name])||fallbackContractors;
sender.innerHTML=contractors().map(([id,name])=>`<option value="${id}">${esc(name)}</option>`).join('');
function deliverables(taskId){return (owner()?.deliverables||[]).filter(x=>x.taskId===taskId).sort((a,b)=>a.sequence-b.sequence);}
function earned(taskId){const items=deliverables(taskId),verified=items.filter(x=>x.status==='Verified');return {items,verified:verified.length,total:items.length,pct:Math.round(verified.reduce((n,x)=>n+(x.weight||0),0))};}
function work(){const snapshot=owner(),items=(snapshot?.tasks||[]).filter(t=>t.contractor===sender.value),active=items.filter(t=>deliverables(t.id).some(d=>d.status!=='Verified'));return active[0]||items[0]||null;}
function nextDeliverable(taskId){return deliverables(taskId).find(x=>x.status!=='Verified')||null;}
function matchDeliverable(taskId,text){const value=String(text||'').toLowerCase(),candidates=deliverables(taskId).filter(x=>x.status!=='Verified'),ranked=candidates.map(d=>{const tokens=d.name.toLowerCase().replace(/[^a-z0-9]+/g,' ').split(' ').filter(x=>x.length>2&&!['and','the','complete','installed','accepted'].includes(x));return {d,score:tokens.filter(x=>value.includes(x)).length};}).sort((a,b)=>b.score-a.score),top=ranked[0];return top&&top.score>=1?top.d:null;}
function numericFor(deliverable,text){if(!deliverable)return null;const unit=deliverable.unit.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),matched=String(text||'').match(new RegExp(`(\\d[\\d,]*(?:\\.\\d+)?)\\s*${unit}(?![A-Za-z0-9])`,'i'));return matched?Number(matched[1].replace(/,/g,'')):null;}
function clock(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function chat(){return read(CHAT_KEY);}
function addChat(from,text,media='',result=''){const items=chat();items.push({id:crypto.randomUUID(),from,text,media,result,time:clock(),contractor:sender.value});write(CHAT_KEY,items);render();}
function demoAgentReplies(text,snapshot){
  const normalized=String(text||'').toLowerCase(),wantsSchedule=/\b(full|project|send|show|give|get)\b.*\b(schedule|programme)\b|\b(schedule|programme)\b.*\b(full|project|send|show|give|get)\b/.test(normalized),wantsChecklist=/\b(site inspection|inspection)\b.*\bchecklist\b|\bchecklist\b.*\b(site|inspection)\b/.test(normalized),replies=[];
  if(wantsSchedule){const tasks=snapshot?.tasks||[];for(let start=0;start<tasks.length;start+=2){const rows=tasks.slice(start,start+2).map((task,offset)=>{const ds=(snapshot.deliverables||[]).filter(d=>d.taskId===task.id).sort((a,b)=>a.sequence-b.sequence),verified=ds.filter(d=>d.status==='Verified').length,contractor=snapshot.contractors.find(c=>c.id===task.contractor)?.name||'Unassigned';return `${start+offset+1}. ${task.name}\n${task.ps} → ${task.pe}\n${contractor} · ${verified}/${ds.length} deliverables verified\n${ds.map(d=>`${d.status==='Verified'?'✅':'⬜'} ${d.name} — ${d.measure}`).join('\n')}`;}).join('\n\n');replies.push(`${start===0?`BOHIO FULL PROJECT SCHEDULE\nData date: ${snapshot.project.dataDate}\n\n`:''}${rows}${start+2>=tasks.length?'\n\nOnly complete, measured and verified deliverables earn progress. Date changes require planner approval before Primavera is updated.':''}`);}}
  if(wantsChecklist){const contractor=snapshot?.contractors?.find(c=>c.id===sender.value)?.name||'Contractor';replies.push('BOHIO SITE INSPECTION CHECKLIST — 1/2\n\nPRE-START\n⬜ Approved drawing and method statement\n⬜ Permit, RAMS and toolbox talk\n⬜ Survey control and workfront limits\n⬜ Access, lighting and emergency route\n⬜ Weather, crew and plant recorded\n\nSAFETY & QUALITY\n⬜ Barriers, signage and housekeeping\n⬜ Excavation support and safe access\n⬜ Lifting plan and exclusion zone\n⬜ Materials match approved submittals\n⬜ Hold points and concealed work photographed');replies.push(`BOHIO SITE INSPECTION CHECKLIST — 2/2\n\nMEASUREMENT & EVIDENCE\n⬜ Measure the complete deliverable against its target\n⬜ Capture geotagged overview and close-up photos\n⬜ Record test, survey and certificate references\n⬜ List defects, owner and close-out date\n⬜ Record inspector name, time and acceptance\n⬜ Upload evidence before claiming completion\n\n${contractor}\nReply: INSPECTION · item number · PASS/FAIL · observation. Attach photos or a voice note.`);}
  return replies;
}
function render(){const items=chat().filter(x=>x.contractor===sender.value);messages.innerHTML=items.length?items.map(x=>`<article class="message ${x.from==='user'?'me':'agent'}">${x.media?`<div class="media">${x.media==='photo'?'▧ Site photo':'▶ Voice note'}</div>`:''}${esc(x.text)}${x.result?`<span class="sync ${x.result.includes('planner')||x.result.includes('unchanged')?'held':''}">${esc(x.result)}</span>`:''}<span class="time">${esc(x.time)}</span></article>`).join(''):`<article class="message agent">Send the completed deliverable, measured quantity and acceptance evidence. Partial work is recorded but earns zero until the full deliverable is verified.<span class="time">${clock()}</span></article>`;messages.scrollTop=messages.scrollHeight;}
function evidenceType(kind){return kind==='photo'?'photo':kind==='voice'?'voice note':'message';}
function submit(kind='message',override=''){
  const task=work(),snapshot=owner(),text=(override||input.value).trim(),file=photo.files?.[0],finishMatch=text.match(/(?:finish|completion|complete)\s*(?:date|by|on|to)?\s*(20\d{2}-\d{2}-\d{2})/i),legacyPercent=Number(text.match(/\b(\d{1,3})\s*%/)?.[1]),matched=task?matchDeliverable(task.id,text):null,actualValue=numericFor(matched,text),completeClaim=!!matched&&/\b(complete|completed|accepted|passed|signed[ -]?off|commissioned|installed)\b/i.test(text),targetMet=completeClaim&&actualValue!==null&&actualValue>=Number(matched.target);
  const commandReplies=demoAgentReplies(text,snapshot);if(commandReplies.length){addChat('user',text);commandReplies.forEach(reply=>addChat('agent',reply));input.value='';const sent=[commandReplies.some(x=>x.includes('FULL PROJECT SCHEDULE'))?'full schedule':'',commandReplies.some(x=>x.includes('SITE INSPECTION CHECKLIST'))?'site checklist':''].filter(Boolean).join(' and ');status.innerHTML=`<strong>Agent replied</strong> · ${esc(sent)} sent in this chat`;return;}
  if(!task){status.textContent='No assigned activity was found for this sender.';return;}
  if(!text&&!file&&kind==='message'){status.textContent='Type an update, attach a photo or record a voice note.';return;}
  const mediaType=file?'photo':kind,confidence=matched?(targetMet?.96:.82):.58,date=snapshot?.project?.dataDate||new Date().toISOString().slice(0,10),target=snapshot?.whatsappScheduleTarget||'Oracle Primavera P6',before=earned(task.id),evidence=file?.name||(text.match(/evidence\s*:\s*(.+)$/i)?.[1]||'');
  const late=(snapshot?.submissions||[]).find(x=>x.contractor===sender.value&&!x.submittedAt&&(/report|recovery|look-ahead|survey/i.test(text)||file));
  const event={id:crypto.randomUUID(),contractor:sender.value,reporterRole:'Planner / Project Manager',source:'Demo WhatsApp · Planner/PM',taskId:task.id,title:task.name,mediaType,text,evidence:file?.name||evidenceType(mediaType),pct:null,legacyPercent:Number.isFinite(legacyPercent)?legacyPercent:null,previousPct:before.pct,confidence,date,ts:date+'T'+new Date().toTimeString().slice(0,5),proposedFinish:finishMatch?.[1]||'',deliverableId:matched?.id||'',deliverableName:matched?.name||'',actualValue,actualQuantity:matched&&actualValue!==null?`${actualValue.toLocaleString()} ${matched.unit}`:'',targetMet,verificationEvidence:evidence,summary:matched?`${matched.name} matched; ${actualValue===null?'measured quantity missing':`${actualValue.toLocaleString()} ${matched.unit} reported against ${matched.measure}`}.`:`${task.name} context received; no measurable deliverable was identified.`,submissionId:late?.id||''};
  const events=read(EVENT_KEY);events.push(event);write(EVENT_KEY,events);
  const userText=text||`${file?.name||'Voice note'} sent`;
  addChat('user',userText,mediaType==='message'?'':mediaType);
  const result=event.proposedFinish?'Date change sent to planner approval · schedule unchanged':targetMet&&evidence?`Full deliverable submitted for verification · ${target} unchanged`:matched?'Work in progress recorded · zero earned · schedule unchanged':'Context saved · zero earned · schedule unchanged';
  addChat('agent',event.proposedFinish?`I found a requested finish-date change for ${task.name}. Only the planner can approve it.`:targetMet&&!evidence?`I matched ${matched.name} and the full target, but acceptance evidence is still required before verification.`:targetMet?`I matched ${matched.name}, its full measured target and the evidence reference. It is waiting for owner verification.`:matched?`I matched ${matched.name}, but the complete target has not been demonstrated. The measurement is visible as work in progress and earns zero.`:`I logged the message as project evidence. Name the completed deliverable, measured quantity and evidence before progress can be earned.`, '',result);
  input.value='';photo.value='';document.getElementById('attachmentPreview').hidden=true;status.innerHTML=`<strong>Processed</strong> · ${esc(evidenceType(mediaType))} · confidence ${Math.round(confidence*100)}%`;const handoff=document.getElementById('handoff');handoff.hidden=false;document.getElementById('handoffText').textContent=event.proposedFinish?'Bohio created a planner approval item':targetMet&&evidence?'Deliverable awaiting owner verification':'Evidence logged with zero earned progress';
}
document.getElementById('send').onclick=()=>submit(photo.files?.[0]?'photo':'message');
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit(photo.files?.[0]?'photo':'message');}};
photo.onchange=()=>{const file=photo.files?.[0];document.getElementById('attachmentPreview').hidden=!file;document.getElementById('attachmentName').textContent=file?`▧ ${file.name}`:'';};
document.getElementById('removeAttachment').onclick=()=>{photo.value='';document.getElementById('attachmentPreview').hidden=true;};
sender.onchange=render;
let recorder=null,chunks=[];
document.getElementById('mic').onclick=async()=>{const button=document.getElementById('mic'),d=nextDeliverable(work()?.id),example=d?`Voice note: ${d.name} completed. Measured ${d.measure}. Evidence: ${d.acceptance}.`:'Voice note with site evidence.';if(recorder?.state==='recording'){recorder.stop();return;}if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){submit('voice',example);return;}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());button.classList.remove('recording');button.textContent='●';submit('voice',example);};recorder.start();button.classList.add('recording');button.textContent='■';status.textContent='Recording voice note… tap again to send.';}catch{status.textContent='Microphone access was unavailable. Use the voice-evidence example above.';}};
document.querySelectorAll('[data-demo]').forEach(button=>button.onclick=()=>{const task=work(),d=nextDeliverable(task?.id),type=button.dataset.demo;if(type==='schedule'){submit('message','Send me the full project schedule');return;}if(type==='checklist'){submit('message','Send me a checklist for site inspection');return;}if(!d)return;if(type==='progress'){input.value=`${d.name} completed. Measured ${d.measure}. Evidence: ${d.acceptance}.`;input.focus();}if(type==='photo')submit('photo',`${d.name} completed. Measured ${d.measure}. Evidence: geotagged photo set and ${d.acceptance}.`);if(type==='voice')submit('voice',`Voice note: ${d.name} completed. Measured ${d.measure}. Evidence: ${d.acceptance}.`);if(type==='date')submit('message',`${d.name} remains in progress. Proposed finish 2026-09-18 due to access constraints.`);});
render();
</script>
</body>
</html>
