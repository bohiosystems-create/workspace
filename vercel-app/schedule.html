<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>XYZ Hospital Construction · Programme</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000919; --deep:#123640; --teal:#0b5962;
  --muted:#61777b; --muted2:#8a9b9f; --muted3:#6b8085;
  --line:#cdd5db; --line2:#e2e6ea;
  --bg2:#f6f8f9; --bg3:#eef1f2; --bg4:#f8fafa;
  --red:#c63b52; --redbg:#fdf4f5; --green:#16845f; --amber:#a9701c;
  --font:'Source Sans 3',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:var(--ink);font-family:var(--font);letter-spacing:.01em}
body{font-size:13px}
a{color:var(--teal);text-decoration:none}
input,select,button,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
::selection{background:var(--ink);color:#fff}
.wrap{max-width:1680px;margin:0 auto;padding:26px 26px 90px}

/* ---------- header ---------- */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding-bottom:22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.kicker{font:600 10.5px var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--muted2)}
h1{margin:9px 0 8px;font-size:36px;font-weight:600;letter-spacing:-.035em;line-height:1.05}
.sub{color:var(--muted);font-size:13.5px;max-width:680px}
.kpis{display:flex;gap:26px;flex-wrap:wrap}
.kpi .k{font:600 10px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.kpi .v{font-size:23px;font-weight:600;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .v.bad{color:var(--red)} .kpi .v.ok{color:var(--green)}

/* ---------- tabs + toolbar ---------- */
nav.tabs{display:flex;gap:2px;margin:18px 0 0;border-bottom:1px solid var(--line)}
.tab{padding:10px 14px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--deep)}
.bar{display:flex;align-items:center;gap:8px;padding:14px 0;flex-wrap:wrap}
.btn{padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12.5px;color:var(--ink)}
.btn:hover{background:var(--bg2)}
.btn.on{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.primary{background:var(--deep);border-color:var(--deep);color:#fff}
select.sel,input.inp{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12.5px}
input.inp{min-width:190px}
.bar .sp{flex:1}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:22px;align-items:start}
@media(max-width:1200px){.shell{grid-template-columns:1fr}.aside{position:static!important}}
.inner{min-width:0}

/* ---------- gantt ---------- */
.gantt{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.grow{display:grid;grid-template-columns:300px minmax(0,1fr)}
.ghead{background:var(--bg2);border-bottom:1px solid var(--line)}
.ghead .gl{padding:9px 12px;font:600 10.5px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);border-right:1px solid var(--line)}
.months{position:relative;height:34px}
.mo{position:absolute;top:0;height:100%;border-left:1px solid var(--line2);padding:9px 0 0 6px;font:500 10.5px var(--font);color:var(--muted3);white-space:nowrap;overflow:hidden}
.mo:first-child{border-left:0}

.phase{grid-column:1/-1;display:grid;grid-template-columns:300px minmax(0,1fr);background:var(--bg3);border-bottom:1px solid var(--line)}
.phase .pl{padding:8px 12px;display:flex;align-items:center;gap:7px;border-right:1px solid var(--line)}
.phase .chev{color:var(--muted2);font-size:10px;width:9px}
.phase .pn{font-weight:600;font-size:12.5px}
.phase .pm{margin-left:auto;font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums}
.phase .pr{position:relative}

.row{display:contents}
.cell-l{padding:6px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer}
.cell-l:hover{background:var(--bg4)}
.cell-l.sel{background:#eef3f3;box-shadow:inset 2px 0 0 var(--teal)}
.tid{font:600 10px var(--font);color:var(--muted2);letter-spacing:.05em;width:30px;flex:none}
.tnm{font-size:12.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tdur{font-size:10.5px;color:var(--muted2);font-variant-numeric:tabular-nums;flex:none}
.cell-r{position:relative;height:30px;border-bottom:1px solid var(--line2);cursor:pointer}
.cell-r:hover{background:var(--bg4)}
.cell-r.sel{background:#eef3f3}
.grid-v{position:absolute;inset:0;pointer-events:none}
.grid-v i{position:absolute;top:0;bottom:0;width:1px;background:var(--line2)}
.today{position:absolute;top:0;bottom:0;width:1px;background:var(--red);opacity:.55;pointer-events:none;z-index:3}

.bar-t{position:absolute;top:8px;height:14px;border-radius:3px;background:var(--teal);display:flex;align-items:center;z-index:2}
.bar-t.crit{background:var(--red)}
.bar-t .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.42);border-radius:3px 0 0 3px}
.bar-t .lbl{position:absolute;left:calc(100% + 6px);font:500 10.5px var(--font);color:var(--muted3);white-space:nowrap}
.base{position:absolute;top:24px;height:3px;background:var(--teal);opacity:.22;border-radius:2px;z-index:1}
.chip-late{position:absolute;left:calc(100% + 6px);top:-1px;background:var(--red);color:#fff;font:600 8.5px var(--font);letter-spacing:.04em;padding:2px 5px;border-radius:3px;white-space:nowrap}
.ms{position:absolute;top:9px;width:12px;height:12px;background:var(--deep);transform:rotate(45deg);z-index:2}
.ms.crit{background:var(--red)}
.ms-lbl{position:absolute;top:7px;font:600 10.5px var(--font);white-space:nowrap;color:var(--ink)}

/* ---------- aside ---------- */
.aside{position:sticky;top:18px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.aside .ah{padding:14px 15px;border-bottom:1px solid var(--line);background:var(--bg2)}
.aside .ak{font:600 10px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.aside .an{font-size:17px;font-weight:600;letter-spacing:-.02em;margin-top:5px;line-height:1.2}
.aside .ap{font-size:11.5px;color:var(--muted);margin-top:4px}
.atabs{display:flex;border-bottom:1px solid var(--line);background:#fff}
.atab{flex:1;padding:9px 4px;font-size:11.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.atab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--deep)}
.apane{display:none;padding:14px 15px;max-height:calc(100vh - 260px);overflow-y:auto}
.apane.on{display:block}
.f4{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.fbox{background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:7px 9px}
.fbox .k{font:600 9px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted2)}
.fbox .v{font-size:13.5px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.fbox .v.bad{color:var(--red)} .fbox .v.ok{color:var(--green)}
.lrow{display:flex;gap:9px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.2px}
.lrow .lk{color:var(--muted);width:96px;flex:none}
.lrow .lv{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:11px;font:600 10.5px var(--font);letter-spacing:.03em}
.pill.ok{background:#e7f3ee;color:var(--green)}
.pill.warn{background:#fdf3e4;color:var(--amber)}
.pill.bad{background:var(--redbg);color:var(--red)}
.pill.neutral{background:var(--bg3);color:var(--muted)}
.pill.info{background:#eef3f3;color:var(--teal)}
h4.sec{font:600 10px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin:15px 0 8px}
h4.sec:first-child{margin-top:0}
.li{font-size:12.2px;padding:4px 0 4px 13px;position:relative;color:var(--muted3)}
.li:before{content:'';position:absolute;left:2px;top:11px;width:4px;height:4px;border-radius:50%;background:var(--muted2)}

/* verification queue */
.verify{border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:6px;padding:10px 11px;margin-bottom:10px;background:#fffdf8}
.verify .vt{font-size:12.3px;line-height:1.5}
.verify .vm{font-size:11.3px;color:var(--muted);margin-top:5px}
.verify .va{display:flex;gap:6px;margin-top:9px}
.btn-xs{padding:5px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:11.5px}
.btn-xs.go{background:var(--deep);border-color:var(--deep);color:#fff}
.upd{border-bottom:1px solid var(--line2);padding:10px 0}
.upd .uh{display:flex;align-items:center;gap:7px;font-size:11.3px;color:var(--muted2);margin-bottom:5px}
.upd .src{font:600 9px var(--font);letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:8px}
.src.wa{background:#e7f3ee;color:var(--green)} .src.voice{background:#f0e9fb;color:#6b30bd}
.src.po{background:#fdf3e4;color:var(--amber)} .src.board{background:#eef3f3;color:var(--teal)}
.upd .ub{font-size:12.4px;line-height:1.5}
.upd .ue{font-size:11.3px;color:var(--muted);margin-top:4px}

/* ---------- procurement table ---------- */
.ptab{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ptr{display:grid;grid-template-columns:minmax(0,1.6fr) 90px minmax(0,1.6fr) 110px 130px;border-bottom:1px solid var(--line2)}
.ptr.h{background:var(--bg2);border-bottom:1px solid var(--line)}
.ptr.h > div{font:600 10.5px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);padding:9px 12px}
.ptr > div{padding:8px 12px;font-size:12.3px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ptr:not(.h):hover{background:var(--bg4);cursor:pointer}
.ptr .mono{font-variant-numeric:tabular-nums;color:var(--muted3)}

/* ---------- week / day ---------- */
.wk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.wd{border:1px solid var(--line);border-radius:7px;overflow:hidden;min-height:190px}
.wd .wh{background:var(--bg2);border-bottom:1px solid var(--line);padding:8px 10px}
.wd .dow{font:600 10px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted2)}
.wd .dt{font-size:14px;font-weight:600;margin-top:2px}
.wd .wb{padding:8px 10px}
.wi{padding:6px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.wi:last-child{border-bottom:0}
.wi .wid{font:600 9.5px var(--font);color:var(--muted2);letter-spacing:.05em}
.wi .win{font-size:12px;line-height:1.35;margin-top:1px}

/* ---------- assistant ---------- */
.fab{position:fixed;right:24px;bottom:24px;z-index:80;width:54px;height:54px;border-radius:50%;background:var(--deep);box-shadow:0 10px 30px rgba(18,54,64,.34);display:flex;align-items:center;justify-content:center}
.fab svg{width:24px;height:24px;fill:#fff}
.fab .bdg{position:absolute;top:-2px;right:-2px;width:19px;height:19px;border-radius:50%;background:var(--red);color:#fff;font:700 10px var(--font);display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.asst{position:fixed;right:24px;bottom:24px;z-index:90;width:430px;max-width:calc(100vw - 28px);height:660px;max-height:calc(100vh - 48px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 24px 70px rgba(0,9,25,.26);display:none;flex-direction:column;overflow:hidden}
.asst.on{display:flex}
.ah2{background:var(--deep);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.ah2 .t{font-size:14px;font-weight:600}
.ah2 .s{font-size:11px;opacity:.72;margin-top:1px}
.ah2 .x{margin-left:auto;color:#fff;font-size:17px;opacity:.8}
.alog{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;background:var(--bg4)}
.m{max-width:88%;padding:9px 11px;border-radius:8px;font-size:12.6px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;background:var(--deep);color:#fff}
.m.bot{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.m table{border-collapse:collapse;margin-top:5px;font-size:11.8px;width:100%}
.m td{padding:2px 6px 2px 0;vertical-align:top;border-bottom:1px solid var(--line2)}
.m td:first-child{color:var(--muted);white-space:nowrap}
.m .ts{display:block;margin-top:5px;font-size:10px;opacity:.55;text-align:right}
.chips{flex:none;background:#fff;border-top:1px solid var(--line);max-height:136px;overflow-y:auto;padding:9px 10px}
.ccat{font:600 9px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);margin:7px 0 4px}
.ccat:first-child{margin-top:0}
.chip{display:inline-block;border:1px solid var(--line);border-radius:13px;padding:4px 9px;font-size:11.3px;margin:0 4px 4px 0;color:var(--teal);background:#fff}
.chip:hover{background:var(--bg3)}
.ain{flex:none;display:flex;gap:6px;padding:9px;border-top:1px solid var(--line);background:#fff}
.ain input{flex:1;border:1px solid var(--line);border-radius:18px;padding:9px 13px;font-size:12.6px;outline:0}
.ain .go{width:37px;height:37px;border-radius:50%;background:var(--deep);display:flex;align-items:center;justify-content:center;flex:none}
.ain .go svg{width:16px;height:16px;fill:#fff}
.ain .aux{width:32px;height:37px;display:flex;align-items:center;justify-content:center;border-radius:6px;flex:none}
.ain .aux:hover{background:var(--bg3)}
.ain .aux svg{width:17px;height:17px;fill:var(--muted3)}
.ain .aux.rec svg{fill:var(--red)}
.voice{display:flex;align-items:center;gap:8px;min-width:190px}
.voice .pl{width:25px;height:25px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex:none}
.voice .pl svg{width:11px;height:11px;fill:#fff}
.voice .wv{flex:1;display:flex;align-items:center;gap:2px;height:20px}
.voice .wv i{display:block;width:2.5px;border-radius:2px;background:rgba(255,255,255,.6)}
.voice .du{font-size:10.5px;opacity:.75;flex:none}
.tr{border-left:3px solid var(--green);background:#f2f9f6;border-radius:5px;padding:7px 9px;margin-top:6px;font-size:12.2px;line-height:1.45}
.tr .l{display:block;font:700 9px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:3px}
.tr .o{display:block;color:var(--muted);font-size:11.2px;margin-top:4px}
.typing{font-style:italic;color:var(--muted2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 17px;border-radius:7px;font-size:12.5px;font-weight:500;box-shadow:0 10px 34px rgba(0,9,25,.3);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:100}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.mir{margin-top:6px;font:600 9.5px var(--font);letter-spacing:.05em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:9px}
.mir:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.mir.yes{background:#eef3f3;color:var(--teal)}
.mir.no{background:#fdf3e4;color:var(--amber)}
.evrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line2)}
.evic{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font:700 8.5px var(--font);color:#fff;flex:none}
.evic.img{background:var(--teal)} .evic.pdf{background:var(--red)}
.evmeta{flex:1;min-width:0;display:flex;flex-direction:column}
.evmeta b{font-size:12.2px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evmeta span{font-size:10.8px;color:var(--muted2)}
.modal{position:fixed;inset:0;background:rgba(0,9,25,.45);z-index:120;display:none;align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:10px;max-width:760px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 30px 80px rgba(0,9,25,.35)}
.mhd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--bg2)}
.mhd h3{font-size:17px;font-weight:600;letter-spacing:-.02em}
.mhd .x{margin-left:auto;font-size:18px;color:var(--muted)}
.mbd{padding:18px 20px}
.syncgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.syncbox{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.syncbox h5{font:600 10px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px}
.syncbox .n{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.okbar{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:7px;font-size:13px;font-weight:600;margin-bottom:14px}
.okbar.good{background:#e7f3ee;color:var(--green)}
.okbar.bad{background:var(--redbg);color:var(--red)}
.note{font-size:11.3px;color:var(--muted2);line-height:1.5;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div style="max-width:760px;min-width:0">
      <div class="kicker">Programme · BOH-INF-014</div>
      <h1>XYZ Hospital Construction</h1>
      <p class="sub">Critical-path programme with live procurement exposure. Field evidence arrives from WhatsApp and is held for verification before it moves the schedule.</p>
    </div>
    <div class="kpis" id="kpis"></div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="bar">
    <button class="btn" id="b-base" onclick="tog('showBaseline')">Show baseline</button>
    <button class="btn" id="b-del" onclick="tog('showDelays')">Show delays</button>
    <button class="btn" id="b-crit" onclick="tog('critOnly')">Critical only</button>
    <select class="sel" id="f-phase" onchange="setF('phase',this.value)"></select>
    <select class="sel" id="f-crew" onchange="setF('crew',this.value)"></select>
    <input class="inp" id="f-text" placeholder="Filter activities…" oninput="setF('text',this.value)"/>
    <button class="btn" onclick="clearF()">Clear filters</button>
    <span class="sp"></span>
    <button class="btn" onclick="simMondayUpload()" title="Simulate a photo attached on the Monday item">Upload on Monday</button>
    <button class="btn" onclick="simMondayComment()" title="Simulate a comment written on the Monday item">Comment on Monday</button>
    <button class="btn" onclick="showSync()" title="Bohio / Monday mirror">Sync status</button>
    <button class="btn" onclick="resetDemo()" title="Clear saved state">Reset demo</button>
    <span class="muted" id="data-date"></span>
  </div>

  <div class="shell">
    <div class="inner">
      <div id="view-timeline"></div>
      <div id="view-week" style="display:none"></div>
      <div id="view-proc" style="display:none"></div>
      <p class="note" id="viewnote"></p>
    </div>

    <aside class="aside">
      <div class="ah">
        <div class="ak" id="a-kick">Select an activity</div>
        <div class="an" id="a-name">—</div>
        <div class="ap" id="a-phase"></div>
      </div>
      <div class="atabs">
        <button class="atab on" id="at-detail" onclick="aPane('detail')">Detail</button>
        <button class="atab" id="at-proc" onclick="aPane('proc')">Procurement</button>
        <button class="atab" id="at-upd" onclick="aPane('upd')">Updates</button>
        <button class="atab" id="at-log" onclick="aPane('log')">Log</button>
      </div>
      <div class="apane on" id="ap-detail"></div>
      <div class="apane" id="ap-proc"></div>
      <div class="apane" id="ap-upd"></div>
      <div class="apane" id="ap-log"></div>
    </aside>
  </div>
</div>

<button class="fab" id="fab" onclick="togAsst()" title="Programme assistant">
  <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1012 2z"/></svg>
  <span class="bdg" id="fabBadge">!</span>
</button>

<div class="asst" id="asst">
  <div class="ah2">

/* live programme = baseline + accrued slippage from site */
const SLIP={A40:8,A50:5,C10:12};
const tasks=TASKS.map(t=>({type:t.type||'task',...t,preds:t.preds.slice(),
  dur:(t.dur||0)+(SLIP[t.id]||0), baseDur:t.dur||0,
  updates:[],files:[],log:[{when:'Baseline',what:'Activity created from the Primavera baseline',src:'board'}]}));
const byId=id=>tasks.find(t=>t.id===id);

const DATA_DATE=new Date(2026,8,9);          // 09 Sept 2026
const START=new Date(2026,0,12);             // programme start
const PROC_LABEL={awarded:'Awarded',tender:'Out to tender',not_started:'Not started',na:'Not applicable'};
const PROC_SHORT={awarded:'Awarded',tender:'Tender',not_started:'Not started',na:'n/a'};
/* award + delivery lead time in working days, by procurement state */
const PROC_LEAD={awarded:10,tender:35,not_started:60,na:0};

/* ===================== CPM ===================== */
function cpm(list){
  const ids={},map={};
  list.forEach(t=>{ids[t.id]=1;});
  list.forEach(t=>{map[t.id]={...t,dur:t.type==='milestone'?0:Math.max(0,+t.dur||0),
    preds:(t.preds||[]).filter(p=>ids[p]&&p!==t.id)};});
  const order=[],seen={},done={};
  const visit=id=>{ if(done[id]||seen[id])return; seen[id]=1; map[id].preds.forEach(visit); done[id]=1; order.push(id); };
  list.forEach(t=>visit(t.id));
  order.forEach(id=>{const n=map[id];
    n.es=n.preds.length?Math.max(...n.preds.map(p=>map[p].ef)):0; n.ef=n.es+n.dur;});
  const end=order.length?Math.max(...order.map(id=>map[id].ef)):1;
  const succ={};
  order.forEach(id=>map[id].preds.forEach(p=>{(succ[p]=succ[p]||[]).push(id);}));
  order.slice().reverse().forEach(id=>{const n=map[id],s=succ[id]||[];
    n.lf=s.length?Math.min(...s.map(x=>map[x].ls)):end; n.ls=n.lf-n.dur;
    n.float=n.ls-n.es; n.critical=n.float<=0;});
  return {map,end:Math.max(end,1),succ,order};
}
/* working-day index -> calendar date (Mon–Fri) */
function wdDate(i){
  const d=new Date(START); let n=0;
  while(n<i){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6) n++; }
  while([0,6].includes(d.getDay())) d.setDate(d.getDate()+1);
  return d;
}
function wdIndex(target){
  const d=new Date(START); let n=0;
  while(d<target){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6) n++; }
  return n;
}
const fmt=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'});
const fmtS=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});

/* ===================== PROCUREMENT DELAY FORECAST =====================
 * The pre-emptive flag: compare how long the material still needs
 * (award + lead time) against how long we have (working days until the
 * activity's early start, plus its total float). */
const RISK={clear:{l:'Clear',r:0,c:'ok'},watch:{l:'Watch',r:1,c:'warn'},
            atrisk:{l:'At risk',r:2,c:'warn'},critical:{l:'Critical',r:3,c:'bad'}};
function procRisk(t,C){
  const n=C.map[t.id]; if(!n) return {level:'clear',slip:0,why:[]};
  if(t.proc==='na') return {level:'clear',slip:0,why:['No procurement attached to this activity.'],none:true};
  // Procurement is only a forecast for work that has not started — once the
  // activity is underway the material is demonstrably on site.
  if((t.pct||0)>=100) return {level:'clear',slip:0,why:['Activity complete — procurement closed out.'],none:true};
  if((t.pct||0)>0) return {level:'clear',slip:0,why:['Works underway; material is on site.'],none:true};
  const today=wdIndex(DATA_DATE);
  const need=PROC_LEAD[t.proc];                         // working days still required
  const have=Math.max(0,n.es-today)+Math.max(0,n.float); // working days available
  const slip=need-have;
  const why=[];
  if(t.proc==='not_started') why.push('No order or tender raised yet.');
  else if(t.proc==='tender') why.push('Out to tender under '+(t.procRef||'no reference')+' — not yet awarded.');
  else why.push('Awarded under '+(t.procRef||'no reference')+'.');
  why.push(`Needs ${need} working days; ${have} available before early start ${fmtS(wdDate(n.es))}` +
           (n.float>0?` (incl. ${n.float}d float).`:' with no float.'));
  let level='clear';
  if(slip>=15) level='critical'; else if(slip>=1) level='atrisk'; else if(slip>=-10) level='watch';
  if(level==='clear') why.push(`${Math.abs(slip)} working days of cover.`);
  return {level,slip,why,need,have};
}

/* ===================== STATUS ===================== */
const STATUS={
  notstarted:{l:'Not started',c:'neutral'},
  working:{l:'In progress',c:'info'},
  verify:{l:'Awaiting verification',c:'warn'},
  stuck:{l:'Stuck',c:'bad'},
  done:{l:'Complete',c:'ok'},
};
function statusFromUpdate(u){
  if(u.noStatus) return null;
  const t=(u.text+' '+(u.effect||'')).toLowerCase();
  if(/verification required|unverified|quantity missing|not recorded|unmeasured|evidence logged/.test(t)) return 'verify';
  if(/stuck|blocked|on hold|delay|suspend|ncr|non-?conformance|stopped/.test(t)) return 'stuck';
  // a part quantity ("30 of 64 complete") is progress, not completion
  const part=/\b(\d+)\s*(?:of|\/)\s*(\d+)\b/.exec(t);
  if(part && +part[1] < +part[2]) return 'working';
  if(/complete|completed|handed over|signed off|certified|accepted and closed/.test(t)) return 'done';
  if(/in progress|ongoing|started|installing|poured|erected|compacted|underway|fixing|\d+%/.test(t)) return 'working';
  return null;
}
function derive(t){
  if(t.manual) return t.manual;
  let s=t.pct>=100?'done':t.pct>0?'working':'notstarted';
  for(const u of t.updates){const d=statusFromUpdate(u); if(d) s=d;}
  return s;
}
/* claims that carry no measurement are held, never silently dropped */
function pending(t){ return t.updates.filter(u=>u.claim&&!u.verified); }
function allPending(){ return tasks.flatMap(t=>pending(t).map(u=>({t,u}))); }

/* ===================== MONDAY.COM MIRROR & TWO-WAY SYNC =====================
 * Bohio and Monday are modelled as two stores that must agree. Every change
 * on either side is written through applyChange(), which stamps a revision,
 * pushes it to the other side, and records it. reconcile() walks both stores
 * field by field and reports any drift, so "they match" is something the demo
 * proves rather than asserts. State persists to localStorage so a refresh
 * does not quietly reset the board. */
const SYNC_FIELDS=['status','pct','crew','loc','dur'];
const monday={connected:true,workspace:'Main workspace',board:'Bohio · Primavera Schedule',
  boardId:5103871751,api:'2024-10',writes:0,pushes:0,pulls:0,rev:0,
  lastSync:new Date(),items:{},assets:[]};

/* the Monday side of the mirror, seeded from the programme */
function syncComments(t){
  const mi=monday.items[t.id]; if(!mi) return;
  mi.updates=mi.updates||[];
  t.updates.forEach(u=>{if(!u.id) u.id=newUid();});
  // Bohio -> Monday: everything except a held claim
  t.updates.filter(mirrorable).forEach(u=>{
    if(!mi.updates.some(x=>x.id===u.id)){
      mi.updates.push({id:u.id,text:u.text,by:u.by,when:u.when,origin:u.origin||'bohio',
        action:u.verified?'deliverable_verified':(u.asset?'evidence':'comment')});
    }});
  // Monday -> Bohio: anything written on the board
  mi.updates.forEach(m=>{
    if(!t.updates.some(x=>x.id===m.id)){
      t.updates.push({id:m.id,src:'board',text:m.text,by:m.by||'Monday board',
        effect:'Comment written on the Monday item and pulled into Bohio.',
        when:m.when||'Just now',noStatus:true,origin:'monday'});
    }});
}
function syncItem(t){
  const mi=monday.items[t.id]; if(!mi) return;
  syncComments(t);
  SYNC_FIELDS.forEach(f=>{mi[f]=fieldOf(t,f);});
  // union the evidence rather than copying one side over the other
  const seen=new Set(), merged=[];
  t.files.concat(mi.assets||[]).forEach(f=>{if(f&&!seen.has(f.id)){seen.add(f.id);merged.push(f);}});
  merged.sort((a,b)=>(b.ts||0)-(a.ts||0));
  t.files=merged; mi.assets=merged.slice();
}
function seedMirrorMissing(){
  tasks.forEach(t=>{if(!monday.items[t.id]) monday.items[t.id]={name:t.name,status:derive(t),
    pct:t.pct||0,crew:t.crew,loc:t.loc,dur:t.dur,updates:[],assets:t.files.slice(),rev:0};});
  tasks.forEach(t=>syncComments(t));
}
function seedMirror(){
  tasks.forEach(t=>{monday.items[t.id]={name:t.name,status:derive(t),pct:t.pct||0,
    crew:t.crew,loc:t.loc,dur:t.dur,updates:[],assets:[],rev:0};});
  tasks.forEach(t=>syncComments(t));
}
const fieldOf=(t,f)=>f==='status'?derive(t):f==='pct'?(t.pct||0):t[f];

function mLog(t,what,src){t.log.unshift({when:'Just now',what,src});}

/* The single write path. origin is 'bohio' or 'monday'; whichever side the
 * change starts on, it is mirrored to the other and stamped with a revision. */
function applyChange(id,field,value,src,origin){
  const t=byId(id); if(!t) return null;
  origin=origin||'bohio';
  const mi=monday.items[id]; if(!mi) return null;
  let label=value;
  if(field==='status'){t.manual=value;label=STATUS[value].l;}
  else if(field==='pct'){t.pct=value;label=value+'%';}
  else {t[field]=value;}
  // status is derived from pct, updates and any manual override, so a change
  // to one field can move another — mirror the whole item, not just the field
  syncItem(t);
  monday.rev++; mi.rev=monday.rev; t.rev=monday.rev;
  monday.writes++;
  if(origin==='bohio') monday.pushes++; else monday.pulls++;
  monday.lastSync=new Date();
  const col=({status:'Status',pct:'Progress',crew:'Contractor',loc:'Location',dur:'Duration'})[field]||field;
  mLog(t,`<b>${col}</b> set to <b>${esc(String(label))}</b> <i>(${origin==='bohio'?'Bohio → Monday':'Monday → Bohio'})</i>`,src||'board');
  persist(); render();
  return {id,field,value:label,rev:mi.rev};
}
/* back-compat wrapper used by the assistant */
const mWrite=(id,col,val,src)=>applyChange(id,col==='progress'?'pct':col,val,src,'bohio');
/* a change arriving FROM Monday (someone edited the board directly) */
const mondayEdit=(id,field,value)=>applyChange(id,field,value,'board','monday');

/* walk both stores and report any field that disagrees */
function reconcile(){
  const drift=[];
  tasks.forEach(t=>{
    const mi=monday.items[t.id];
    if(!mi){drift.push({id:t.id,field:'item',bohio:'present',monday:'missing'});return;}
    SYNC_FIELDS.forEach(f=>{
      const a=fieldOf(t,f), b=mi[f];
      if(String(a)!==String(b)) drift.push({id:t.id,field:f,bohio:a,monday:b});
    });
    // compare the asset sets themselves — equal counts with different files
    // is still drift, and a count check would call that a match
    const bIds=new Set(t.files.map(f=>f.id)), mIds=new Set((mi.assets||[]).map(f=>f.id));
    const onlyB=[...bIds].filter(x=>!mIds.has(x)), onlyM=[...mIds].filter(x=>!bIds.has(x));
    if(onlyB.length||onlyM.length)
      drift.push({id:t.id,field:'assets',bohio:t.files.length,monday:(mi.assets||[]).length,
                  onlyBohio:onlyB.length,onlyMonday:onlyM.length});
    // comments: a held claim is expected to be Bohio-only, so it is excluded
    const bU=new Set(t.updates.filter(mirrorable).map(u=>u.id));
    const mU=new Set((mi.updates||[]).map(u=>u.id));
    const cB=[...bU].filter(x=>!mU.has(x)), cM=[...mU].filter(x=>!bU.has(x));
    if(cB.length||cM.length)
      drift.push({id:t.id,field:'comments',bohio:bU.size,monday:mU.size,
                  onlyBohio:cB.length,onlyMonday:cM.length});
  });
  return drift;
}
function repair(){
  const d=reconcile();
  d.forEach(x=>{const t=byId(x.id),mi=monday.items[x.id];
    if(!mi) return;
    if(x.field==='comments'){ syncComments(t); return; }
    if(x.field==='assets'){
      // evidence merges both ways. Overwriting one side with the other
      // would silently destroy whichever upload the other side had.
      const seen=new Set(), merged=[];
      t.files.concat(mi.assets||[]).forEach(f=>{if(f&&!seen.has(f.id)){seen.add(f.id);merged.push(f);}});
      merged.sort((a,b)=>(b.ts||0)-(a.ts||0));
      t.files=merged.slice(); mi.assets=merged.slice();
      monday.assets=monday.assets.filter(a=>a.activity!==t.id).concat(merged);
      return;
    }
    mi[x.field]=fieldOf(t,x.field);});
  monday.lastSync=new Date(); persist(); render();
  return d.length;
}

/* ---------- persistence ---------- */
const LSK='bohio.programme.v1';
function persist(){
  try{
    localStorage.setItem(LSK,JSON.stringify({
      v:1,saved:Date.now(),
      tasks:tasks.map(t=>({id:t.id,pct:t.pct,manual:t.manual||null,dur:t.dur,crew:t.crew,loc:t.loc,
        updates:t.updates,files:t.files,log:t.log.slice(0,40),rev:t.rev||0})),
      monday:{items:monday.items,assets:monday.assets,writes:monday.writes,
        pushes:monday.pushes,pulls:monday.pulls,rev:monday.rev}
    }));
  }catch(e){/* private mode or quota — the demo still runs in memory */}
}
function restore(){
  try{
    const raw=localStorage.getItem(LSK); if(!raw) return false;
    const d=JSON.parse(raw); if(!d||d.v!==1) return false;
    d.tasks.forEach(saved=>{const t=byId(saved.id); if(!t) return;
      t.pct=saved.pct; t.manual=saved.manual||null; t.dur=saved.dur;
      t.crew=saved.crew; t.loc=saved.loc; t.rev=saved.rev||0;
      t.updates=saved.updates||[]; t.files=saved.files||[]; t.log=saved.log||t.log;});
    if(d.monday){Object.assign(monday,{items:d.monday.items||{},assets:d.monday.assets||[],
      writes:d.monday.writes||0,pushes:d.monday.pushes||0,pulls:d.monday.pulls||0,rev:d.monday.rev||0});}
    return true;
  }catch(e){return false;}
}
function resetDemo(){try{localStorage.removeItem(LSK);}catch(e){} location.reload();}

/* ---------- evidence, in both directions ----------
 * A photo can arrive from the field over WhatsApp, or be dropped straight
 * onto the Monday item by someone at a desk. Either way it lands on both
 * sides, carries where it came from, and is never overwritten by a repair. */
function makeAsset(file,t,origin){
  return {id:'asset_'+Math.random().toString(16).slice(2,10),
    name:file.name,kind:file.kind,size:file.size,
    contentType:file.kind==='img'?'image/jpeg':'application/pdf',
    when:'Just now',ts:Date.now(),origin,
    by:origin==='monday'?'Monday board':'Field (WhatsApp)',activity:t.id};
}
function fileEvidence(id,file,origin,src){
  const t=byId(id); if(!t) return null;
  const mi=monday.items[t.id]; if(!mi) return null;
  const a=makeAsset(file,t,origin);
  t.files.unshift(a);
  mi.assets=(mi.assets||[]); mi.assets.unshift(a);
  monday.assets.unshift(a);
  monday.writes++;
  if(origin==='monday') monday.pulls++; else monday.pushes++;
  monday.lastSync=new Date();
  t.updates.push({src:origin==='monday'?'board':(src||'wa'),
    text:'Evidence attached: '+file.name,
    by:origin==='monday'?'Monday board':'Field (WhatsApp)',
    effect:origin==='monday'
      ? 'Uploaded on the Monday item and pulled into Bohio. Evidence alone does not move progress.'
      : 'Filed on the Monday item as an asset. Evidence alone does not move progress.',
    when:'Just now',noStatus:true,asset:a.id,origin});
  mLog(t,`Evidence <b>${esc(file.name)}</b> ${origin==='monday'?'added on Monday':'uploaded from WhatsApp'} <i>(${origin==='monday'?'Monday → Bohio':'Bohio → Monday'})</i>`,
    origin==='monday'?'board':'wa');
  syncItem(t); persist(); render();
  return a;
}
/* field -> board */
const addEvidence=(id,file,src)=>fileEvidence(id,file,'bohio',src);
/* board -> field: someone attaches a photo on the Monday item itself */
const mondayAddEvidence=(id,file)=>fileEvidence(id,file,'monday');

/* a comment written on the Monday item, pulled into Bohio */
function mondayAddComment(id,text,by){
  const t=byId(id); if(!t) return null;
  const mi=monday.items[t.id]; if(!mi) return null;
  mi.updates=mi.updates||[];
  const c={id:newUid(),text,by:by||'Elena Marquez (Resident Engineer)',when:'Just now',
    origin:'monday',action:'comment'};

  monday.writes++; monday.pulls++; monday.lastSync=new Date();
  mLog(t,`Comment added on the Monday item <i>(Monday → Bohio)</i>`,'board');
  syncItem(t); persist(); render();
  return c;
}

/* verification gate — an unverified claim is held back from Monday */
function verifyClaim(taskId,idx,ok){
  const t=byId(taskId),u=t.updates[idx]; if(!u) return;
  if(ok){
    u.verified=true; u.effect='Verified by the planner. Progress released to Monday.';
    const st=statusFromUpdate({text:u.text,effect:''})||'working';
    applyChange(t.id,'status',st==='verify'?'working':st,'board','bohio');
    if(u.pct!=null) applyChange(t.id,'pct',u.pct,'board','bohio');
    mLog(t,'Claim verified — released to Monday as <b>deliverable_verified</b>','board');
    toast(`${t.id} verified — status now ${STATUS[derive(t)].l}`);
  }else{
    u.verified=false;u.rejected=true;u.effect='Rejected by the planner. Re-measure and resubmit.';
    mLog(t,'Claim rejected — not sent to Monday','board');
    toast(`${t.id} claim rejected`);
  }
  persist(); render();
}

/* ===================== RENDER ===================== */
function visible(C){
  return tasks.filter(t=>{
    if(S.phase&&t.p!==S.phase) return false;
    if(S.crew&&t.crew!==S.crew) return false;
    if(S.critOnly&&!C.map[t.id].critical) return false;
    if(S.text&&!(t.name+' '+t.id+' '+t.crew+' '+t.loc).toLowerCase().includes(S.text.toLowerCase())) return false;
    return true;
  });
}
function render(){
  const C=cpm(tasks), B=cpm(TASKS.map(t=>({type:t.type||'task',...t,preds:t.preds.slice()})));
  const span=Math.max(C.end,B.end);
  renderKpis(C,B);
  renderTabs();
  document.getElementById('data-date').textContent='Data date '+fmt(DATA_DATE)+'  ·  '+monday.writes+' Monday writes';
  ['timeline','week','proc'].forEach(v=>document.getElementById('view-'+v).style.display=S.view===v?'':'none');
  if(S.view==='timeline') renderGantt(C,B,span);
  if(S.view==='week') renderWeek(C);
  if(S.view==='proc') renderProc(C);
  renderAside(C,B);
  fillFilters();
}
function renderKpis(C,B){
  const late=tasks.filter(t=>C.map[t.id].ef>B.map[t.id].ef).length;
  const crit=tasks.filter(t=>C.map[t.id].critical).length;
  const risky=tasks.filter(t=>{const r=procRisk(t,C);return !r.none&&RISK[r.level].r>=2;}).length;
  const held=allPending().length;
  const slip=C.end-B.end;
  document.getElementById('kpis').innerHTML=[
    ['Completion',fmtS(wdDate(C.end)),slip>0?'bad':'ok'],
    ['Slippage',(slip>0?'+':'')+slip+'d',slip>0?'bad':'ok'],
    ['Critical',crit,''],
    ['Procurement risk',risky,risky?'bad':'ok'],
    ['Held for verification',held,held?'bad':'ok'],
  ].map(([k,v,c])=>`<div class="kpi"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join('');
}

function renderGantt(C,B,span){
  const vis=visible(C), pct=i=>(i/span)*100;
  /* month scale */
  const months=[];
  for(let i=0;i<span;i++){const d=wdDate(i);const key=d.getFullYear()+'-'+d.getMonth();
    if(!months.length||months[months.length-1].key!==key)
      // month columns are narrow over a two-year programme, so only January carries the year
      months.push({key,i,label:d.getMonth()===0?d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}):d.toLocaleDateString('en-GB',{month:'short'})});}
  const mo=months.map((m,i)=>{const w=((i+1<months.length?months[i+1].i:span)-m.i)/span*100;
    return `<div class="mo" style="left:${pct(m.i)}%;width:${w}%">${m.label}</div>`;}).join('');
  const gridv=months.map(m=>`<i style="left:${pct(m.i)}%"></i>`).join('');
  const todayPct=pct(wdIndex(DATA_DATE));

  let html=`<div class="gantt"><div class="grow">
    <div class="ghead gl">Activity · duration</div>
    <div class="ghead"><div class="months">${mo}<div class="today" style="left:${todayPct}%"></div></div></div>`;

  PHASES.forEach(ph=>{
    const rows=vis.filter(t=>t.p===ph.id); if(!rows.length) return;
    const ids=rows.map(t=>t.id);
    const es=Math.min(...ids.map(i=>C.map[i].es)), ef=Math.max(...ids.map(i=>C.map[i].ef));
    const done=Math.round(rows.reduce((a,t)=>a+(t.pct||0),0)/rows.length);
    html+=`<div class="phase"><div class="pl"><span class="chev">▼</span><span class="pn">${esc(ph.name)}</span>
        <span class="pm">${rows.length} · ${done}%</span></div>
      <div class="pr"><div class="grid-v">${gridv}</div>
        <div style="position:absolute;left:${pct(es)}%;width:${pct(ef-es)}%;top:11px;height:5px;background:var(--deep);opacity:.28;border-radius:3px"></div>
        <div class="today" style="left:${todayPct}%"></div></div></div>`;

    rows.forEach(t=>{
      const n=C.map[t.id], b=B.map[t.id];
      const late=Math.max(0,n.ef-b.ef);
      const on=S.sel===t.id;
      html+=`<div class="cell-l ${on?'sel':''}" onclick="sel('${t.id}')">
          <span class="tid">${t.id}</span><span class="tnm">${esc(t.name)}</span>
          <span class="tdur">${t.type==='milestone'?'—':t.dur+'d'}</span></div>
        <div class="cell-r ${on?'sel':''}" onclick="sel('${t.id}')">
          <div class="grid-v">${gridv}</div>
          <div class="today" style="left:${todayPct}%"></div>`;
      if(t.type==='milestone'){
        html+=`<div class="ms ${n.critical?'crit':''}" style="left:calc(${pct(n.es)}% - 6px)"></div>
               <div class="ms-lbl" style="left:calc(${pct(n.es)}% + 11px)">${esc(t.name)}</div>`;
      }else{
        if(S.showBaseline) html+=`<div class="base" style="left:${pct(b.es)}%;width:${pct(b.dur)}%"></div>`;
        html+=`<div class="bar-t ${n.critical?'crit':''}" style="left:${pct(n.es)}%;width:${pct(n.dur)}%">
            <div class="fill" style="width:${t.pct||0}%"></div>
            ${(S.showDelays&&late>0)?`<span class="chip-late">+${late}d late</span>`
              :`<span class="lbl">${t.pct?t.pct+'%':''}</span>`}</div>`;
      }
      html+=`</div>`;
    });
  });
  html+=`</div></div>`;
  document.getElementById('view-timeline').innerHTML=html;
  document.getElementById('viewnote').textContent=
    'Bar position is early start, width is duration. Red marks the critical path. The vertical red line is the data date.';
}

function findT(q){
  const s=q.toLowerCase();
  const byCode=tasks.find(t=>new RegExp('(^|[^a-z0-9])'+t.id.toLowerCase()+'([^a-z0-9]|$)').test(s));
  if(byCode) return byCode;
  // score every activity by how much of its name the message actually contains,
  // so "basement raft slab" picks A60 and not A30's "basement perimeter"
  let best=null,sc=0;
  tasks.forEach(t=>{
    let n=0;
    t.name.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3).forEach(w=>{if(s.includes(w))n+=w.length;});
    if(n>sc){sc=n;best=t;}
  });
  return sc?best:null;}
function fz(q,h){const s=h.toLowerCase();return q.toLowerCase().split(/\s+/).filter(w=>w.length>3).some(w=>s.includes(w));}

function regAnswer(q){
  let best=null,sc=0;
  for(const r of REGS){const s=matchScore(q,r.k); if(s>sc){sc=s;best=r;}}
  if(!best||sc<6) return null;
  return `<b>${best.t}</b>\n${best.b}\n\n<i>Indicative guidance only — confirm against the current edition of the standard and this project's own drawings, fire strategy and method statements before you rely on it.</i>`;
}

/* ===================== FUZZY INTENT MATCHING =====================
 * Field messages are typed one-handed in gloves and voice notes come back
 * from ASR with words mangled, so matching has to survive typos, dropped
 * spaces, plurals and synonyms — not just exact keywords. */
const SYN={
  /* Surface variants only — abbreviations and obvious equivalents. Anything
   * that merges two distinct ideas (complete/progress, escape/exit) makes
   * separate intents collide, so it is deliberately left out. */
  drawing:['dwg','dwgs'],
  specification:['spec','specs'],
  permit:['ptw','permits'],
  regulation:['reg','regs','regulations'],
  evidence:['photo','photos','picture','pictures','pic','pics','image','images'],
  percent:['pct','percentage'],
  contractor:['subbie','subcontractor'],
  programme:['program'],
  procurement:['purchasing'],
  float:['slack'],
  telephone:['phone','tel'],
  activity:['task'],
};
/* reverse index: any variant -> its canonical word */
const SYN_OF={};
Object.entries(SYN).forEach(([base,list])=>{SYN_OF[base]=base;list.forEach(v=>{SYN_OF[v]=base;});});

function norm(s){
  return String(s).toLowerCase()
    .replace(/[’']/g,'')
    .replace(/[^a-z0-9%+\/\-\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function stem(w){
  if(w.length>4&&w.endsWith('ies')) return w.slice(0,-3)+'y';
  if(w.length>4&&/(ses|xes|zes|ches|shes)$/.test(w)) return w.slice(0,-2);
  if(w.length>3&&w.endsWith('s')&&!w.endsWith('ss')) return w.slice(0,-1);
  if(w.length>5&&w.endsWith('ing')) return w.slice(0,-3);
  if(w.length>5&&w.endsWith('ed')) return w.slice(0,-2);
  return w;
}
function canon(w){const b=stem(w);return SYN_OF[b]||SYN_OF[w]||b;}

/* bounded Damerau-Levenshtein: "strat" for "start" is one transposition,
 * not two edits, so it has to cost 1 or real typos never match */
function lev(a,b,max){
  if(a===b) return 0;
  if(Math.abs(a.length-b.length)>max) return max+1;
  const m=a.length,n=b.length;
  let prev2=null,prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=new Array(n+1); cur[0]=i; let best=i;
    for(let j=1;j<=n;j++){
      const c=a[i-1]===b[j-1]?0:1;
      let v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+c);
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) v=Math.min(v,prev2[j-2]+1);
      cur[j]=v; if(v<best) best=v;
    }
    if(best>max) return max+1;
    prev2=prev; prev=cur;
  }
  return prev[n];
}
/* how far a word of this length is allowed to be wrong */
function tol(n){ const L=typeof n==='number'?n:String(n).length;
  return L<=3?0 : L<=5?1 : L<=8?2 : 3; }

/* does query token q stand in for keyword token k? */
function tokEq(q,k){
  if(q===k) return true;
  const sq=stem(q), sk=stem(k), cq=canon(q), ck=canon(k);
  if(sq===sk||cq===ck) return true;
  // a shorter form that prefixes the longer one: work / workin / working
  const [shrt,lng]=q.length<=k.length?[q,k]:[k,q];
  if(shrt.length>=4&&lng.length-shrt.length<=3&&lng.startsWith(shrt)) return true;
  const [ss,sl]=sq.length<=sk.length?[sq,sk]:[sk,sq];
  if(ss.length>=4&&sl.length-ss.length<=3&&sl.startsWith(ss)) return true;
  // edit distance, budgeted on the SHORTER word and only for words of
  // comparable length — otherwise "how" starts matching "holding"
  const near=(a,b)=>{
    if(Math.abs(a.length-b.length)>3) return false;
    const t=tol(Math.min(a.length,b.length));
    return t>0 && lev(a,b,t)<=t;
  };
  return near(q,k)||near(sq,sk)||near(cq,ck);
}
/* score a keyword phrase against the query tokens, allowing typos and
 * a dropped space ("fireexit", "increas ethe") */
function phraseScore(qt,kw){
  const kt=norm(kw).split(' ').filter(Boolean);
  if(!kt.length) return 0;
  const joined=qt.join('');
  const base=kw.replace(/\s/g,'').length*2;
  let best=0;
  // keyword tokens must appear in order, but people put words in between
  // ("why hasnt THE STAUS updated"), so allow a small gap budget
  const GAP=2;
  for(let i=0;i<qt.length;i++){
    let qi=i,ki=0,pen=0,gaps=0;
    while(qi<qt.length&&ki<kt.length){
      if(tokEq(qt[qi],kt[ki])){
        if(qt[qi]!==kt[ki]&&canon(qt[qi])!==canon(kt[ki])) pen++;
        qi++;ki++;
      }else if(ki>0&&gaps<GAP){ gaps++;qi++; }
      else break;
    }
    if(ki===kt.length){
      const sc=base-pen*2-gaps*2;
      if(sc>best) best=sc;
    }
  }
  if(best) return best;
  // dropped-space fallback: "fireexit", "increas ethe". Kept deliberately
  // tight — a loose join here matches almost anything.
  const sq=kw.replace(/\s/g,'');
  if(sq.length>=6&&joined.includes(sq)) return sq.length*2-1;
  if(sq.length>=7){
    for(let i=0;i<qt.length;i++){
      const two=(qt[i]||'')+(qt[i+1]||'');
      if(Math.abs(two.length-sq.length)>1) continue;
      if(lev(two,sq,1)<=1) return sq.length*2-3;
    }
  }
  return 0;
}
function matchScore(q,keys){
  const qt=norm(q).split(' ').filter(Boolean);
  let best=0;
  for(const k of keys){const sc=phraseScore(qt,k); if(sc>best) best=sc;}
  return best;
}
/* kept for the report/question routing below */
function kwHit(s,k){ return phraseScore(norm(s).split(' ').filter(Boolean),k)>0; }

const QW=/^(what|whats|wat|wot|when|where|who|whos|which|why|how|hw|is|are|do|does|did|can|cud|could|should|shud|any|show|list|give|tell|find|need|got)\b/i;
const CW=/^(set|chang|change|mark|assign|move|updat|update|verify|verifi|approve|reject|release|attach|upload|add|log|record)\b/i;
const isQ=q=>/\?/.test(q)||QW.test(norm(q));
const isC=q=>CW.test(norm(q));

function match(q){
  let best=null,sc=0;
  for(const i of INTENTS){
    let s=matchScore(q,i.k.concat(i.alt||[]));
    // this project's own registers answer better than generic guidance, so a
    // regulation has to win outright rather than on a tie
    if(i.cat==='Regulations') s*=0.9;
    if(s>sc){sc=s;best=i;}
  }
  return sc>=6?best:null;   // below this it is noise, not a match
}

function ask(){
  const el=document.getElementById('ai'),q=el.value.trim(); if(!q) return;
  el.value=''; push('me',esc(q));
  setTimeout(()=>{
    const rep=statusFromUpdate({text:q,effect:''});
    if(rep&&!isQ(q)&&!isC(q)){push('bot',logIt(q));return;}
    // an instruction has to land on a write intent — "set C30 status to
    // complete" must not be answered by the completion-date question
    let i=null;
    if(isC(q)){
      let bs=0;
      INTENTS.filter(x=>x.cat==='Board'||x.cat==='Verification').forEach(x=>{
        const sc=matchScore(q,x.k.concat(x.alt||[])); if(sc>bs){bs=sc;i=x;}});
      if(bs<6) i=null;
    }
    if(!i) i=match(q);
    if(i){const a=i.f(q); push('bot',a||regAnswer(q)||"I don't have that one.");}
    else{const r=regAnswer(q); push('bot',r||(rep?logIt(q):"I didn't catch that. Try a suggestion below, or tell me what happened on site."));}
  },240);
}
let lastT=null;
function logIt(text,src){
  const t=findT(text)||byId(lastT)||byId(S.sel); lastT=t.id;
  const measured=/\b\d+\s*(of|\/)\s*\d+\b|\bmeasurement sheet\b|\b\d+\s?(m2|m²|m3|m³|m|no\.|units|lm)\b/i.test(text);
  const st=statusFromUpdate({text,effect:''});
  const u=wa(text,src==='voice'?'Voice note (WhatsApp)':'Field (WhatsApp)',
    measured?'Measured claim — applied and synced to Monday.':'Evidence logged; verification required before progress changes.',
    measured?{verified:true}:{claim:true});
  t.updates.push(u);
  if(measured){
    if(st&&st!=='verify') applyChange(t.id,'status',st,src==='voice'?'voice':'wa','bohio');
    const q=/\b(\d+)\s*(?:of|\/)\s*(\d+)\b/.exec(text);
    if(q) applyChange(t.id,'pct',Math.min(100,Math.round(+q[1]/+q[2]*100)),src==='voice'?'voice':'wa','bohio');
  } else {
    mLog(t,'Claim received without a measurement — <b>held</b>, not sent to Monday','wa');
  }
  syncItem(t); persist(); render();
  return measured
    ? `✅ Logged on <b>${t.id} ${esc(t.name)}</b> and synced.\nStatus → <b>${STATUS[derive(t)].l}</b>.`
    : `📋 Logged on <b>${t.id} ${esc(t.name)}</b> — <b>held for verification</b>.\nNo measurement in the message, so nothing was written to Monday. The planner can release it from the activity panel.`;
}
function push(who,html){
  const l=document.getElementById('alog'),d=document.createElement('div');
  d.className='m '+who;
  d.innerHTML=html+`<span class="ts">${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span>`;
  l.appendChild(d); l.scrollTop=l.scrollHeight;
}
function askChip(q){document.getElementById('ai').value=q;ask();}
function togAsst(){const a=document.getElementById('asst'),o=a.classList.toggle('on');
  document.getElementById('fab').style.display=o?'none':'flex';
  if(o&&!a.dataset.i){a.dataset.i=1;buildChips();
    push('bot',`Programme assistant for <b>XYZ Hospital Construction</b>.\nI can answer on the programme, procurement, verification and site regulations — or log what you tell me.`);}}
function buildChips(){
  const cats={}; INTENTS.forEach(i=>{(cats[i.cat]=cats[i.cat]||[]).push(i.ex);});
  document.getElementById('chips').innerHTML=Object.entries(cats).map(([c,ex])=>
    `<div class="ccat">${c}</div>`+ex.map(e=>`<button class="chip" onclick="askChip(this.textContent)">${esc(e)}</button>`).join('')).join('');
}

 {sec:13,lang:'en-GB',conf:.96,text:'Pile caps to grid C poured, 24 of 64 complete, measurement sheet attached.'},

let vi=0;
const wv=n=>{let h='';for(let i=0;i<n;i++)h+=`<i style="height:${4+Math.round(12*Math.abs(Math.sin(i*1.7)))}px"></i>`;return h;};
function sendVoice(){
  const v=VOICE[vi++%VOICE.length],mic=document.getElementById('mic');
  mic.classList.add('rec');
  push('me',`<div class="voice"><span class="pl"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
    <span class="wv">${wv(24)}</span><span class="du">0:${String(v.sec).padStart(2,'0')}</span></div>`);
  const l=document.getElementById('alog'),t=document.createElement('div');
  t.className='m bot typing';t.textContent='transcribing voice note…';l.appendChild(t);l.scrollTop=l.scrollHeight;
  setTimeout(()=>{
    mic.classList.remove('rec');t.remove();
    push('bot',`<div class="tr"><span class="l">Transcript · ${v.lang} · ${(v.conf*100).toFixed(0)}% confidence</span>${esc(v.text)}${v.orig?`<span class="o">Original: ${esc(v.orig)}</span>`:''}</div>`);
    setTimeout(()=>{
      const rep=statusFromUpdate({text:v.text,effect:''});
      if(rep&&!isQ(v.text)&&!isC(v.text)){push('bot',logIt(v.text,'voice'));return;}
      const i=match(v.text);
      push('bot', i?(i.f(v.text)||regAnswer(v.text)||'—') : (regAnswer(v.text)||(rep?logIt(v.text,'voice'):'Transcribed, but I could not tell what to do with it.')));
    },280);
  },1050);
}

function showSync(){
  const d=reconcile();
  const rows=tasks.map(t=>{const mi=monday.items[t.id]||{};
    const bad=reconcile().some(x=>x.id===t.id);
    return `<div class="ptr" style="grid-template-columns:74px 1fr 1fr 78px 96px 78px">
      <div class="mono">${t.id}</div>
      <div>${STATUS[derive(t)].l} · ${t.pct||0}%</div>
      <div>${mi.status?STATUS[mi.status].l:'—'} · ${mi.pct||0}%</div>
      <div class="mono">${t.files.length} / ${(mi.assets||[]).length}</div>
      <div class="mono">${t.updates.filter(mirrorable).length} / ${(mi.updates||[]).length}</div>
      <div><span class="pill ${bad?'bad':'ok'}">${bad?'drift':'match'}</span></div></div>`;}).join('');
  document.getElementById('syncBody').innerHTML=`
    <div class="okbar ${d.length?'bad':'good'}">${d.length?`⚠ ${d.length} field(s) out of step`:'✓ Every field on every activity matches on both sides'}</div>
    <div class="syncgrid">
      <div class="syncbox"><h5>Bohio → Monday</h5><div class="n">${monday.pushes}</div><div class="note">changes pushed this session</div></div>
      <div class="syncbox"><h5>Monday → Bohio</h5><div class="n">${monday.pulls}</div><div class="note">changes pulled this session</div></div>
      <div class="syncbox"><h5>Activities mirrored</h5><div class="n">${Object.keys(monday.items).length} / ${tasks.length}</div><div class="note">board id ${monday.boardId}</div></div>
      <div class="syncbox"><h5>Evidence assets</h5><div class="n">${monday.assets.length}</div><div class="note">files mirrored on both sides</div></div>
    </div>
    ${d.length?`<button class="btn primary" onclick="repair();showSync();">Repair drift</button>`:''}
    <h4 class="sec">Field-by-field</h4>
    <div class="ptab"><div class="ptr h" style="grid-template-columns:74px 1fr 1fr 78px 96px 78px">
      <div>Activity</div><div>Bohio</div><div>Monday</div><div>Files B/M</div><div>Comments B/M</div><div>State</div></div>${rows}</div>
    <p class="note">Held claims are counted as Bohio-only on purpose: api/monday.js accepts a verified deliverable, so an unverified claim must not reach the board. Everything else — comments, evidence, procurement notes — mirrors both ways. Every change goes through one write path that stamps a revision and mirrors it to the other side, so the two stores cannot drift apart on their own. This panel walks both stores field by field and reports what it finds. State is saved to this browser, so a refresh keeps the board.</p>`;
  document.getElementById('syncModal').classList.add('on');
}
