<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bohio — Marketing Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* Bohio monochrome design language — ported from the demo. */


:root {
  --bg: #e6e2e2;
  --ink: #000919;
  --ink-soft: rgba(0, 9, 25, 0.55);
  --ink-faint: rgba(0, 9, 25, 0.18);
  --ink-hairline: rgba(0, 9, 25, 0.12);
  --paper: #efebeb;
  --alert: #ff4d6a;
  --green: #1d7a52;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Space Grotesk", "IBM Plex Sans Arabic", -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
  -webkit-font-smoothing: antialiased;
  letter-spacing: 0.01em;
}
a { color: inherit; }

.shell { max-width: 1180px; margin: 0 auto; padding: 36px 28px 80px; }

.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.brand .logo {
  width: 34px; height: 34px; border-radius: 8px; background: var(--ink);
  color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 17px;
}
.brand b { font-size: 17px; letter-spacing: 0.34em; text-transform: uppercase; }
.brand small { display: block; color: var(--ink-faint); font-size: 9px; letter-spacing: 0.32em; text-transform: uppercase; }

.section-title { font-size: 15px; letter-spacing: 0.3em; text-transform: uppercase; font-weight: 700; }
.intro { font-size: 12px; line-height: 1.7; color: var(--ink-soft); max-width: 720px; margin: 10px 0 24px; }

.panel { border: 1px solid var(--ink); background: var(--paper); padding: 20px; }
.row { display: grid; gap: 18px; }
@media (min-width: 880px) { .twocol { grid-template-columns: 1fr 1fr; } }

.field label { font-size: 8px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; display: block; margin-bottom: 7px; }
select, textarea {
  width: 100%; background: transparent; border: 1px solid var(--ink-hairline);
  color: var(--ink); font-family: inherit; font-size: 12px; padding: 10px 12px; outline: none;
}
select:focus, textarea:focus { border-color: var(--ink); }
textarea { min-height: 200px; line-height: 1.6; resize: vertical; font-size: 12px; }

.drop {
  border: 1px dashed var(--ink-faint); background: var(--paper); padding: 26px;
  text-align: center; cursor: pointer; transition: border-color 0.2s ease;
}
.drop:hover { border-color: var(--ink); }
.drop.has { border-style: solid; border-color: var(--ink); }

.btn {
  background: var(--ink); color: var(--bg); border: 1px solid var(--ink);
  font-family: inherit; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
  font-weight: 700; padding: 12px 22px; cursor: pointer; transition: opacity 0.2s ease;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); }

.muted { color: var(--ink-soft); font-size: 11px; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(230,226,226,0.4); border-top-color: var(--bg); border-radius: 50%; animation: s 0.7s linear infinite; vertical-align: middle; }
@keyframes s { to { transform: rotate(360deg); } }

.extract { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
@media (max-width: 720px) { .extract { grid-template-columns: repeat(2, 1fr); } }
.ex { border: 1px solid var(--ink-hairline); padding: 11px 13px; }
.ex .l { font-size: 7px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); }
.ex .v { font-size: 17px; font-weight: 700; margin-top: 4px; }

.verdict { border: 1px solid var(--ink); padding: 16px 18px; margin: 18px 0; display: flex; align-items: center; gap: 14px; }
.verdict.PASS { border-left: 4px solid var(--green); }
.verdict.REVIEW { border-left: 4px solid var(--alert); }
.verdict.FAIL { border-left: 4px solid var(--alert); }
.badge { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700; padding: 4px 10px; border: 1px solid var(--ink); }
.badge.solid { background: var(--ink); color: var(--bg); }

.hurdle { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--ink-hairline); font-size: 11px; }
.hurdle:last-child { border-bottom: none; }
.hurdle .name { flex: 1; }
.hurdle .target { width: 120px; text-align: right; color: var(--ink-soft); font-family: "Courier New", monospace; }
.check { width: 16px; height: 16px; border: 1px solid var(--ink); display: grid; place-items: center; font-size: 9px; flex-shrink: 0; }
.check.pass { background: var(--ink); color: var(--bg); }
.check.fail { border-color: var(--alert); color: var(--alert); }

.memo { background: #fbfaf9; border: 1px solid var(--ink); padding: 22px 26px; line-height: 1.65; font-size: 13px; }
.memo h2 { font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 6px; margin: 22px 0 10px; }
.memo h2:first-child { margin-top: 0; }
.memo table { width: 100%; border-collapse: collapse; font-size: 11px; margin: 6px 0; }
.memo td, .memo th { border: 1px solid var(--ink-hairline); padding: 6px 9px; text-align: left; }
.memo th { background: var(--ink); color: var(--bg); font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; }
.memo ul { margin: 6px 0; padding-left: 20px; }
.memo code { font-family: "Courier New", monospace; }

.err { border: 1px solid var(--alert); border-left: 4px solid var(--alert); padding: 12px 14px; font-size: 12px; color: var(--alert); margin-top: 14px; }
.tag { font-size: 7px; letter-spacing: 0.16em; text-transform: uppercase; border: 1px solid var(--ink-hairline); padding: 2px 7px; color: var(--ink-soft); }
.spin.dark { border-color: rgba(0,9,25,0.25); border-top-color: var(--ink); }
.chart-label { font-size: 8px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 12px; }

/* top nav */
.topnav { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--ink); padding-bottom: 14px; margin-bottom: 26px; flex-wrap: wrap; gap: 12px; }
.navlinks { display: flex; gap: 6px; flex-wrap: wrap; }
.navlink { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700; padding: 8px 13px; border: 1px solid var(--ink-hairline); color: var(--ink-soft); text-decoration: none; }
.navlink:hover { border-color: var(--ink); color: var(--ink); }
.navlink.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* landing cards */
.cards { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .cards { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1100px) { .cards { grid-template-columns: repeat(4, 1fr); } }
.card { border: 1px solid var(--ink); background: var(--paper); padding: 22px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 8px; transition: background 0.15s ease; }
.card:hover { background: #fff; }
.card-n { font-family: "Courier New", monospace; font-size: 11px; color: var(--ink-soft); }
.card-t { font-size: 14px; font-weight: 700; letter-spacing: 0.04em; }
.card-d { font-size: 11px; line-height: 1.6; color: var(--ink-soft); flex: 1; }
.card-go { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700; margin-top: 6px; }

/* chat */
.chat { border: 1px solid var(--ink); background: var(--paper); display: flex; flex-direction: column; height: 460px; }
.chat-head { padding: 13px 16px; border-bottom: 1px solid var(--ink-hairline); display: flex; align-items: center; gap: 9px; font-size: 8px; letter-spacing: 0.3em; text-transform: uppercase; font-weight: 700; }
.chat-head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
.chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.kmsg { max-width: 88%; padding: 11px 13px; font-size: 12px; line-height: 1.6; border-radius: 10px; }
.kmsg.bot { background: rgba(0,9,25,0.05); border: 1px solid rgba(0,9,25,0.08); align-self: flex-start; }
.kmsg.user { background: rgba(0,9,25,0.09); border: 1px solid rgba(0,9,25,0.15); align-self: flex-end; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
.chip { flex: 0 0 auto; border: 1px solid var(--ink-hairline); border-radius: 30px; background: transparent; padding: 6px 11px; font-size: 10px; font-family: inherit; color: var(--ink-soft); cursor: pointer; }
.chip:hover { border-color: var(--ink); color: var(--ink); }
.chat-input { border-top: 1px solid var(--ink-hairline); padding: 10px 12px; display: flex; gap: 8px; }
.chat-input input { flex: 1; background: transparent; border: 1px solid var(--ink-hairline); color: var(--ink); font-family: inherit; font-size: 12px; padding: 9px 11px; outline: none; }
.chat-input input:focus { border-color: var(--ink); }
.chat-input .btn { padding: 9px 16px; }

/* report document */
.reportdoc { background: #fbfaf9; border: 1px solid var(--ink); }
.rd-head { background: var(--ink); color: var(--bg); padding: 22px 26px; }
.rd-kicker { font-size: 7px; letter-spacing: 0.34em; text-transform: uppercase; opacity: 0.7; }
.rd-title { font-size: 19px; font-weight: 700; letter-spacing: 0.04em; margin-top: 6px; }
.rd-sub { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.65; margin-top: 5px; }
.rd-body { padding: 24px 26px; }
.rd-body h4 { font-size: 8px; letter-spacing: 0.3em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 7px; margin: 24px 0 12px; }
.rd-body h4:first-child { margin-top: 0; }
.rd-body p { font-size: 12px; line-height: 1.7; color: rgba(0,9,25,0.78); margin: 0; }
.rd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 700px) { .rd-grid { grid-template-columns: repeat(2, 1fr); } }
.rd-kpi { border: 1px solid var(--ink-hairline); padding: 12px 13px; }
.rd-kpi .l { font-size: 7px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); }
.rd-kpi .v { font-size: 18px; font-weight: 700; margin-top: 5px; }
.rd-kpi .d { font-size: 7px; letter-spacing: 0.1em; color: var(--ink-soft); margin-top: 3px; }
.rd-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.rd-table th { text-align: left; font-size: 7px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); padding: 8px 10px; border-bottom: 1px solid var(--ink); }
.rd-table td { padding: 9px 10px; border-bottom: 1px solid var(--ink-hairline); }
.rd-table .num { text-align: right; font-family: "Courier New", monospace; }
.rd-foot { background: var(--paper); border-top: 1px solid var(--ink-hairline); padding: 14px 26px; font-size: 8px; letter-spacing: 0.1em; color: var(--ink-soft); line-height: 1.6; }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
@media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi { border: 1px solid var(--ink); padding: 14px; text-align: center; }
.kpi .kv { font-size: 21px; font-weight: 700; }
.kpi .kl { font-size: 7px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink-soft); margin-top: 4px; }
.kpi .kd { font-size: 7px; letter-spacing: 0.06em; color: var(--ink-soft); margin-top: 3px; }

/* alerts */
.alert { display: flex; gap: 14px; align-items: flex-start; border: 1px solid var(--ink-hairline); background: var(--paper); padding: 13px 15px; margin-bottom: 10px; }
.alert.crit { border-left: 3px solid var(--alert); }
.alert.warn { border-left: 3px solid var(--ink); }
.alert.info { border-left: 3px solid var(--ink-faint); }
.alert .ai { font-family: "Courier New", monospace; width: 16px; text-align: center; flex-shrink: 0; }
.alert.crit .ai { color: var(--alert); }
.alert .at { font-size: 12px; font-weight: 700; }
.alert .ad { font-size: 11px; line-height: 1.55; color: var(--ink-soft); margin-top: 4px; }

/* ladder */
.ladder { display: flex; align-items: flex-end; gap: 16px; height: 170px; padding: 10px 4px 0; border-bottom: 1px solid var(--ink-hairline); }
.lcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; }
.lbar { width: 60%; max-width: 48px; min-height: 2px; }
.lv { font-size: 7px; font-family: "Courier New", monospace; }
.ly { font-size: 7px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }

/* horizontal bars */
.hbar-row { display: flex; align-items: center; gap: 10px; margin: 9px 0; }
.hbar-name { width: 130px; flex-shrink: 0; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
.hbar-track { flex: 1; height: 14px; background: rgba(0,9,25,0.05); }
.hbar-fill { height: 100%; }
.hbar-v { width: 44px; text-align: end; font-family: "Courier New", monospace; font-size: 10px; font-weight: 700; }

/* facility table */
.dtable { width: 100%; border-collapse: collapse; font-size: 11px; }
.dtable th { background: var(--ink); color: var(--bg); font-size: 7px; letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 10px; text-align: start; }
.dtable td { padding: 9px 10px; border-bottom: 1px solid var(--ink-hairline); }
.dtable .num { text-align: end; font-family: "Courier New", monospace; }
.pill { font-size: 7px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; padding: 3px 8px; border: 1px solid var(--ink-hairline); }
.pill.watch { border-color: var(--alert); color: var(--alert); }
.pill.refi { border-color: var(--ink); color: var(--ink); }
.pill.healthy { color: var(--green); border-color: var(--green); }

/* marketing & sales */
.score { display: flex; align-items: center; gap: 8px; min-width: 110px; }
.score-track { flex: 1; height: 8px; background: rgba(0,9,25,0.07); }
.score-fill { height: 100%; background: var(--ink); }
.score b { font-family: "Courier New", monospace; font-size: 11px; width: 24px; text-align: right; }
.pill.scale { color: var(--green); border-color: var(--green); }
.pill.fix { border-color: var(--ink); color: var(--ink); }
.pill.review { border-color: var(--alert); color: var(--alert); }
.pill.hold, .pill.idle, .pill.ok { color: var(--ink-soft); }
.pill.strong { color: var(--green); border-color: var(--green); }
.pill.weak { border-color: var(--alert); color: var(--alert); }
.pill.live { border-color: var(--ink); color: var(--ink); }
.pill.paused { color: var(--ink-soft); }
.trend { display: flex; align-items: flex-end; gap: 14px; height: 170px; padding: 10px 4px 0; border-bottom: 1px solid var(--ink-hairline); }
.tcol { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
.tbars { display: flex; align-items: flex-end; gap: 4px; width: 100%; justify-content: center; flex: 1; }
.tbar { width: 38%; max-width: 26px; min-height: 2px; }
.legend { display: flex; gap: 16px; margin-top: 10px; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: -1px; }
.rec { border: 1px solid var(--ink); background: var(--paper); padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.rec .rt { font-size: 12px; font-weight: 700; }
.rec .rd { font-size: 11px; line-height: 1.55; color: var(--ink-soft); margin-top: 4px; }
.rec .btn { padding: 9px 16px; font-size: 9px; }
.note { white-space: pre-wrap; font-size: 12px; line-height: 1.65; border: 1px solid var(--ink); background: #fbfaf9; padding: 16px 18px; margin-top: 12px; }
.logrow { display: flex; gap: 12px; font-size: 11px; padding: 8px 0; border-bottom: 1px solid var(--ink-hairline); }
.logrow:last-child { border-bottom: none; }
.logrow .lt { width: 96px; flex-shrink: 0; color: var(--ink-soft); font-family: "Courier New", monospace; font-size: 10px; }

/* recommendations / email editor */
.in { width: 100%; background: transparent; border: 1px solid var(--ink-hairline); color: var(--ink); font-family: inherit; font-size: 12px; padding: 9px 11px; outline: none; }
.in:focus { border-color: var(--ink); }
.in[readonly] { color: var(--ink-soft); background: rgba(0,9,25,0.03); }
details > summary { list-style: none; }

/* chat assistant */
.chat-fab { position: fixed; right: 22px; bottom: 22px; z-index: 50; background: var(--ink); color: var(--bg); border: none; font-family: inherit; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; font-weight: 700; padding: 16px 24px; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 24px rgba(0,9,25,0.25); }
.chat-fab:hover { opacity: 0.9; }
.chat-badge { background: var(--bg); color: var(--ink); border-radius: 10px; padding: 1px 7px; font-size: 10px; letter-spacing: 0; }
.chat-badge.hot { background: var(--alert); color: #fff; }
.chat-drawer { position: fixed; right: 16px; bottom: 16px; z-index: 50; width: 460px; max-width: calc(100vw - 32px); height: min(780px, calc(100vh - 32px)); background: var(--paper); border: 1px solid var(--ink); display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,9,25,0.3); }
.chat-drawer .chat-log { min-height: 0; }
.chat-drawer .kmsg { font-size: 12px; }
@media (max-width: 560px) { .chat-drawer { right: 0; bottom: 0; width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; border: none; } }

/* language toggle */
.lang-toggle { font-family: inherit; background: transparent; cursor: pointer; }

/* ---- Arabic / right-to-left ---- */
[dir="rtl"] * { letter-spacing: 0 !important; }
[dir="rtl"] body { line-height: 1.7; }
/* Arabic glyphs are illegible at the 7–9px sizes used for Latin caps labels */
[dir="rtl"] th, [dir="rtl"] .kl, [dir="rtl"] .kd, [dir="rtl"] .tag, [dir="rtl"] .pill, [dir="rtl"] .badge, [dir="rtl"] .ly, [dir="rtl"] .lv,
[dir="rtl"] .hbar-name, [dir="rtl"] .field label, [dir="rtl"] .legend, [dir="rtl"] .chip { font-size: 11px; }
[dir="rtl"] .chart-label, [dir="rtl"] .navlink, [dir="rtl"] .btn, [dir="rtl"] .chat-head { font-size: 12px; }
[dir="rtl"] .brand small { font-size: 11px; }
[dir="rtl"] .ad, [dir="rtl"] .rd, [dir="rtl"] .muted, [dir="rtl"] .logrow, [dir="rtl"] .dtable td { font-size: 12px; }
[dir="rtl"] .kmsg { font-size: 13px; }
[dir="rtl"] .alert.crit, [dir="rtl"] .alert.warn, [dir="rtl"] .alert.info { border-left-width: 1px; border-left-color: var(--ink-hairline); }
[dir="rtl"] .alert.crit { border-right: 3px solid var(--alert); }
[dir="rtl"] .alert.warn { border-right: 3px solid var(--ink); }
[dir="rtl"] .alert.info { border-right: 3px solid var(--ink-faint); }
[dir="rtl"] .chat-fab { right: auto; left: 22px; }
[dir="rtl"] .chat-drawer { right: auto; left: 16px; }
@media (max-width: 560px) { [dir="rtl"] .chat-drawer { left: 0; } }
[dir="rtl"] .score b { text-align: end; }

/* vendor agent pages */
.dec { border: 1px solid var(--ink-hairline); background: var(--paper); padding: 16px 18px; margin-bottom: 12px; }
.dec-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dec-badge { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; padding: 5px 10px; border: 1px solid var(--ink); }
.dec-badge.EXIT, .dec-badge.TEST_REPLACEMENT { background: var(--alert); border-color: var(--alert); color: #fff; }
.dec-badge.PERFORMANCE_PLAN { background: var(--ink); color: var(--bg); }
.dec-badge.RENEGOTIATE { color: var(--ink); }
.dec-badge.RE_ENGAGE { border-color: var(--green); color: var(--green); }
.dec ul { margin: 8px 0 0; padding-inline-start: 18px; font-size: 11px; line-height: 1.6; color: var(--ink-soft); }
.range { position: relative; height: 10px; background: rgba(0,9,25,0.06); min-width: 120px; }
.range .band { position: absolute; top: 0; bottom: 0; background: rgba(0,9,25,0.18); }
.range .pt { position: absolute; top: -2px; width: 3px; height: 14px; background: var(--ink); }
.range .par { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--alert); left: 50%; }
.doc { background: #fbfaf9; border: 1px solid var(--ink); padding: 22px 26px; }
.doc h3 { font-size: 15px; margin: 0 0 4px; }
.doc h4 { font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 6px; margin: 20px 0 10px; }
.doc ul { margin: 0; padding-inline-start: 18px; font-size: 12px; line-height: 1.7; }
.grid3 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.ok { color: var(--green); } .bad { color: var(--alert); }
@media print {
  body * { visibility: hidden !important; }
  .print-area, .print-area * { visibility: visible !important; }
  .print-area { position: absolute; inset: 0; border: none; }
  .no-print { display: none !important; }
}
[dir="rtl"] .doc h4 { font-size: 12px; }
