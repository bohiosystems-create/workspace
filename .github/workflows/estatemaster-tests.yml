name: EstateMaster agent tests

on:
  push:
    paths:
      - 'estatemaster-agent/**'
      - 'estatemaster-agent-api/**'
      - '.github/workflows/estatemaster-tests.yml'
  pull_request:
    paths:
      - 'estatemaster-agent/**'
      - 'estatemaster-agent-api/**'
  schedule:
    - cron: '17 1 * * *'   # every night (01:17 UTC): the full suite on all three builds and the Jadwa edition
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick (default), full, server or jadwa'
        default: quick

# a newer push to the same branch cancels the run still going on the older commit: one result per branch, for the code that is
# actually there (a cancelled run sends no failure email); the nightly full run is never cancelled
concurrency:
  group: estatemaster-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  tests:
    runs-on: ubuntu-24.04   # Playwright 1.56.1 has no Chromium build for ubuntu-latest (26.04)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build check (the dist builds and the mock-API mirror must match their sources)
        run: |
          cd estatemaster-agent && python3 tools/build_options.py && cd ../estatemaster-agent-api && python3 tools/mirror_from_option2.py && cd ..
          git diff --exit-code --stat -- estatemaster-agent/dist estatemaster-agent-api/index.html estatemaster-agent/index.html || { echo "::error::dist or mirror out of date: run the build tools and commit"; exit 1; }
      - name: Syntax check (inline scripts and serverless functions)
        run: |
          for f in estatemaster-agent/index.html estatemaster-agent/dist/option2-readonly/index.html estatemaster-agent/dist/option3-analyst/index.html estatemaster-agent/dist/jadwa-readonly/index.html estatemaster-agent-api/index.html; do
            python3 -c "import re,sys;s=open('$f').read();open('/tmp/chk.js','w').write('\n'.join(re.findall(r'<script>([\s\S]*?)</script>',s)))" && node --check /tmp/chk.js || exit 1; done
          for f in estatemaster-agent/api/*.js estatemaster-agent/api/_lib/*.js estatemaster-agent/dist/jadwa-readonly/api/_lib/*.js estatemaster-agent-api/api/*.js estatemaster-agent-api/api/_lib/*.js; do node --check "$f" || exit 1; done
      - name: Deploy build check (the page splits into cached assets that still parse)
        run: |
          npm ci --prefix estatemaster-agent/tools/node --no-audit --no-fund
          for b in estatemaster-agent/dist/option2-readonly estatemaster-agent/dist/option3-analyst estatemaster-agent/dist/jadwa-readonly estatemaster-agent-api; do
            out=$(mktemp -d); python3 estatemaster-agent/tools/split_assets.py $b/index.html $out && for f in $out/assets/*.js; do node --check $f || exit 1; done; done
      - name: Install Playwright
        run: |
          cd estatemaster-agent/tests && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium
      - name: Run tests
        run: cd estatemaster-agent/tests && bash run.sh "${{ github.event_name == 'schedule' && 'full' || github.event.inputs.mode || 'quick' }}"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            estatemaster-agent/tests/last-run.log
            estatemaster-agent/tests/last-run.log.full
          if-no-files-found: ignore

  # every night, beside the full suite: the answer-path set on the Jadwa edition (its own look and words), so a change to the
  # source or to tools/brand_jadwa.py that breaks the client's build is seen the next morning
  jadwa:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04   # Playwright 1.56.1 has no Chromium build for ubuntu-latest (26.04)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          cd estatemaster-agent/tests && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium
      - name: Run the Jadwa edition tests
        run: cd estatemaster-agent/tests && TEST_LOG="$PWD/jadwa-run.log" bash run.sh jadwa
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jadwa-test-logs
          path: |
            estatemaster-agent/tests/jadwa-run.log
            estatemaster-agent/tests/jadwa-run.log.full
          if-no-files-found: ignore

  # every night: the second formula engine (lo-service, LibreOffice) end to end, on the workbook the browser engine cannot run
  server-engine:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04   # Playwright 1.56.1 has no Chromium build for ubuntu-latest (26.04)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install LibreOffice and Playwright
        run: |
          bash estatemaster-agent/tools/install_lo.sh libreoffice-calc-nogui python3-uno
          cd estatemaster-agent/tests && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium
      - name: Run the server engine test
        run: |
          cd estatemaster-agent/lo-service && (LO_TOKEN=test PORT=8099 python3 server.py &) && for i in $(seq 1 60); do curl -s localhost:8099/health | grep -q '"ok": true' && break; sleep 1; done
          cd .. && (python3 -m http.server 4090 >/dev/null 2>&1 &) && sleep 1 && cd tests && LO_TEST_URL=http://localhost:8099 node t_loengine.mjs "http://localhost:4090/?mode=readonly"
