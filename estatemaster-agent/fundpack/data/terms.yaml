  ar_syn: [تستحق يومياً, تحتسب بشكل يومي, تحتسب في كل يوم تقويم]
  def_en: Accrued daily, usually paid quarterly or semi-annually.
  def_ar: تستحق يومياً وتدفع عادة بشكل ربع أو نصف سنوي.
  schema_path: fees[].accrual
  verified: market_usage
  source: Market usage

# ---------------------------------------------------------------- financing & Islamic finance
- id: borrowing
  category: financing
  en: Borrowing / Financing
  ar: الاقتراض
  en_syn: [leverage, debt, financing, gearing, loan facility, credit facility]
  ar_syn: [التمويل, التسهيلات الائتمانية, الحصول على تمويل, القروض, التسهيلات البنكية]
  def_en: Fund borrowing; capped at 50% of total assets per last reviewed financial statements (100% for a parallel-market REIT).
  def_ar: لا يجوز للصندوق الاقتراض بما يتجاوز (50%) من إجمالي قيمة أصوله وفقاً لآخر قوائم مالية مراجعة.
  schema_path: financing.max_borrowing_pct
  verified: cma_reif
  source: REIF Regulations art. 41(b)

- id: ltv
  category: financing
  en: Loan-to-Value (LTV)
  ar: نسبة التمويل إلى القيمة
  en_syn: [LTV, gearing ratio, debt to total assets]
  ar_syn: [نسبة القرض إلى القيمة, نسبة المديونية, نسبة الدين إلى إجمالي الأصول]
  def_en: Debt divided by asset value.
  def_ar: نسبة التمويل إلى قيمة الأصول.
  schema_path: financing.target_ltv_pct
  verified: market_usage
  source: Market usage

- id: murabaha
  category: islamic_finance
  en: Murabaha
  ar: المرابحة
  en_syn: [murabaha facility, commodity murabaha, tawarruq]
  ar_syn: [مرابحة, تمويل بالمرابحة, التورق, مرابحة السلع]
  def_en: Cost-plus sale financing; the most common Shariah-compliant fund facility. Model the profit rate like interest.
  def_ar: بيع بالتكلفة مع هامش ربح معلوم، وهي أكثر صيغ التمويل المتوافقة مع الشريعة شيوعاً للصناديق.
  schema_path: financing.instrument
  verified: market_usage
  source: Market usage; AAOIFI Shariah Standard 8 (concept)

- id: ijara
  category: islamic_finance
  en: Ijara
  ar: الإجارة
  en_syn: [ijarah, ijara muntahia bittamleek, lease-to-own financing]
  ar_syn: [إجارة, الإجارة المنتهية بالتمليك]
  def_en: Lease-based financing; the financier owns the asset and leases it to the fund.
  def_ar: تمويل قائم على الإيجار يتملك فيه الممول الأصل ويؤجره للصندوق.
  schema_path: financing.instrument
  verified: market_usage
  source: Market usage; AAOIFI Shariah Standard 9 (concept)

- id: sukuk
  category: islamic_finance
  en: Sukuk
  ar: الصكوك
  en_syn: [sukuk issuance, Islamic bonds]
  ar_syn: [صكوك, إصدار صكوك]
  def_en: Shariah-compliant certificates representing ownership in assets or their returns.
  def_ar: شهادات متوافقة مع الشريعة تمثل حصصاً في ملكية أصول أو عوائدها.
  schema_path: financing.instrument
  verified: market_usage
  source: Market usage; AAOIFI Shariah Standard 17 (concept)

- id: saibor
  category: financing
  en: SAIBOR
  ar: سايبور
  en_syn: [Saudi interbank offered rate, SIBOR]
  ar_syn: [سعر العرض بين البنوك السعودية, معدل سايبور, سايبور 3 أشهر]
  def_en: Saudi interbank benchmark used to price floating-rate facilities (rate + margin).
  def_ar: سعر العرض بين البنوك السعودية، ويستخدم مرجعاً لتسعير التمويل بهامش متغير.
  schema_path: financing.benchmark
  verified: market_usage
  source: Market usage

- id: profit_margin_financing
  category: financing
  en: Financing Margin
  ar: هامش الربح
  en_syn: [margin, spread, profit rate]
  ar_syn: [الهامش, معدل الربح, هامش التمويل]
  def_en: Spread over benchmark charged by the financier.
  def_ar: الهامش الذي يضيفه الممول على السعر المرجعي.
  schema_path: financing.margin_pct
  verified: market_usage
  source: Market usage

- id: shariah_compliant
  category: islamic_finance
  en: Shariah Compliant
  ar: متوافق مع أحكام الشريعة الإسلامية
  en_syn: [shariah-compliant, Islamic]
  ar_syn: [متوافق مع ضوابط الشريعة الإسلامية, متوافق مع الشريعة, متوافق مع المعايير الشرعية]
  def_en: Fund certified Shariah compliant by its Shariah board.
  def_ar: صندوق أجازت هيئته الشرعية توافقه مع أحكام الشريعة الإسلامية.
  schema_path: fund.shariah_compliant
  verified: cma_reif
  source: REIF Regulations Annex 1 cover page (g)

# ---------------------------------------------------------------- tax & zakat
- id: rett
  category: tax
  en: Real Estate Transaction Tax (RETT)
  ar: ضريبة التصرفات العقارية
  en_syn: [RETT, transfer tax, real estate disposal tax]
  ar_syn: [ضريبة التصرف العقاري]
  def_en: 5% of disposal value on real estate transfers, collected by ZATCA; exemptions exist (check implementing regulations).
  def_ar: ضريبة بنسبة 5% من قيمة التصرف العقاري تحصلها هيئة الزكاة والضريبة والجمارك، مع وجود حالات إعفاء.
  schema_path: taxes.rett
  verified: market_usage
  source: RETT Law (Royal Decree M/84) and Implementing Regulations effective 10 Apr 2025
- id: vat
  category: tax
  en: Value Added Tax (VAT)
  ar: ضريبة القيمة المضافة
  en_syn: [VAT]
  ar_syn: []
  def_en: 15% standard rate; residential leases generally exempt, commercial leases standard-rated; fund fees usually quoted ex-VAT.
  def_ar: بنسبة 15%، وتعفى عادة إيجارات العقارات السكنية بينما تخضع الإيجارات التجارية للنسبة الأساسية.
  schema_path: taxes.vat
  verified: market_usage
  source: VAT Law; Trowers & Hamlins (Jul 2026)
- id: zakat
  category: tax
  en: Zakat
  ar: الزكاة
  en_syn: [zakat base, zakat liability]
  ar_syn: [الوعاء الزكوي, زكاة]
  def_en: 2.5% on the zakat base for a Hijri year (adjusted by days for a Gregorian year). Fund-level treatment depends on the fund's ZATCA registration; check T&Cs.
  def_ar: بنسبة 2.5% من الوعاء الزكوي عن السنة الهجرية، وتعدل حسب عدد الأيام للسنة الميلادية.
  schema_path: taxes.zakat
  verified: market_usage
  source: ZATCA Zakat Implementing Regulations (verify current version)
- id: white_land_fee
  category: tax
  en: White Land Fee
  ar: رسوم الأراضي البيضاء
  en_syn: [white land tax, vacant land levy, idle land fee]
  ar_syn: [رسم الأراضي البيضاء, رسوم الأراضي البيضاء والعقارات الشاغرة]
  def_en: Annual fee up to 10% of assessed value on qualifying undeveloped urban land (zones 2.5%-10%); vacant building fee also applies.
  def_ar: رسم سنوي يصل إلى 10% من قيمة الأرض البيضاء المستحقة داخل النطاق العمراني.
  schema_path: taxes.white_land_fee
  verified: market_usage
  source: White Land and Vacant Property Fees Law (amended 2025)
- id: rega
  category: regulators
  en: Real Estate General Authority (REGA)
  ar: الهيئة العامة للعقار
  en_syn: [REGA]
  ar_syn: []
  def_en: Authority for real estate, including foreign ownership and the real estate registry.
  def_ar: الجهة المختصة بتنظيم القطاع العقاري بما في ذلك تملك غير السعوديين.
  schema_path: null
  verified: market_usage
  source: Law of Real Estate Ownership by Non-Saudis (in force 22 Jan 2026)
- id: zatca
  category: regulators
  en: Zakat, Tax and Customs Authority (ZATCA)
  ar: هيئة الزكاة والضريبة والجمارك
  en_syn: [ZATCA, GAZT]
  ar_syn: [الهيئة العامة للزكاة والدخل]
  def_en: Tax and zakat authority.
  def_ar: الجهة المسؤولة عن الزكاة والضرائب.
  schema_path: null
  verified: market_usage
  source: Market usage
- id: cma
  category: regulators
  en: Capital Market Authority (CMA)
  ar: هيئة السوق المالية
  en_syn: [CMA, the Authority]
  ar_syn: [الهيئة]
  def_en: Securities regulator; approves and supervises funds.
  def_ar: الجهة المنظمة للسوق المالية في المملكة.
  schema_path: null
  verified: cma_glossary
  source: CMA Glossary of Defined Terms (2025)
- id: taqeem
  category: regulators
  en: Saudi Authority for Accredited Valuers (TAQEEM)
  ar: الهيئة السعودية للمقيمين المعتمدين
  en_syn: [TAQEEM]
  ar_syn: [تقييم]
  def_en: Licenses accredited valuers; fund valuers need its fellowship.
  def_ar: الجهة المرخصة للمقيمين المعتمدين.
  schema_path: null
  verified: cma_reif
  source: REIF Regulations art. 36(b),(g)
- id: main_market
  category: regulators
  en: Main Market
  ar: السوق الرئيسية
  en_syn: [Tadawul main market, TASI]
  ar_syn: [السوق الرئيسية تداول]
  def_en: Main market of the Saudi Exchange.
  def_ar: السوق التي تتداول فيها الأسهم المسجلة والمطروحة بموجب الباب الرابع من قواعد طرح الأوراق المالية والالتزامات المستمرة.
  schema_path: fund.listing_market
  verified: cma_glossary
  source: CMA Glossary of Defined Terms (2025)
- id: parallel_market
  category: regulators
  en: Parallel Market (Nomu)
  ar: السوق الموازية
  en_syn: [Nomu]
  ar_syn: [نمو, السوق الموازية نمو]
  def_en: Parallel market of the Saudi Exchange; REIT units there are limited to qualified investors.
  def_ar: السوق التي تتداول فيها الأسهم المسجلة والمطروحة بموجب الباب الثامن من قواعد طرح الأوراق المالية والالتزامات المستمرة.
  schema_path: fund.listing_market
  verified: cma_glossary
  source: CMA Glossary of Defined Terms (2025)
- id: qualified_investor
  category: parties
  en: Qualified Investor
  ar: مستثمر مؤهل
  en_syn: [qualified investors, sophisticated investor]
  ar_syn: [المستثمرون المؤهلون, المستثمر المؤهل]
  def_en: Investor category eligible for parallel-market REIT offerings (institutions, funds, GCC entities, natural persons meeting wealth/experience tests).
  def_ar: فئات المستثمرين المحددة في قائمة المصطلحات المؤهلة للاستثمار في الصناديق المتداولة في السوق الموازية.
  schema_path: fund.eligible_investors
  verified: cma_glossary
  source: CMA Glossary of Defined Terms (2025)

# ---------------------------------------------------------------- risk
- id: risk_classification
  category: risk
  en: Risk Classification
  ar: درجة المخاطر
  en_syn: [risk rating, risk level, risk profile]
  ar_syn: [تصنيف المخاطر, مستوى المخاطر]
  def_en: Risk classification the T&Cs must set for the fund.
  def_ar: تصنيف المخاطر الذي يجب أن تحدده الشروط والأحكام للصندوق.
  schema_path: fund.risk_classification
  verified: cma_reif
  source: REIF Regulations Annex 1 item 7(c)
